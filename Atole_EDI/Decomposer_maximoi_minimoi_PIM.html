<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Décomposer une tâche complexe : maximoi, minimoi et PIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>
/* Fenêtre façon « Configuration du système » de KDE : barre latérale, une page à la fois, cadres Breeze. */
:root {
  --win: #EFF0F1; --view: #FCFCFC; --view-alt: #F3F4F5; --line: #D3D7DB; --line-strong: #BDC3C7;
  --ink: #232629; --ink-2: #4A5056; --ink-3: #676E75;
  --accent: #3DAEE9; --accent-ink: #1D6FA0; --accent-tint: rgba(61,174,233,.14); --accent-line: rgba(61,174,233,.6);
  --good: #27AE60; --good-tint: rgba(39,174,96,.14); --warn: #E67700; --warn-tint: rgba(230,119,0,.13);
  --bad: #DA4453; --bad-tint: rgba(218,68,83,.12); --neutral-tint: rgba(103,110,117,.12);
  /* I, P, M : trois teintes discrètes, toujours dans le même ordre (signalement) */
  --kI: #2980B9; --kP: #8E44AD; --kM: #16A085;
  --shadow: 0 1px 2px rgba(35,38,41,.06);
  --font: "Noto Sans", "Noto Sans UI", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Noto Sans Mono", "Hack", ui-monospace, monospace; --r: 5px;
}
@media (prefers-color-scheme: dark) { :root {
  --win: #31363B; --view: #232629; --view-alt: #2A2E32; --line: #41474D; --line-strong: #565D64;
  --ink: #EFF0F1; --ink-2: #C8CDD1; --ink-3: #9EA6AD; --accent-ink: #7CC7F0; --accent-tint: rgba(61,174,233,.18);
  --good-tint: rgba(39,174,96,.2); --warn-tint: rgba(224,108,0,.2); --bad-tint: rgba(218,68,83,.2); --neutral-tint: rgba(158,166,173,.14);
  --kI: #4DA3DB; --kP: #B07CC6; --kM: #2FC2A4; --shadow: none; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--win); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; box-shadow: 0 0 0 3px var(--accent-tint); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent-ink); }
.muted { color: var(--ink-3); } .small { font-size: 13px; } .tnum { font-variant-numeric: tabular-nums; }
.lbl { display: block; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }

/* Fenêtre */
.app { display: grid; grid-template-columns: 260px minmax(0,1fr); min-height: 100vh; }
.side { background: var(--view); border-right: 1px solid var(--line); padding: 18px 0; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side-head { padding: 0 18px; display: grid; gap: 2px; }
.side-kicker { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.side-title { font-size: 18px; font-weight: 600; }
.side-sub { font-size: 13px; color: var(--ink-3); }
.navgroup { display: grid; gap: 2px; padding: 0 8px 8px; }
.navlab { font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 6px 10px 2px; }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border: 1px solid transparent; border-radius: var(--r); background: none; cursor: pointer; text-align: left; font-size: 14.5px; }
.nav-btn > svg { color: var(--ink-2); flex: none; }
.nav-btn:hover { background: var(--accent-tint); }
.nav-btn[aria-current="page"] { background: var(--accent-tint); border-color: var(--accent-line); font-weight: 600; }
.nav-btn .tick { margin-left: auto; color: var(--good); display: flex; }
.side-foot { margin-top: auto; padding: 0 18px; font-size: 12px; color: var(--ink-3); }
.main { min-width: 0; padding: 28px clamp(16px,3.4vw,44px) 40px; }
.page { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }
.page-head { display: grid; gap: 4px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.page-head h1 { font-size: 26px; font-weight: 600; }
.page-head p { color: var(--ink-2); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 6px; }

/* Composants Breeze */
.frame { background: var(--view); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.frame-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding: 14px 18px 0; }
.frame-head h2 { font-size: 16.5px; font-weight: 600; }
.frame-head .hint { font-size: 13px; color: var(--ink-3); }
.frame-body { padding: 12px 18px 18px; display: grid; gap: 12px; min-width: 0; }
.msg { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 10px; align-items: start; padding: 10px 14px; border: 1px solid var(--accent-line); background: var(--accent-tint); border-radius: var(--r); }
.msg > svg { margin-top: 2px; color: var(--accent-ink); }
.msg.good { border-color: var(--good); background: var(--good-tint); } .msg.good > svg { color: var(--good); }
.msg.warn { border-color: var(--warn); background: var(--warn-tint); } .msg.warn > svg { color: var(--warn); }
.msg.bad { border-color: var(--bad); background: var(--bad-tint); } .msg.bad > svg { color: var(--bad); }
.section-head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); padding-top: 6px; }
.section-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 500; border: 1px solid var(--line-strong); background: var(--view); white-space: nowrap; }
.chip.warn { border-color: var(--warn); background: var(--warn-tint); } .chip.neutral { background: var(--neutral-tint); border-color: transparent; }
.btnchip { cursor: pointer; } .btnchip:hover { border-color: var(--accent); background: var(--accent-tint); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view); cursor: pointer; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-tint); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { border-color: var(--accent); background: var(--accent-tint); font-weight: 600; }
.btn.danger { border-color: var(--bad); background: var(--bad-tint); }
.ibtn { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 1px solid transparent; border-radius: var(--r); background: none; cursor: pointer; color: var(--ink-2); }
.ibtn:hover:not(:disabled) { border-color: var(--line-strong); background: var(--accent-tint); }
.ibtn:disabled { opacity: .3; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .row.between { justify-content: space-between; } .row.end { justify-content: flex-end; } .row.wrap { gap: 12px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
.cols3 h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.cols3 p { color: var(--ink-2); font-size: 14.5px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.frame-body > .btn, .frame-body > .row > .btn { justify-self: start; }
.note { padding: 9px 12px; background: var(--view-alt); border-left: 2px solid var(--accent); border-radius: 0 var(--r) var(--r) 0; font-size: 14.5px; }
.notes { display: grid; gap: 8px; }
blockquote { margin: 0; padding: 7px 12px; border-left: 2px solid var(--line-strong); background: var(--view-alt); border-radius: 0 var(--r) var(--r) 0; font-size: 14.5px; color: var(--ink-2); }
ul.tight { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.big { font-size: 40px; font-weight: 600; } .big2 { font-size: 16px; }
.q { font-size: 16.5px; font-weight: 500; }

/* Numéros de niveau */
.num { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong); font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--view); }
.num.done { border-color: var(--good); background: var(--good-tint); color: var(--good); }

/* Accueil */
.steplist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.linkrow { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; padding: 7px 10px; border: 1px solid transparent; border-radius: var(--r); background: none; cursor: pointer; }
.linkrow:hover { background: var(--accent-tint); border-color: var(--accent-line); }
.lr-t { display: block; font-weight: 600; } .lr-s { display: block; font-size: 13.5px; color: var(--ink-3); }

/* Onglets et pastilles */
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); }
.tab { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border: 1px solid transparent; border-bottom: none; border-radius: var(--r) var(--r) 0 0; background: none; cursor: pointer; font-size: 14px; color: var(--ink-2); margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-tint); }
.tab[aria-selected="true"] { background: var(--view); border-color: var(--line); color: var(--ink); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }
.tab svg { color: var(--good); }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 32px; height: 32px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--view); cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.dot:hover { border-color: var(--accent); }
.dot[aria-selected="true"], .dot.cur { border-color: var(--accent); background: var(--accent-tint); color: var(--ink); }
.dot.done { box-shadow: inset 0 -3px 0 var(--good); }
.stages { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.stage { display: grid; gap: 4px; }

/* Fiches Comprendre */
.card .frame-body p { max-width: 72ch; }
.tree { display: grid; justify-items: center; gap: 22px; padding: 6px 0 4px; position: relative; }
.node { display: grid; text-align: center; padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view-alt); font-weight: 600; }
.node small { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
.node.max { border-color: var(--accent); background: var(--accent-tint); }
.branches { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; width: 100%; max-width: 620px; position: relative; }
.branches::before { content: ""; position: absolute; top: -12px; left: 12.5%; right: 12.5%; height: 1px; background: var(--line-strong); }
.branches .node::before { content: ""; position: absolute; }
.branches .node { position: relative; }
.branches .node::after { content: ""; position: absolute; top: -12px; left: 50%; width: 1px; height: 12px; background: var(--line-strong); }
.tree .max::after { content: ""; position: absolute; }
.pimdef { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.pimdef > div { padding: 10px 12px; border: 1px solid var(--line); border-top: 3px solid; border-radius: var(--r); background: var(--view-alt); }
.pimdef .kI { border-top-color: var(--kI); } .pimdef .kP { border-top-color: var(--kP); } .pimdef .kM { border-top-color: var(--kM); }
.pimdef p { font-size: 14.5px; }

/* PIM */
.pim { display: grid; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--view); }
.pim-tag { padding: 5px 12px; font-size: 12.5px; font-weight: 600; background: var(--view-alt); border-bottom: 1px solid var(--line); }
.pim-row { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 10px; padding: 7px 12px; border-left: 3px solid; }
.pim-row + .pim-row, .pim.edit > * + * { border-top: 1px solid var(--line); }
.kI.pim-row, .field.kI { border-left-color: var(--kI); } .kP.pim-row, .field.kP { border-left-color: var(--kP); } .kM.pim-row, .field.kM { border-left-color: var(--kM); }
.pim-lab { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
.kI .pim-lab, .kI > .field-lab, .pimdef .kI .pim-lab { color: var(--kI); } .kP .pim-lab, .kP > .field-lab, .pimdef .kP .pim-lab { color: var(--kP); } .kM .pim-lab, .kM > .field-lab, .pimdef .kM .pim-lab { color: var(--kM); }
.blank { color: var(--ink-3); font-style: italic; }
.pim.edit .field { border-left-width: 3px; border-left-style: solid; padding: 7px 12px; }
.trame { display: grid; gap: 12px; }
.maxi, .conn { padding: 9px 12px; border: 1px solid var(--accent-line); background: var(--accent-tint); border-radius: var(--r); font-weight: 500; }
.conn { border-color: var(--line); background: var(--view-alt); font-weight: 400; }
.expert { display: grid; gap: 4px; }
.minis { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.mini-t { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 6px; }
.mini-t.big2 { display: block; }
.src { margin-top: 2px; }

/* Glossaire */
.search { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view); min-width: 240px; }
.gloss { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.gl { padding: 12px 16px; display: grid; gap: 6px; align-content: start; }
.gl-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.gl h3 { font-size: 15.5px; font-weight: 600; }
.gl-ex { font-size: 14px; color: var(--ink-2); padding: 6px 10px; background: var(--view-alt); border-radius: var(--r); }
.gl-ex .lbl { display: inline; margin-right: 6px; }

/* Quiz */
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-tint); }
.opt.ok { border-color: var(--good); background: var(--good-tint); font-weight: 500; }
.opt.ko { border-color: var(--bad); background: var(--bad-tint); }
.opt:disabled { cursor: default; opacity: .6; } .opt.ok:disabled, .opt.ko:disabled { opacity: 1; }

/* Pièges */
.checklist { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 15.5px; }
.checklist.small { font-size: 14px; gap: 3px; }
.traps { display: grid; gap: 12px; }
.trap h3 { font-size: 15.5px; font-weight: 600; }
.trap .why { color: var(--ink-2); }
.trap-cols { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.trap .fix { font-size: 14.5px; }
.trap .test { font-size: 14.5px; padding: 7px 10px; background: var(--warn-tint); border-radius: var(--r); }
.trap .test .lbl { display: inline; margin-right: 6px; color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.tbl td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td:nth-child(2) { color: var(--ink-3); width: 20px; }

/* Ordre */
.order { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.order li { display: flex; align-items: center; gap: 10px; padding: 5px 6px 5px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--view); }
.order li.ok { border-color: var(--good); background: var(--good-tint); }
.order li.ko { border-color: var(--warn); background: var(--warn-tint); }
.order .ot { flex: 1; }
.order .ob { display: flex; gap: 2px; }
.order.edit .inp { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view); }
.sw { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; color: var(--ink-2); }

/* Diagnostic */
.ctx { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
ol.plain { margin: 0; padding-left: 22px; display: grid; gap: 3px; }
.diag { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px 10px; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px 14px; }
.diag legend { padding: 0 4px; font-size: 14px; font-weight: 600; }
.cb { display: flex; gap: 8px; align-items: flex-start; padding: 4px 6px; border-radius: var(--r); font-size: 14px; cursor: pointer; }
.cb input { margin-top: 4px; accent-color: var(--accent); }
.cb.ok { background: var(--good-tint); } .cb.ko { background: var(--bad-tint); } .cb.miss { background: var(--warn-tint); }
.lint { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 14px; }
.lint li { display: flex; gap: 8px; align-items: baseline; }
.lint .chip { flex: none; }

/* Champs */
.field { display: grid; gap: 3px; }
.field-lab { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.field textarea { width: 100%; resize: vertical; padding: 6px 9px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view); line-height: 1.45; }
.field textarea:focus { border-color: var(--accent); }
.ideas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* Prompt */
.copybox { display: grid; gap: 10px; padding: 12px 14px; border: 1px dashed var(--accent-line); border-radius: var(--r); background: var(--view-alt); }
.copy-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.copy-head > div:first-child { max-width: 560px; }
.prompt { width: 100%; min-height: 240px; font-family: var(--mono); font-size: 12.5px; padding: 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view); resize: vertical; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; padding: 12px 0 6px; border-right: 0; border-bottom: 1px solid var(--line); }
  nav { display: flex; overflow-x: auto; gap: 4px; padding: 0 8px; }
  .navgroup { display: flex; padding: 0; gap: 2px; }
  .navlab, .side-foot, .side-sub { display: none; }
  .nav-btn { white-space: nowrap; }
  .two, .cols3, .grid3, .gloss, .trap-cols, .pimdef, .diag, .stages { grid-template-columns: 1fr; }
  .pim-row { grid-template-columns: 1fr; gap: 0; }
  .branches { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .branches::before, .branches .node::after { display: none; }
}

</style>
</head>
<body>
<div id="root"></div>
<noscript>Cette application a besoin de JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function () {
/* ================= Données pédagogiques ================= */

const RULES = {
  maximoi: "Le maximoi est un but de réussite formulé par l’apprenant (« Mon objectif est de… »), pas une activité (« jouer au jeu »).",
  minimoi: "Les minimoi sont des étapes courtes, concrètes et ordonnées. On voit sans hésiter comment réaliser chacune. Seules les étapes où l’apprenant risque d’échouer ont besoin d’un PIM.",
  I: "L’Intention commence par « Je veux » suivi d’un but précis.",
  P: "La Perception désigne la cible de l’attention : je regarde, j’écoute, je sens, je revois dans ma tête, je réentends ma petite voix.",
  M: "Le Mode d’action (ou Manière d’agir) est une seule action, physique ou mentale, que l’apprenant peut décider de faire avec la quasi-certitude d’y arriver. Elle sert l’intention.",
  langue: "Le PIM est écrit avec « je », dans les mots de l’apprenant. Le vocabulaire théorique reste dans les objectifs destinés à l’adulte.",
};

const TRAPS = [
  { id: "T1", n: 1, t: "Décrire le jeu au lieu de décrire la tête",
    why: "Des minimoi décrivent l’installation ou les règles (distribuer, piocher, compter les points). Ces étapes demandent peu de concentration, alors que l’étape où l’apprenant échoue tient en un seul PIM.",
    ex: "Minimoi : « Distribuer 5 cartes par joueur », « Compter les points », « Désigner le vainqueur ».",
    fix: "Regrouper l’installation en une étape (« Je prépare la manche ») et donner la place gagnée aux étapes décisives : « Je récapitule », « Je vérifie avant que la boîte soit cachée ».",
    test: "Si l’apprenant rate cette étape, rate-t-il la tâche ? Sinon, elle n’a sans doute pas besoin d’un PIM." },

/* ---------- Glossaire : uniquement les mots utiles pour décomposer une tâche ---------- */
const GLOSSARY = [
  // ATOLE
  { cat: "ATOLE", term: "Tâche complexe", def: "Tâche qu’on ne peut pas réussir d’un seul geste ni avec une seule intention : il faut l’organiser en plusieurs étapes.", ex: "« Faire une fiche de lecture » est une tâche complexe ; « noter le titre du livre » ne l’est pas." },
  { cat: "ATOLE", term: "Maximoi", def: "Le rôle de celui qui planifie. Quand je suis Maximoi, je ne fais rien : je réfléchis au but et aux étapes pour l’atteindre.", ex: "Avant de cuisiner, Maximoi lit la recette et prévoit : ingrédients, pesée, mélange, cuisson." },
  { cat: "ATOLE", term: "Minimoi", def: "Le rôle de celui qui exécute. Quand je suis minimoi, je ne réfléchis pas au plan : j’accomplis une seule étape à la fois. Par extension, chaque étape s’appelle un minimoi.", ex: "Minimoi pèse le sucre, et seulement le sucre, jusqu’à la fin de la pesée." },
  { cat: "ATOLE", term: "Mini-mission", def: "Une étape concrète, ciblée et courte, issue de la décomposition. Elle tient dans une bulle de concentration de quelques minutes.", ex: "« Récupérer trois images d’objets sphériques et les copier dans le diaporama »." },
  { cat: "ATOLE", term: "Niveau de découpage", def: "La finesse de la décomposition. Il est bon quand on voit sans hésiter comment réaliser chaque étape. Trop fin, c’est lassant ; trop grossier, on ne sait pas par où commencer.", ex: "« Sortir les œufs » puis « sortir le beurre » : trop fin. « Préparer un gâteau » : trop grossier." },
  { cat: "ATOLE", term: "Niveau visé", def: "L’âge, la classe ou le profil de l’apprenant pour qui on décompose. Il justifie le niveau de détail.", ex: "À 4 ans avec un trouble moteur, on découpe la tenue du crayon ; à 9 ans, ce n’est plus utile." },
  { cat: "ATOLE", term: "Intention (I)", def: "Ce que je cherche à obtenir, maintenant. Une intention claire est concrète, précise et à court terme. Elle commence par « Je veux ».", ex: "« Je veux garder le jaune d’œuf entier dans la coquille. »" },
  { cat: "ATOLE", term: "Une seule intention à la fois", def: "Garder plusieurs intentions en tête en même temps disperse l’attention et crée de la surcharge mentale. ATOLE apprend à en privilégier une seule.", ex: "Pendant la pesée, je ne pense pas encore au four." },
  { cat: "ATOLE", term: "Perception (P)", def: "La cible de mon attention : ce que je regarde, j’écoute, je sens, ou ce que je revois et réentends dans ma tête. Elle doit pouvoir être repérée presque immédiatement.", ex: "« Je regarde le jaune d’œuf et le bord de la coquille. »" },
  { cat: "ATOLE", term: "Perception externe", def: "Une perception que d’autres personnes peuvent partager avec moi.", ex: "La voix de la maîtresse, la ligne à découper, le nombre affiché sur la balance." },
  { cat: "ATOLE", term: "Perception interne (mentale)", def: "Une perception que je suis le seul à percevoir, dans ma tête.", ex: "L’image de la courbe que doit suivre ma boulette de papier ; ma petite voix qui répète une liste." },
  { cat: "ATOLE", term: "Mode d’action (M)", def: "Aussi appelé Manière d’agir. La seule action, physique ou mentale, que je décide de faire pour atteindre l’intention, avec la quasi-certitude d’y arriver.", ex: "« Je manipule doucement les deux moitiés de la coquille. » « Je me redis la liste avec ma petite voix. »" },
  { cat: "ATOLE", term: "PIM", def: "Un mode d’emploi pour se concentrer : une Perception, une Intention et un Mode d’action. Il verrouille l’attention sur une étape souvent brève. Une tâche peut demander plusieurs PIM qui se suivent ou alternent.", ex: "Toucher une forme cachée (PIM 1), puis la dessiner (PIM 2), en alternance." },
  { cat: "ATOLE", term: "PIM d’expert", def: "Un PIM plus complexe, efficace pour quelqu’un d’expérimenté, mais trop difficile pour un débutant. Pour un novice, on le décompose en plusieurs PIM simples.", ex: "« Je raconte le film » suffit à un expert ; un débutant a besoin de PIM pour le lieu, l’époque, les personnages, les actions." },
  { cat: "ATOLE", term: "Image mentale", def: "Une image que je fabrique et que je revois dans ma tête. C’est une perception interne très utile dans les PIM.", ex: "Je lis « un éléphant rose » et je le vois dans ma tête, la trompe levée." },
  { cat: "ATOLE", term: "Petite voix", def: "La voix intérieure avec laquelle je me redis un mot, une phrase ou une liste sans parler à voix haute.", ex: "Je me redis « bonnet, écharpe, gant » pour ne pas les oublier." },
  { cat: "ATOLE", term: "Conversion", def: "Une action mentale qui transforme une perception d’une modalité en une autre : des mots entendus en images, une image en geste, une image en sensation.", ex: "Mon amie m’explique le chemin et je me fais le film du trajet dans ma tête." },
  { cat: "ATOLE", term: "OUIN", def: "« OUbli de l’INtention » : après une distraction, je ne sais plus ce que je voulais faire. Des intentions claires et courtes protègent des OUIN.", ex: "« Mais qu’est-ce que je venais chercher dans la cuisine, déjà ? »" },
  { cat: "ATOLE", term: "Bulle de concentration", def: "Un court moment entièrement consacré à une seule mini-mission, en oubliant le reste.", ex: "« Je me donne 5 minutes pour relire ma leçon, et rien d’autre. »" },
  { cat: "ATOLE", term: "Connaissance ou procédure réactivée", def: "Le savoir ou la méthode que l’apprenant doit rappeler en mémoire pour réussir la tâche. Elle se note sur une fiche à part dans la trame.", ex: "Le schéma narratif pour raconter un film ; « 10 unités = 1 dizaine » pour la retenue." },
  // Charge cognitive
  { cat: "Charge cognitive", term: "Mémoire de travail", def: "L’espace mental où je garde et je manipule quelques informations pendant que je travaille. Il est très limité.", ex: "Garder en tête un numéro de téléphone le temps de le composer." },
  { cat: "Charge cognitive", term: "Double tâche", def: "Faire deux tâches cognitives en même temps. Cela pose problème quand l’une d’elles n’est pas automatisée.", ex: "Écrire et réfléchir à l’orthographe en même temps, pour un élève qui forme encore ses lettres." },
  { cat: "Charge cognitive", term: "Surcharge cognitive", def: "Trop d’informations ou de tâches à traiter à la fois : la mémoire de travail déborde et l’apprentissage s’arrête.", ex: "Un Mode d’action avec quatre actions à retenir et à exécuter." },
  { cat: "Charge cognitive", term: "Charge intrinsèque", def: "La difficulté propre à la tâche : nombre d’éléments à traiter ensemble et liens entre eux. La décomposer en minimoi la répartit dans le temps.", ex: "Résoudre un problème demande de comprendre, choisir l’opération, calculer et vérifier." },
  { cat: "Charge cognitive", term: "Charge extrinsèque", def: "L’effort inutile causé par la façon de présenter la tâche. Il faut la réduire.", ex: "Du jargon dans un PIM, des informations éparpillées sur plusieurs pages." },
  { cat: "Charge cognitive", term: "Charge essentielle", def: "L’effort utile consacré à comprendre et à construire la méthode. C’est celui qu’on veut favoriser.", ex: "Se demander pourquoi l’étape de vérification vient avant la phrase réponse." },
  { cat: "Charge cognitive", term: "Exemple résolu", def: "Un exemple complet et commenté qu’on étudie avant de produire soi-même. Pour un débutant, il est plus efficace que chercher seul.", ex: "Étudier une décomposition complète de « Poser une addition » avant d’en écrire une." },
  { cat: "Charge cognitive", term: "Estompage", def: "Retirer l’aide peu à peu : exemple complet, puis exemple à compléter, puis tâche à faire seul.", ex: "PIM avec le M à trouver, puis P et M, puis I, P et M." },
  { cat: "Charge cognitive", term: "Renversement lié à l’expertise", def: "Une aide utile au débutant devient inutile, voire gênante, quand l’apprenant progresse.", ex: "On regroupe plusieurs minimoi en un seul quand les étapes sont automatisées." },
  { cat: "Charge cognitive", term: "Double codage", def: "Associer des mots et des images pour mieux retenir et mieux comprendre.", ex: "Se redire le nom d’une sardine et revoir son image dans sa tête." },
  // Multimédia
  { cat: "Multimédia", term: "Segmentation", def: "Présenter un contenu complexe en petites parties que l’apprenant fait avancer à son rythme.", ex: "Une fiche par minimoi plutôt qu’une page qui contient tout." },
  { cat: "Multimédia", term: "Signalement", def: "Mettre en évidence la structure et l’essentiel pour guider le regard.", ex: "Les étiquettes I, P et M toujours placées au même endroit et dans le même ordre." },
  { cat: "Multimédia", term: "Cohérence", def: "Retirer tout ce qui n’aide pas à apprendre : décor, anecdotes, détails superflus.", ex: "Une fiche PIM sans image décorative ni règle du jeu recopiée." },
  { cat: "Multimédia", term: "Pré-entraînement", def: "Apprendre les mots et les notions clés avant d’aborder la tâche complexe.", ex: "Lire le glossaire et faire le quiz avant de décomposer une tâche." },
  { cat: "Multimédia", term: "Personnalisation", def: "S’adresser à l’apprenant de façon directe et conversationnelle.", ex: "« Je regarde ma carte » plutôt que « Observation de la carte »." },
];

/* ---------- Stockage local (confort, peut être absent) ---------- */
const KEY = "atole-pim-entrainement-v1";
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
  save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} },
};
function usePersist(name, init) {
  const [v, setV] = useState(() => { const s = store.load(); return s[name] !== undefined ? s[name] : init; });
  useEffect(() => { const s = store.load(); s[name] = v; store.save(s); }, [name, v]);
  return [v, setV];
}

/* ---------- Repères automatiques (indicatifs) ---------- */
const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, "'").replace(/\s+/g, " ").trim();
const JARGON = ["boucle phonologique", "memoire de travail", "trace mnesique", "mnesique", "inhiber", "inhibition", "encoder", "encodage", "fonctions executives", "flexibilite mentale", "discriminer", "attention selective", "attention soutenue", "calepin", "saillant", "metacognit", "planification", "memoire a court terme", "memoire episodique", "memoire semantique"];
const P_ACTION = /\b(recherche|rechercher|cherche|chercher|compare|comparer|associe|associer|selectionne|selectionner|identifie|identifier|analyse|analyser|trie|trier|memorise|memoriser|retiens|retenir|determine|determiner|choisis|choisir|decide|decider|ecris|ecrire|note|noter|pose|poser|m'arrete|je fais|faire)\b/;
const P_PERCEPT = /\b(regarde|regarder|ecoute|ecouter|sens|sentir|ressens|revois|revoir|reentends|entends|vois|voir|touche|lis|lire|observe|imagine|repense|petite voix|dans ma tete)\b/;
const STOP = new Set("les des une un le la de du je j' mon ma mes ce cette ces et ou a au aux en dans pour que qui sur avec est sont veux chaque tout tous plus".split(" "));
const words = (s) => norm(s).replace(/[^a-z' ]/g, " ").split(" ").filter((w) => w.length > 3 && !STOP.has(w));
const overlap = (a, b) => { const A = new Set(words(a)), B = new Set(words(b)); if (A.size < 2 || B.size < 2) return 0; let n = 0; A.forEach((w) => B.has(w) && n++); return n / Math.min(A.size, B.size); };
const firstPerson = (s) => /\b(je|j'|mon|ma|mes|me|m')/.test(norm(s));

function lintPIM(p) {
  const out = [];
  const I = p.I || "", P = p.P || "", M = p.M || "";
  if (I.trim() && !/^je veux\b/.test(norm(I))) out.push({ k: "Q1", t: "L’intention commence-t-elle par « Je veux » suivi d’un but ?" });
  if (P.trim()) {
    const np = norm(P);
    if (P_ACTION.test(np)) out.push({ k: "T3", t: "La perception contient peut-être une action (rechercher, comparer, identifier…). Dis plutôt sur quoi poser l’attention." });
    else if (!P_PERCEPT.test(np)) out.push({ k: "Q2", t: "La perception nomme-t-elle une cible : je regarde, j’écoute, je sens, je revois dans ma tête… ?" });
  }
  if (M.trim()) {
    const nm = norm(M);
    const je = (nm.match(/\b(je|j')/g) || []).length;
    const cond = /^si\b|\bsi (je|j'|oui|non)/.test(nm);
    if (/\b(puis|ensuite)\b|;|\n|•/.test(nm) || (je >= 2 && !cond) || (/ et (je|j')/.test(nm) && !cond)) out.push({ k: "T2", t: "Le mode d’action contient peut-être plusieurs actions (« et », « puis », plusieurs « je »). Une condition « si…, je… » reste acceptable." });
    if (M.length > 150) out.push({ k: "T2", t: "Le mode d’action est long : une seule action tient en général en une phrase courte." });
  }
  const all = norm(I + " " + P + " " + M);
  const jar = JARGON.filter((j) => all.includes(j));
  if (jar.length) out.push({ k: "T5", t: "Mots de professionnel repérés : " + jar.join(", ") + ". Écris avec les mots de l’apprenant." });
  ["I", "P", "M"].forEach((x) => { if (p[x] && p[x].trim() && !firstPerson(p[x])) out.push({ k: "T5", t: (x === "I" ? "L’intention" : x === "P" ? "La perception" : "Le mode d’action") + " n’est pas écrit avec « je »." }); });
  if (overlap(I, P) > 0.75 || overlap(P, M) > 0.75 || overlap(I, M) > 0.75) out.push({ k: "Q4", t: "Deux éléments se ressemblent beaucoup : chacun doit apporter une information nouvelle." });
  return out;
}

  const n = norm(s).replace(/^mon objectif est (de |d')/, "");
  if (!n) return [];
  if (/^(jouer|faire le jeu|faire l'exercice|faire mes|travailler|etre concentre|me concentrer)/.test(n)) return [{ k: "Max", t: "Le maximoi décrit-il un but de réussite (ce qui sera réussi) plutôt qu’une activité ou un état ?" }];
  return [];
}

}

function OrderTask({ task, onSolved }) {
  const init = useMemo(() => { let s = shuffle(task.items.map((x, i) => ({ r: x[0], t: x[1], id: i })), task.id.length * 7 + 3); if (s.every((x, k) => k === 0 || s[k - 1].r <= x.r)) s = s.reverse(); return s; }, [task.id]);
  const [list, setList] = useState(init);
  const [checked, setChecked] = useState(false);
  useEffect(() => { setList(init); setChecked(false); }, [task.id]);
  const move = (k, d) => { const j = k + d; if (j < 0 || j >= list.length) return; const a = list.slice(); [a[k], a[j]] = [a[j], a[k]]; setList(a); setChecked(false); };
  const sorted = task.items.map((x) => x[0]).sort((a, b) => a - b);
  const okAt = (k) => list[k].r === sorted[k];
  const allOk = list.every((_, k) => okAt(k));
  const check = () => { setChecked(true); if (list.every((_, k) => okAt(k))) onSolved(task.id); };
  return html`
    <div className="maxi"><span className="lbl">Maximoi</span>${task.maximoi}</div>
    <ol className="order">${list.map((x, k) => html`<li key=${x.id} className=${checked ? (okAt(k) ? "ok" : "ko") : ""}>
      <${Num} n=${k + 1} /><span className="ot">${x.t}</span>
      <span className="ob"><button className="ibtn" onClick=${() => move(k, -1)} disabled=${k === 0} aria-label=${"Monter : " + x.t}><${Icon} name="up" /></button><button className="ibtn" onClick=${() => move(k, 1)} disabled=${k === list.length - 1} aria-label=${"Descendre : " + x.t}><${Icon} name="down" /></button></span>
    </li>`)}</ol>
    <div className="row"><button className="btn primary" onClick=${check}><${Icon} name="check" />Vérifier l’ordre</button>
      <button className="btn" onClick=${() => { setList(init); setChecked(false); }}><${Icon} name="reset" />Recommencer</button></div>
    ${checked ? (allOk ? html`<${Msg} kind="good"><strong>Ordre correct.</strong> ${task.expl}<//>` : html`<${Msg} kind="warn">Les étapes en orange ne sont pas encore à leur place. Demandez-vous : de quoi a-t-on besoin pour réaliser cette étape ? Cela doit venir avant.<//>`) : null}
    <p className="muted small src">${task.source}.</p>`;
}

function parseIPM(t) {
  const get = (re) => { const m = t.match(re); return m ? m[1].trim() : ""; };
  const I = get(/intention\s*\(?i?\)?\s*:\s*([^\n]*)/i), P = get(/perception\s*\(?p?\)?\s*:\s*([^\n]*)/i), M = get(/(?:mode d.action|mani[eè]re d.agir)\s*\(?m?\)?\s*:\s*([^\n]*)/i);
  if (I || P || M) return { I, P, M };
  return { M: t };
}

    <//>
    <${Frame} title="2. Le maximoi" hint="Un but de réussite, du point de vue de l’apprenant">
      <${Field} label="Mon objectif est de…" rows=${2} value=${d.maximoi} onChange=${(v) => set("maximoi", v)} placeholder="Mon objectif est de…" />
      <${LintList} items=${lintMaximoi(d.maximoi)} />
    <//>
    <${Frame} title="3. Les minimoi" hint=${d.minis.length + " étapes · " + nbPim + " PIM"}>
      <ol className="order edit">${d.minis.map((m, i) => html`<li key=${i}>
        <${Num} n=${i + 1} />
        <input className="inp" value=${m.t} placeholder="Ex. Je repère le mot à copier" aria-label=${"Minimoi " + (i + 1)} onInput=${(e) => setMini(i, "t", e.target.value)} />
        <label className="sw"><input type="checkbox" checked=${m.pim} onChange=${(e) => setMini(i, "pim", e.target.checked)} />PIM</label>
        <span className="ob"><button className="ibtn" onClick=${() => move(i, -1)} disabled=${i === 0} aria-label="Monter"><${Icon} name="up" /></button><button className="ibtn" onClick=${() => move(i, 1)} disabled=${i === d.minis.length - 1} aria-label="Descendre"><${Icon} name="down" /></button><button className="ibtn" onClick=${() => set("minis", d.minis.filter((_, j) => j !== i))} disabled=${d.minis.length <= 1} aria-label="Supprimer"><${Icon} name="trash" /></button></span>
      </li>`)}</ol>
      <div className="row"><button className="btn" onClick=${() => set("minis", [...d.minis, { t: "", pim: true, I: "", P: "", M: "" }])}><${Icon} name="plus" />Ajouter un minimoi</button></div>
      <p className="muted small">Décochez « PIM » pour une étape que l’apprenant réussit déjà sans aide (piège 1). Pensez à une étape de vérification.</p>
    <//>
    <div className="section-head">4. Les PIM</div>
    ${d.minis.map((m, i) => m.pim ? html`<${Frame} key=${i} title=${"PIM " + (i + 1) + " · " + (m.t || "minimoi sans titre")}>
      <div className="pim edit">
        <${Field} k="I" label="Intention" value=${m.I} onChange=${(v) => setMini(i, "I", v)} placeholder="Je veux…" />
        <${Field} k="P" label="Perception" value=${m.P} onChange=${(v) => setMini(i, "P", v)} placeholder="Je regarde / j’écoute / je sens / je revois dans ma tête…" />
        <${Field} k="M" label="Mode d’action" value=${m.M} onChange=${(v) => setMini(i, "M", v)} placeholder="Je… (une seule action)" />
      </div>
      <${LintList} items=${lintPIM(m)} />
    <//>` : null)}
    <${Frame} title="5. Connaissance ou procédure réactivée" hint="Le savoir à rappeler en mémoire pour réussir">
      <${Field} label="Titre et contenu" rows=${2} value=${d.connaissance} onChange=${(v) => set("connaissance", v)} placeholder="Ex. Le schéma narratif ; dans le doute, je ne pose pas ma carte" />
    <//>
    <${Frame} title="6. Relire et demander un retour">
      <ol className="checklist small">${GRID.map((g, k) => html`<li key=${k}>${g}</li>`)}</ol>
      <${CopyPrompt} build=${build} onCopied=${markDone} />
      <div className="row end">${confirm
        ? html`<span className="muted small">Effacer toute la trame ?</span><button className="btn danger" onClick=${() => { setD(EMPTY); setConfirm(false); }}>Oui, effacer</button><button className="btn" onClick=${() => setConfirm(false)}>Annuler</button>`
        : html`<button className="btn" onClick=${() => setConfirm(true)}><${Icon} name="reset" />Nouvelle trame</button>`}</div>
    <//>`;
}

/* ---------- Coquille de l’application ---------- */
const SECTIONS = [
  { id: "accueil", g: "Apprendre", label: "Accueil", icon: "accueil", title: "Décomposer une tâche complexe", sub: "Maximoi, minimoi et PIM d’après le programme ATOLE · parcours d’entraînement" },
  { id: "comprendre", g: "Apprendre", label: "Comprendre", icon: "comprendre", title: "Comprendre", sub: "Les notions essentielles, une fiche à la fois" },
  { id: "glossaire", g: "Apprendre", label: "Glossaire", icon: "glossaire", title: "Glossaire", sub: "Les mots utiles pour décomposer une tâche, avec un exemple" },
  { id: "quiz", g: "Apprendre", label: "Quiz", icon: "quiz", title: "Quiz", sub: "Vérifier le vocabulaire, les concepts et les notions" },
  { id: "pieges", g: "Apprendre", label: "Pièges et grille", icon: "pieges", title: "Les 5 pièges et la grille des 5 questions", sub: "Issus de l’analyse de l’atelier PIM · les outils pour tester un PIM" },
  { id: "niveau-1", g: "S’entraîner", n: 1, label: "Exemples résolus", title: "Niveau 1 · Exemples résolus", sub: "Étudier des décompositions complètes et commentées" },
  { id: "niveau-2", g: "S’entraîner", n: 2, label: "Remettre dans l’ordre", title: "Niveau 2 · Remettre les minimoi dans l’ordre", sub: "Retrouver la logique d’une décomposition" },
  { id: "niveau-3", g: "S’entraîner", n: 3, label: "Corriger des PIM", title: "Niveau 3 · Corriger des PIM erronés", sub: "Diagnostiquer avec les pièges et la grille, puis réécrire" },
  { id: "niveau-4", g: "S’entraîner", n: 4, label: "Compléter des PIM", title: "Niveau 4 · Compléter des PIM", sub: "Écrire une part de plus en plus grande du PIM" },
  { id: "niveau-5", g: "S’entraîner", n: 5, label: "Trame vide", title: "Niveau 5 · Trame vide", sub: "Décomposer seul une tâche complète" },
];
const readHash = () => { const h = (location.hash || "").slice(1); return SECTIONS.some((s) => s.id === h) ? h : "accueil"; };

function App() {
  const [sec, setSec] = useState(readHash);
  const [prog, setProg] = usePersist("prog", {});
  const [scores, setScores] = usePersist("scores", {});
  useEffect(() => { const f = () => setSec(readHash()); window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
  const go = useCallback((id) => { setSec(id); try { history.replaceState(null, "", "#" + id); } catch (e) {} window.scrollTo({ top: 0 }); }, []);
  const mark = (id) => () => setProg((p) => (p[id] ? p : { ...p, [id]: true }));
  const i = SECTIONS.findIndex((s) => s.id === sec);
  const S = SECTIONS[i];
  let body;
  if (sec === "accueil") body = html`<${Accueil} go=${go} prog=${prog} />`;
  else if (sec === "comprendre") body = html`<${Comprendre} markDone=${mark("comprendre")} />`;
  else if (sec === "glossaire") body = html`<${Glossaire} />`;
  else if (sec === "quiz") body = html`<${Quiz} scores=${scores} setScore=${(id, s) => setScores((o) => ({ ...o, [id]: s }))} />`;
  else if (sec === "pieges") body = html`<${Pieges} />`;
  else if (sec === "niveau-1") body = html`<${Niveau1} markDone=${mark("niveau-1")} />`;
  else if (sec === "niveau-2") body = html`<${Niveau2} markDone=${mark("niveau-2")} />`;
  else if (sec === "niveau-3") body = html`<${Niveau3} markDone=${mark("niveau-3")} />`;
  else if (sec === "niveau-4") body = html`<${Niveau4} markDone=${mark("niveau-4")} />`;
  else body = html`<${Niveau5} markDone=${mark("niveau-5")} />`;
  const groups = ["Apprendre", "S’entraîner"];
  return html`<div className="app">
    <aside className="side">
      <div className="side-head"><span className="side-kicker">Programme ATOLE</span><span className="side-title">Maximoi · minimoi · PIM</span><span className="side-sub">Formation EDI · entraînement</span></div>
      <nav aria-label="Sections">${groups.map((g) => html`<div key=${g} className="navgroup"><div className="navlab">${g}</div>
        ${SECTIONS.filter((s) => s.g === g).map((s) => html`<button key=${s.id} className="nav-btn" aria-current=${s.id === sec ? "page" : undefined} onClick=${() => go(s.id)}>
          ${s.n ? html`<${Num} n=${s.n} done=${prog[s.id]} />` : html`<${Icon} name=${s.icon} />`}<span>${s.label}</span>${!s.n && (prog[s.id] || (s.id === "quiz" && Object.keys(scores).length === QUIZZES.length)) ? html`<span className="tick"><${Icon} name="check" size=${14} /></span>` : null}</button>`)}</div>`)}</nav>
      <div className="side-foot">Inspiré du programme ATOLE © J.-P. Lachaux, INSERM · <a href="https://project.crnl.fr/atole/" target="_blank" rel="noopener">project.crnl.fr/atole</a><br />Exemples adaptés des documents de la formation EDI, CC BY-SA 4.0.</div>
    </aside>
    <main className="main">
      <div className="page">
        <header className="page-head"><h1>${S.title}</h1><p>${S.sub}</p></header>
        ${body}
        <div className="pager">
          ${i > 0 ? html`<button className="btn" onClick=${() => go(SECTIONS[i - 1].id)}><${Icon} name="prev" />${SECTIONS[i - 1].label}</button>` : html`<span></span>`}
          ${i < SECTIONS.length - 1 ? html`<button className="btn" onClick=${() => go(SECTIONS[i + 1].id)}>${SECTIONS[i + 1].label}<${Icon} name="next" /></button>` : null}
        </div>
      </div>
    </main>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

})();
</script>
</body>
</html>
