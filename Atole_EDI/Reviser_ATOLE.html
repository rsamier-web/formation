<style>
/* Fenêtre façon « Configuration du système » de KDE : barre latérale, une page à la fois, cadres Breeze.
   Charge cognitive et apprentissage multimédia : une notion par cadre, schéma à côté du texte,
   couleurs constantes (I bleu, P violet, M vert), aucun décor. */
:root {
  --win: #EFF0F1; --view: #FCFCFC; --view-alt: #F3F4F5; --line: #D3D7DB; --line-strong: #BDC3C7;
  --ink: #232629; --ink-2: #4A5056; --ink-3: #676E75;
  --accent: #3DAEE9; --accent-ink: #1D6FA0; --accent-tint: rgba(61,174,233,.14); --accent-line: rgba(61,174,233,.6);
  --good: #27AE60; --good-ink: #1E8449; --good-tint: rgba(39,174,96,.14); --warn: #E67700; --warn-ink: #B35C00; --warn-tint: rgba(230,119,0,.13);
  --bad: #DA4453; --bad-ink: #B8303E; --bad-tint: rgba(218,68,83,.12); --neutral-tint: rgba(103,110,117,.12);
  --kI: #2980B9; --kP: #8E44AD; --kM: #16A085;
  --aV: #27AE60; --aO: #F39C12; --aR: #DA4453;
  --shadow: 0 1px 2px rgba(35,38,41,.06);
  --font: "Noto Sans", "Noto Sans UI", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Noto Sans Mono", "Hack", ui-monospace, monospace; --r: 5px;
  --imgbg: #FFFFFF;
}
@media (prefers-color-scheme: dark) { :root {
  --win: #31363B; --view: #232629; --view-alt: #2A2E32; --line: #41474D; --line-strong: #565D64;
  --ink: #EFF0F1; --ink-2: #C8CDD1; --ink-3: #9EA6AD; --accent-ink: #7CC7F0; --accent-tint: rgba(61,174,233,.18);
  --good-ink: #5FD38D; --warn-ink: #F5A04A; --bad-ink: #F07A86;
  --good-tint: rgba(39,174,96,.2); --warn-tint: rgba(224,108,0,.2); --bad-tint: rgba(218,68,83,.2); --neutral-tint: rgba(158,166,173,.14);
  --kI: #4DA3DB; --kP: #B07CC6; --kM: #2FC2A4; --shadow: none; color-scheme: dark; --imgbg: #F4F5F6; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--win); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; box-shadow: 0 0 0 3px var(--accent-tint); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent-ink); }
.muted { color: var(--ink-3); } .small { font-size: 13px; } .tnum { font-variant-numeric: tabular-nums; }
.lbl { display: block; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Fenêtre */
.app { display: grid; grid-template-columns: 272px minmax(0,1fr); min-height: 100vh; }
.side { background: var(--view); border-right: 1px solid var(--line); padding: 16px 0; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side-head { padding: 0 18px 4px; display: grid; gap: 2px; }
.side-kicker { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.side-title { font-size: 18px; font-weight: 600; line-height: 1.25; }
.side-sub { font-size: 13px; color: var(--ink-3); }
.navgroup { display: grid; gap: 1px; padding: 0 8px 4px; }
.navlab { font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 6px 10px 2px; }
.nav-btn { display: flex; align-items: center; gap: 9px; padding: 5px 10px; border: 1px solid transparent; border-radius: var(--r); background: none; cursor: pointer; text-align: left; font-size: 14px; line-height: 1.3; width: 100%; }
.nav-btn > svg { color: var(--ink-2); flex: none; }
.nav-btn:hover { background: var(--accent-tint); }
.nav-btn[aria-current="page"] { background: var(--accent-tint); border-color: var(--accent-line); font-weight: 600; }
.nav-btn .tick { margin-left: auto; color: var(--good); display: flex; flex: none; }
.nav-btn .badge { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-num { display: inline-grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.nav-btn.done .nav-num { border-color: var(--good); background: var(--good-tint); color: var(--good-ink); }
.side-foot { margin-top: auto; padding: 8px 18px 0; font-size: 12.5px; color: var(--ink-3); display: grid; gap: 6px; }
.side-foot a { text-decoration: none; }
.main { min-width: 0; padding: 28px clamp(16px,3.4vw,44px) 48px; }
.page { max-width: 1000px; margin: 0 auto; display: grid; gap: 18px; }
.page-head { display: grid; gap: 4px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.page-head h1 { font-size: 26px; font-weight: 600; line-height: 1.2; }
.page-head p { color: var(--ink-2); max-width: 75ch; }
.crumbs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--ink-3); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.topbar { display: none; }

/* Composants Breeze */
.frame { background: var(--view); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.frame-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding: 14px 18px 0; }
.frame-head h2 { font-size: 17px; font-weight: 600; }
.frame-head .hint { font-size: 13px; color: var(--ink-3); }
.frame-body { padding: 12px 18px 18px; display: grid; gap: 12px; min-width: 0; }
.frame-body > p, .prose p { max-width: 74ch; }
.msg { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 10px; align-items: start; padding: 10px 14px; border: 1px solid var(--accent-line); background: var(--accent-tint); border-radius: var(--r); }
.msg > svg { margin-top: 2px; color: var(--accent-ink); }
.msg.good { border-color: var(--good); background: var(--good-tint); } .msg.good > svg { color: var(--good); }
.msg.warn { border-color: var(--warn); background: var(--warn-tint); } .msg.warn > svg { color: var(--warn); }
.msg.bad { border-color: var(--bad); background: var(--bad-tint); } .msg.bad > svg { color: var(--bad); }
.section-head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); padding-top: 6px; }
.section-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 500; border: 1px solid var(--line-strong); background: var(--view); white-space: nowrap; }
.chip.good { border-color: var(--good); background: var(--good-tint); } .chip.warn { border-color: var(--warn); background: var(--warn-tint); }
.chip.bad { border-color: var(--bad); background: var(--bad-tint); } .chip.neutral { background: var(--neutral-tint); border-color: transparent; }
.chip.acc { border-color: var(--accent-line); background: var(--accent-tint); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view); cursor: pointer; font-size: 14px; text-decoration: none; color: var(--ink); min-height: 34px; }
.btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-tint); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #2C9AD4; }
.btn.danger { border-color: var(--bad); background: var(--bad-tint); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); cursor: pointer; font-size: inherit; font-weight: 500; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .row.between { justify-content: space-between; } .row.end { justify-content: flex-end; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.note { padding: 9px 12px; background: var(--view-alt); border-left: 3px solid var(--accent); border-radius: 0 var(--r) var(--r) 0; font-size: 14.5px; }
.seance { padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--kM); background: var(--view-alt); border-radius: var(--r); font-size: 14.5px; display: grid; gap: 3px; }
.seance .lbl { color: var(--kM); margin: 0; }
blockquote { margin: 0; padding: 8px 14px; border-left: 3px solid var(--line-strong); background: var(--view-alt); border-radius: 0 var(--r) var(--r) 0; font-size: 15px; }
blockquote cite { display: block; font-style: normal; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
ul.list, ol.list { margin: 0; padding-left: 22px; display: grid; gap: 5px; max-width: 76ch; }
.retenir { border: 1px solid var(--accent-line); background: var(--accent-tint); border-radius: var(--r); padding: 12px 16px; display: grid; gap: 6px; }
.retenir h2 { font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.withside { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: start; }
.fig { margin: 0; display: grid; gap: 4px; justify-items: center; text-align: center; }
.fig img { display: block; max-width: 100%; height: auto; background: var(--imgbg); border-radius: var(--r); }
.fig figcaption { font-size: 12.5px; color: var(--ink-3); max-width: 60ch; }
.figrow { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; align-items: end; }
.figrow .fig img { max-height: 170px; width: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { padding: 7px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.tbl th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--view-alt); }
.tbl td:first-child { font-weight: 600; }
.tablewrap { overflow-x: auto; }

/* Accueil */
.hero { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap: 18px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; align-items: start; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; }
.stat { display: grid; gap: 2px; padding: 12px 14px; }
.stat .v { font-size: 26px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 13px; color: var(--ink-2); }
.meter { height: 6px; background: var(--neutral-tint); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.good i { background: var(--good); }
.modgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.modcard { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: start; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--view); cursor: pointer; }
.modcard:hover { border-color: var(--accent); background: var(--accent-tint); }
.modcard .nav-num { width: 26px; height: 26px; font-size: 13px; }
.modcard.done .nav-num { border-color: var(--good); background: var(--good-tint); color: var(--good-ink); }
.modcard b { display: block; font-size: 15px; line-height: 1.3; }
.modcard span.s { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }

/* Visuels */
.vis { display: grid; gap: 10px; }
.forces { display: grid; grid-template-columns: minmax(0,1fr) 150px minmax(0,1fr); gap: 12px; align-items: center; }
.force { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--view-alt); font-size: 14px; }
.force b { display: block; font-size: 14px; }
.force.auto { border-left: 3px solid var(--warn); }
.force.strat { border-left: 3px solid var(--kI); }
.forces .center { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 13px; color: var(--ink-2); }
.forces .col { display: grid; gap: 8px; }
.grid2x2 { display: grid; grid-template-columns: 110px repeat(2, minmax(0,1fr)); gap: 6px; font-size: 14px; }
.grid2x2 .h { font-size: 12.5px; font-weight: 600; color: var(--ink-3); align-self: end; padding: 0 6px; }
.grid2x2 .c { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--view-alt); }
.grid2x2 .c i { display: block; font-style: normal; color: var(--ink-3); font-size: 12.5px; }
.beams { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.beam { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--view-alt); display: grid; gap: 6px; }
.beam b { font-size: 14.5px; }
.beam svg { width: 100%; height: auto; color: var(--ink-2); }
.beam p { font-size: 13.5px; color: var(--ink-2); }
.aa { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.acard { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-top: 3px solid; border-radius: var(--r); background: var(--view-alt); }
.acard img { width: 40px; height: auto; background: transparent; }
.acard b { display: block; font-size: 14.5px; } .acard span { font-size: 13.5px; color: var(--ink-2); }
.acard.v { border-top-color: var(--aV); } .acard.o { border-top-color: var(--aO); } .acard.r { border-top-color: var(--aR); }
.neurons { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.neuron { display: grid; grid-template-rows: auto auto 1fr; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--view-alt); }
.neuron .pic { background: var(--imgbg); border-radius: var(--r); display: grid; place-items: center; height: 120px; }
.neuron .pic img { max-height: 110px; max-width: 90%; }
.neuron b { font-size: 15px; } .neuron .where { font-size: 12.5px; color: var(--ink-3); }
.neuron p { font-size: 13.5px; color: var(--ink-2); }
.emos { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.emo { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--view-alt); }
.emo .pic { background: var(--imgbg); border-radius: var(--r); width: 100%; display: grid; place-items: center; height: 90px; }
.emo img { max-height: 82px; max-width: 90%; }
.emo b { font-size: 14px; } .emo span { font-size: 12.5px; color: var(--ink-2); }
.sys2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.sys { padding: 12px 14px; border: 1px solid var(--line); border-top: 3px solid; border-radius: var(--r); background: var(--view-alt); display: grid; gap: 4px; }
.sys.s { border-top-color: var(--kI); } .sys.a { border-top-color: var(--warn); }
.sys b { font-size: 15px; } .sys ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
.tree { display: grid; justify-items: center; gap: 22px; padding: 6px 0 4px; }
.node { display: grid; text-align: center; padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view-alt); font-weight: 600; font-size: 14px; position: relative; }
.node small { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
.node.max { border-color: var(--accent); background: var(--accent-tint); display: grid; grid-template-columns: 46px auto; gap: 10px; align-items: center; text-align: left; }
.node.max img { width: 44px; background: var(--imgbg); border-radius: 4px; }
.branches { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; width: 100%; max-width: 680px; position: relative; }
.branches::before { content: ""; position: absolute; top: -12px; left: 12.5%; right: 12.5%; height: 1px; background: var(--line-strong); }
.branches .node::after { content: ""; position: absolute; top: -12px; left: 50%; width: 1px; height: 12px; background: var(--line-strong); }
.tree .max::after { content: ""; position: absolute; bottom: -11px; left: 50%; width: 1px; height: 10px; background: var(--line-strong); }
.pimdef { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.pimdef > div { padding: 10px 12px; border: 1px solid var(--line); border-top: 3px solid; border-radius: var(--r); background: var(--view-alt); display: grid; gap: 3px; }
.pimdef .kI { border-top-color: var(--kI); } .pimdef .kP { border-top-color: var(--kP); } .pimdef .kM { border-top-color: var(--kM); }
.pimdef p { font-size: 14px; color: var(--ink-2); }
.pimdef .who { display: flex; align-items: center; gap: 8px; }
.pimdef .who img { width: 40px; background: var(--imgbg); border-radius: 4px; }
.kI .pim-lab { color: var(--kI); } .kP .pim-lab { color: var(--kP); } .kM .pim-lab { color: var(--kM); }
.pim-lab { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.pim { display: grid; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--view); }
.pim-tag { padding: 5px 12px; font-size: 13px; font-weight: 600; background: var(--view-alt); border-bottom: 1px solid var(--line); }
.pim-row { display: grid; grid-template-columns: 130px minmax(0,1fr); gap: 10px; padding: 7px 12px; border-left: 3px solid; font-size: 14.5px; }
.pim-row + .pim-row { border-top: 1px solid var(--line); }
.pim-row.kI { border-left-color: var(--kI); } .pim-row.kP { border-left-color: var(--kP); } .pim-row.kM { border-left-color: var(--kM); }
.iac { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.iac > div { padding: 10px 12px; display: grid; gap: 2px; background: var(--view-alt); }
.iac > div + div { border-left: 1px solid var(--line); }
.iac b { font-size: 14.5px; } .iac span { font-size: 13.5px; color: var(--ink-2); }
.timeline { display: grid; grid-template-columns: 140px minmax(0,1fr); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 14px; }
.timeline > div { padding: 10px 12px; }
.timeline .cap { background: var(--accent-tint); border-right: 1px dashed var(--accent-line); }
.timeline .cav { background: var(--warn-tint); }
.timeline .chain { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.timeline .chain span { font-size: 12.5px; padding: 1px 7px; border-radius: 999px; background: var(--view); border: 1px solid var(--line); }
.rappel { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; }
.rl { display: grid; gap: 2px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); text-align: center; background: var(--view-alt); }
.rl .L { font-size: 26px; font-weight: 700; line-height: 1; }
.rl b { font-size: 13.5px; } .rl span { font-size: 12px; color: var(--ink-3); }
.rl.ext { border-top: 3px solid var(--accent); } .rl.int { border-top: 3px solid var(--kP); } .rl.lp { border-top: 3px solid var(--good); }
.rappel-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.rappel-legend i { display: inline-block; width: 12px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.cine { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.cine > div { padding: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--view-alt); display: grid; gap: 2px; }
.cine .L { font-size: 24px; font-weight: 700; color: var(--accent-ink); line-height: 1; }
.cine b { font-size: 14px; } .cine span { font-size: 13px; color: var(--ink-2); }
.archi { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; align-items: stretch; }

  intro: "Comprendre ce qu’est l’attention, ce qui la tire dans tous les sens et comment évaluer la difficulté d’une tâche.",
  sections: [
    { h: "Deux définitions de l’attention", body: [
      { quote: "L’attention est la prise de possession par l’esprit, sous une forme claire et vive, d’un objet ou d’une suite de pensées parmi plusieurs qui semblent possibles.", by: "William James (1890)" },

      { visual: "troisA" },

{

function rt(s, hl) {
  const parts = nb(s).split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g);
  return parts.map((p, i) => {
    if (p.startsWith("**")) return html`<b key=${i}>${mark(p.slice(2, -2), hl)}</b>`;
    if (p.startsWith("*") && p.length > 2) return html`<i key=${i}>${mark(p.slice(1, -1), hl)}</i>`;
    return html`<${React.Fragment} key=${i}>${mark(p, hl)}<//>`;
  });
}
function mark(s, q) {
  if (!q) return s;
  const n = norm(s), k = norm(q), out = []; let i = 0, j;
  while ((j = n.indexOf(k, i)) !== -1) { out.push(s.slice(i, j)); out.push(html`<mark key=${j}>${s.slice(j, j + k.length)}</mark>`); i = j + k.length; }

}

/* ---------- Rendu des blocs de contenu ---------- */
function Block({ b }) {
  if (typeof b === "string") return html`<p>${rt(b)}</p>`;
  if (b.ul) return html`<ul className="list">${b.ul.map((x, i) => html`<li key=${i}>${rt(x)}</li>`)}</ul>`;
  if (b.ol) return html`<ol className="list">${b.ol.map((x, i) => html`<li key=${i}>${rt(x)}</li>`)}</ol>`;
  if (b.quote) return html`<blockquote>« ${b.quote} »<cite>${b.by}</cite></blockquote>`;
  if (b.img) return html`<${Fig} img=${b.img} cap=${b.cap} w=${b.w} />`;
  if (b.imgs) return html`<div className="figrow">${b.imgs.map((x) => html`<${Fig} key=${x.img} img=${x.img} cap=${x.cap} />`)}</div>`;
  if (b.visual) return html`<${Visual} k=${b.visual} />`;
  if (b.seance) return html`<div className="seance"><span className="lbl">En séance</span><span>${rt(b.seance)}</span></div>`;
  if (b.pim) return html`<${PimCard} p=${b.pim} />`;
  if (b.note) return html`<div className="note">${rt(b.note)}</div>`;
  if (b.table) return html`<div className="tablewrap"><table className="tbl"><thead><tr>${b.table.head.map((h) => html`<th key=${h}>${h}</th>`)}</tr></thead>
    <tbody>${b.table.rows.map((r, i) => html`<tr key=${i}>${r.map((c, j) => html`<td key=${j}>${rt(c)}</td>`)}</tr>`)}</tbody></table></div>`;
  return null;
}
function Section({ s, i }) {
  const side = s.body.find((b) => b && b.img && b.side);
  const rest = s.body.filter((b) => b !== side);
  return html`<${Frame} title=${(i + 1) + ". " + s.h} id=${"s" + (i + 1)}>
    ${side ? html`<div className="withside"><div style=${{ display: "grid", gap: "12px" }}>${rest.map((b, k) => html`<${Block} key=${k} b=${b} />`)}</div><${Fig} img=${side.img} cap=${side.cap} w=${side.w} /></div>`
      : rest.map((b, k) => html`<${Block} key=${k} b=${b} />`)}<//>`;
}

        ${!m.noEval && html`<button className="btn" onClick=${() => go("#/quiz/" + m.id)}><${I} n="quiz" />Quiz du module${best != null ? " · meilleur score " + best + " %" : ""}</button>`}

/* ---------- Glossaire ---------- */
function Glossary() {
  const [q, setQ] = useState(""); const [th, setTh] = useState("all");
  const sorted = useMemo(() => GLOSSARY.slice().sort((a, b) => norm(a.t.replace(/^«\s*/, "")).localeCompare(norm(b.t.replace(/^«\s*/, "")))), []);
  const list = sorted.filter((g) => (th === "all" || g.m === th) && (!q || norm(g.t + " " + g.d + " " + g.ex).includes(norm(q))));
  const first = (g) => norm(g.t.replace(/^[«\s]+/, ""))[0].toUpperCase();
  const letters = [...new Set(sorted.map(first))];
  const present = new Set(list.map(first));
  return html`<div className="page">
    <${PageHead} kicker="S’entraîner" title="Glossaire" sub=${GLOSSARY.length + " mots de la formation, avec une définition simple et un exemple. Les termes de conception (charge cognitive, apprentissage multimédia) ne sont pas évalués."} />
    <div className="toolbar">
      <input className="search" type="search" placeholder="Rechercher un mot, une définition…" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="Rechercher dans le glossaire" />
      <select className="sel" value=${th} onChange=${(e) => setTh(e.target.value)} aria-label="Filtrer par thème">
        <option value="all">Tous les thèmes</option>${Object.entries(THEMES).map(([k, v]) => html`<option key=${k} value=${k}>${v}</option>`)}</select>
      <span className="small muted">${list.length} terme${list.length > 1 ? "s" : ""}</span>
    </div>
    <div className="letters" aria-label="Aller à la lettre">${letters.map((l) => html`<button key=${l} disabled=${!present.has(l)} onClick=${() => { const el = document.querySelector("[data-l='" + l + "']"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }}>${l}</button>`)}</div>
    <div className="gloss">${list.map((g, i) => { const l = first(g); const isFirst = i === 0 || first(list[i - 1]) !== l; return html`<article className="frame gl" key=${g.t} data-l=${isFirst ? l : null} style=${{ scrollMarginTop: "70px" }}>
      <div className="gl-head"><h3>${mark(g.t, q)}</h3><button className="chip neutral btnchip" style=${{ cursor: "pointer" }} onClick=${() => go("#/m/" + g.m)}>${THEMES[g.m]}</button></div>
      <p>${mark(g.d, q)}</p><div className="gl-ex"><b>Exemple</b>${rt(g.ex, q)}</div></article>`; })}</div>
    ${list.length === 0 && html`<${Msg}>Aucun terme ne correspond. Essayez un autre mot ou « Tous les thèmes ».<//>`}
  </div>`;
}

/* ---------- Flashcards (répétition espacée, d’après Anki) ---------- */

    else { c.ease = c.ease + 0.15; c.ivl = Math.max(c.ivl + 2, Math.round(c.ivl * c.ease * 1.3)); c.due = now + c.ivl * DAY; }

const ivlLabel = (ms) => { const m = Math.round(ms / MIN); if (m < 2) return "< 1 min"; if (m < 60) return m + " min"; const d = Math.round(ms / DAY); if (d < 31) return d + " j"; const mo = Math.round(d / 30); return mo < 12 ? mo + " mois" : (Math.round(d / 36.5) / 10) + " an"; };
function Flashcards({ st, set, initTheme }) {
  const fc = st.fc;

  const stateOf = (c) => fc.cards[c.id];
  const newCards = pool.filter((c) => !stateOf(c));
  const dueCards = pool.filter((c) => { const s = stateOf(c); return s && s.due <= now; });
  const learned = pool.filter((c) => { const s = stateOf(c); return s && s.state === "review" && s.due > now; });

    setFc({ themes }); setCram(isCram); setQueue(ids); setShow(false); setStats({ n: 0, again: 0 }); setMode(ids.length ? "run" : "setup");
  };

    if (!cur) return;
    const t = Date.now(); const prev = fc.cards[cur.id];

      const nc = sched(prev, g, t);

      set((o) => ({ ...o, fc: { ...o.fc, cards: { ...o.fc.cards, [cur.id]: nc }, today: isNew ? { d: today(), n: (o.fc.today.d === today() ? o.fc.today.n : 0) + 1 } : o.fc.today } }));

    } else if (g === 0) q.splice(Math.min(q.length, 4), 0, cur.id);
    setStats((s) => ({ n: s.n + 1, again: s.again + (g === 0 ? 1 : 0) }));
    setQueue(q); setShow(false); if (!q.length) setMode("done");
  }, [cur, queue, fc, cram]);

    if (mode !== "run") return;

    const learnCount = queue.filter((id) => { const s = fc.cards[id]; return s && (s.state === "learn" || s.state === "relearn"); }).length;

      <${PageHead} kicker=${cram ? "Révision libre (sans programmation)" : "Session de répétition espacée"} title="Flashcards" />

          <div className=${"front" + (td ? "" : " def")}>${td ? cur.t : cur.d}</div>
          ${show ? html`<hr /><div className="back">${td ? html`<div>${rt(cur.d)}</div>` : html`<div style=${{ fontSize: "22px", fontWeight: 600, textAlign: "center" }}>${cur.t}</div>`}<div className="ex"><b className="small muted">Exemple · </b>${rt(cur.ex)}</div></div>`
            : html`<span className="small muted">Formulez la réponse dans votre tête, puis cliquez ou appuyez sur <span className="kbd">Espace</span></span>`}
        </div>
        ${show ? html`<div className="grades" role="group" aria-label="Évaluez votre réponse">
          ${[["À revoir", "again"], ["Difficile", "hard"], ["Bien", "goodb"], ["Facile", "easy"]].map(([l, c], g) => html`<button key=${c} className=${"grade " + c} onClick=${() => grade(g)}>${l}<small>${cram ? (g === 0 ? "revient dans la session" : "suivante") : ivlLabel(sched(prev, g, now).due - now)}</small><span className="kbd">${g + 1}</span></button>`)}
        </div>` : html`<button className="btn primary" onClick=${() => setShow(true)}><${I} n="flip" />Afficher la réponse</button>`}

    <${PageHead} kicker="S’entraîner" title="Flashcards" sub="Sur le modèle d’Anki : formulez la réponse de mémoire, retournez la carte, puis évaluez-vous. Les cartes reviennent juste avant que vous ne les oubliiez." />

    <${Frame} title="1. Choisir les thèmes" hint="Aucun thème coché = toutes les cartes">
      <div className="row">${themeKeys.map((k) => html`<label key=${k} className="check" style=${{ gridTemplateColumns: "20px auto", padding: "3px 8px", border: "1px solid var(--line)" }}><input type="checkbox" checked=${themes.includes(k)} onChange=${() => toggleTheme(k)} />${THEMES[k]}</label>`)}</div><//>

          <div className="stat" style=${{ padding: 0 }}><span className="v" style=${{ color: "var(--good-ink)" }}>${learned.length}</span><span className="l">apprises, à revoir plus tard</span></div>

      <button className="btn" disabled=${pool.length === 0} onClick=${() => start(true)}>Révision libre de ${pool.length} cartes</button>
    </div>
    ${dueCards.length + newLeft === 0 && html`<${Msg}>Rien à revoir pour l’instant dans ces thèmes. Revenez plus tard, augmentez le nombre de nouvelles cartes, ou faites une révision libre.<//>`}

  </div>`;
}

/* ---------- Quiz ---------- */
function QuizList({ st }) {
  return html`<div className="page">
    <${PageHead} kicker="S’entraîner" title="Quiz" sub="Un quiz par module, avec une correction détaillée après chaque réponse." />
    <div className="quizlist">${EVAL_MODS.map((m) => { const r = st.quiz[m.id]; return html`<button key=${m.id} className="modcard" onClick=${() => go("#/quiz/" + m.id)}>
      <span className="nav-num">${m.n}</span><span><b>${m.title}</b><span className="s">${QUIZ[m.id].length} questions${r ? " · dernier score " + r.last + " %" : ""}</span></span>
      ${r ? html`<span className=${"chip " + (r.best >= 80 ? "good" : r.best >= 60 ? "neutral" : "warn")}>${r.best} %</span>` : html`<span className="chip neutral">À faire</span>`}</button>`; })}</div>
  </div>`;
}
function QuizRun({ m, set }) {

    if (n.filter((x) => x != null).length === qs.length) { const s = pct(n.filter((x, kk) => x === qs[kk].a).length, qs.length); set((o) => ({ ...o, quiz: { ...o.quiz, [m.id]: { last: s, best: Math.max(s, (o.quiz[m.id] && o.quiz[m.id].best) || 0) } } })); } };
  const L = "ABCD";
  if (done) {
    const s = pct(score, qs.length);
    return html`<div className="page">
      <${PageHead} kicker=${"Quiz · Module " + m.n} title=${m.title} />
      <${Frame} title="Résultat"><div className="scoreline"><span className="bigscore">${score} / ${qs.length}</span><span>${s >= 80 ? "Très bien : les notions de ce module sont en place." : s >= 60 ? "C’est un bon début : relisez les corrections ci-dessous." : "Reprenez le module, puis refaites le quiz."}</span></div><${Meter} v=${s} good=${s >= 80} />
        <div className="row"><button className="btn primary" onClick=${() => { setI(0); setAns([]); }}><${I} n="reset" />Recommencer</button><button className="btn" onClick=${() => go("#/m/" + m.id)}><${I} n="book" />Revoir le module</button><button className="btn" onClick=${() => go("#/quiz")}>Autres quiz</button></div><//>
      ${qs.map((q, k) => ans[k] !== q.a && html`<${Frame} key=${k} title=${"Question " + (k + 1)}><p className="q">${rt(q.q)}</p>
        <div className="res-ans"><span>Votre réponse : <b style=${{ color: "var(--bad-ink)" }}>${q.o[ans[k]][0]}</b></span><span>Réponse attendue : <b style=${{ color: "var(--good-ink)" }}>${q.o[q.a][0]}</b></span></div>

    </div>`;
  }

    <div className="dots" aria-label="Progression">${qs.map((x, k) => html`<span key=${k} className=${"dot" + (k === i ? " cur" : ans[k] == null ? "" : ans[k] === x.a ? " ok" : " ko")}>${k + 1}</span>`)}</div>

      ${a != null && html`<${Msg} kind=${a === q.a ? "good" : "bad"}><b>${a === q.a ? "Bonne réponse." : "Ce n’est pas la réponse attendue."}</b> ${rt(q.x)}<//>`}

    <//></div>`;
}

/* ---------- Questionnaire d’auto-positionnement ---------- */
const LIK = [["Pas du tout d’accord", "– –"], ["Plutôt pas d’accord", "–"], ["Plutôt d’accord", "+"], ["Tout à fait d’accord", "+ +"]];
AFFIRM.forEach((it) => { it.id = slug(it.s).slice(0, 48); });
const ORDER = seededShuffle(AFFIRM.map((_, k) => k), 2026);
const AK = (k) => AFFIRM[k].id;

function Questionnaire({ st, set }) {

  useEffect(() => {
    if (step !== "run") return;
    const h = (e) => { if (["1", "2", "3", "4"].includes(e.key)) { setAns(ORDER[pos], +e.key - 1); if (pos < AFFIRM.length - 1) setTimeout(() => setPos((p) => (p === pos ? p + 1 : p)), 220); } else if (e.key === "ArrowRight" && pos < AFFIRM.length - 1 && ans[ORDER[pos]] != null) setPos(pos + 1); else if (e.key === "ArrowLeft" && pos > 0) setPos(pos - 1); };
    window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h);
  }, [step, pos, ans]);
  if (step === "intro") return html`<div className="page">
    <${PageHead} kicker="Se situer" title="Questionnaire d’auto-positionnement sur l’attention" sub=${AFFIRM.length + " affirmations, dans l’esprit du questionnaire « 20 affirmations sur l’attention », reformulées avec le vocabulaire ATOLE."} />

  return html`<div className="page">
    <${PageHead} kicker="Se situer" title="Mes résultats au questionnaire" sub=${st.aff.date ? "Réalisé le " + new Date(st.aff.date).toLocaleDateString("fr-FR") : ""} />
    <${Frame} title="Vue d’ensemble">
      <div className="scoreline"><div><span className="bigscore">${sc.ok} / ${AFFIRM.length}</span><div className="small muted">réponses dans le sens attendu (${sc.pct} %)</div></div>
        <div><span className="chip good">${sc.franc} acquises</span> <span className="chip neutral">${nMid} à consolider</span> <span className="chip bad">${nKo} à retravailler</span></div></div>
      <p className="small muted"><b>Acquise</b> : réponse franche dans le sens attendu. <b>À consolider</b> : bon sens, mais avec hésitation (« plutôt »). <b>À retravailler</b> : réponse dans le sens contraire.</p>
      <div className="section-head">Par module</div>
      <div className="themebars">${mods.map((x) => html`<div className="tb" key=${x.m.id}><button className="linkbtn" onClick=${() => go("#/m/" + x.m.id)}>${x.m.n}. ${x.m.title}</button><${Meter} v=${x.p} good=${x.p >= 75} /><span className="v">${x.ok} / ${x.n}</span></div>`)}</div>
    <//>
    ${weak.length ? html`<${Msg} kind="warn"><b>À retravailler en priorité :</b> ${weak.map((x, i) => html`<${React.Fragment} key=${x.m.id}>${i ? ", " : ""}<button className="linkbtn" onClick=${() => go("#/m/" + x.m.id)}>module ${x.m.n} (${x.m.title})</button><//>`)}. Refaites ensuite le quiz du module et les cartes du thème${mats.length ? html`, et reprenez le contenu présenté lors de la ${mats.map((m) => "matinée " + m).join(", ").replace(/, ([^,]*)$/, " et $1")}` : ""}.<//>`
      : html`<${Msg} kind="good"><b>Les notions fondamentales sont bien en place.</b> Consolidez les réponses hésitantes avec les flashcards, puis passez à l’auto-évaluation des compétences.<//>`}
    <div className="row between"><div className="row" role="group" aria-label="Filtrer">
      ${[["work", "À retravailler et à consolider (" + (nKo + nMid) + ")"], ["ok", "Acquises (" + sc.franc + ")"], ["all", "Toutes (" + AFFIRM.length + ")"]].map(([k, l]) => html`<button key=${k} className=${"btn" + (filter === k ? " primary" : "")} onClick=${() => setFilter(k)}>${l}</button>`)}</div>
      <div className="row"><button className="btn" onClick=${() => { setPos(0); setStep("run"); }}>Modifier mes réponses</button><button className="btn" onClick=${restart}><${I} n="reset" />Recommencer</button><button className="btn primary" onClick=${() => go("#/autoeval")}>Auto-évaluation<${I} n="right" /></button></div></div>
    ${shown.map((x) => { const g = x.it.o && Y26[x.it.o]; return html`<article className="frame res-item" key=${x.k}>
      <div className="res-top"><span className="dot">${x.p + 1}</span>${x.r === "ok" ? html`<span className="chip good">Acquise</span>` : x.r === "mid" ? html`<span className="chip neutral">À consolider</span>` : html`<span className="chip bad">À retravailler</span>`}
        ${g ? html`<span className=${"chip " + (g < 75 ? "warn" : "neutral")} title="Pourcentage de réponses dans le sens attendu, groupe 2026 (affirmation d’origine)">Groupe 2026 : ${g} %</span>` : null}</div>
      <p className="st">${x.it.s}</p>
      <div className="res-ans"><span>Votre réponse : <b>${LIK[x.v][0]}</b></span><span>Réponse attendue : <b>${x.it.e === "A" ? "D’accord" : "Pas d’accord"}</b></span></div>
      <div className="res-x">${rt(x.it.x)}</div>
      <div className="small">Retravailler : <button className="linkbtn" onClick=${() => go("#/m/" + x.it.m)}>module ${MOD[x.it.m].n} · ${MOD[x.it.m].title}</button> · ${MATINEES[x.it.mat]}</div></article>`; })}
    ${shown.length === 0 && html`<${Msg}>Aucune affirmation dans cette catégorie.<//>`}
  </div>`;
}

/* ---------- Auto-évaluation des compétences (échelle de Likert à 4 niveaux) ---------- */
const LEVELS = [
  ["Pas acquis", "Je ne saurais pas l’expliquer ni l’appliquer."],
  ["En cours d’acquisition", "Je comprends l’idée, mais j’ai besoin du support."],
  ["Acquis", "Je sais l’expliquer et l’appliquer en séance."],
  ["Maîtrisé", "Je saurais l’expliquer à un enfant, à sa famille ou à un collègue."]
];
const LV_CLS = ["l0", "l1", "l2", "l3"];
const lvTxt = (v) => (v == null ? "non évalué" : (v + 1) + "/4 – " + LEVELS[v][0]);
const avg = (vals) => { const v = vals.filter((x) => x != null); return v.length ? v.reduce((a, b) => a + b + 1, 0) / v.length : null; };
const fmt1 = (x) => x.toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
function buildMail(st) {
  const se = st.se; const lv = se.lv || {}; const cl = se.cl || {}; const ol = se.ol || {}; const L = [];
  L.push("Bonjour Sylvie et Rémi,", "", "Voici mon auto-évaluation pour la formation « TND : programme de psychoéducation et de remédiation cognitive de l’attention et des fonctions exécutives ».", "");
  if (se.name) L.push("Nom : " + se.name);
  L.push("Date : " + new Date().toLocaleDateString("fr-FR"), "", "Échelle : 1 = Pas acquis · 2 = En cours d’acquisition · 3 = Acquis · 4 = Maîtrisé", "", "COMPÉTENCES VISÉES");
  COMPETENCES.forEach((c, i) => {
    const a = avg(c.o.map((_, j) => lv[c.id + "-" + j]));
    L.push("", (i + 1) + ". " + c.t, "   Évaluation globale de la compétence : " + lvTxt(cl[c.id]) + (a != null ? " (moyenne de mes objectifs : " + fmt1(a) + "/4)" : ""));
    c.o.forEach((o, j) => L.push("   • " + o + " : " + lvTxt(lv[c.id + "-" + j])));
    if (se.notes[c.id] && se.notes[c.id].trim()) L.push("   Difficultés, questions : " + se.notes[c.id].trim());
  });
  L.push("", "OBJECTIFS OPÉRATIONNELS");
  OBJ_OP.forEach((o, j) => L.push("   • " + o + " : " + lvTxt(ol[j])));
  if (se.general && se.general.trim()) L.push("", "MESSAGE AUX FORMATEURS", se.general.trim());
  if (se.attach) {
    L.push("", "SYNTHÈSE DE MES RÉSULTATS DANS L’APPLICATION « RÉVISER ATOLE »");
    if (st.aff.done) { const sc = affScore(st.aff.ans); const weak = EVAL_MODS.filter((m) => sc.by[m.id] && pct(sc.by[m.id].ok, sc.by[m.id].n) < 75).map((m) => m.title);
      L.push("- Questionnaire d’auto-positionnement : " + sc.ok + "/" + AFFIRM.length + " réponses dans le sens attendu (" + sc.pct + " %)" + (weak.length ? " ; à retravailler : " + weak.join(", ") : ""));
      const ko = AFFIRM.map((it) => ({ it, r: verdict(it, st.aff.ans[it.id]) })).filter((x) => x.r === "ko");
      if (ko.length) { L.push("  Affirmations où ma réponse diffère de la réponse attendue :"); ko.forEach((x) => L.push("  • " + x.it.s)); }
    } else L.push("- Questionnaire d’auto-positionnement : non réalisé");
    const qz = EVAL_MODS.filter((m) => st.quiz[m.id]).map((m) => m.title + " " + st.quiz[m.id].best + " %");
    L.push("- Quiz (meilleur score) : " + (qz.length ? qz.join(" ; ") : "aucun quiz réalisé"));
    L.push("- Modules lus : " + EVAL_MODS.filter((m) => st.read[m.id]).length + "/" + EVAL_MODS.length);
    L.push("- Flashcards apprises : " + CARDS.filter((c) => st.fc.cards[c.id] && st.fc.cards[c.id].state === "review").length + "/" + CARDS.length);
  }
  L.push("", "Cordialement,", se.name || "");
  return L.join("\n");
}
function Scale({ v, onSet, label, big }) {
  return html`<div className=${"scale" + (big ? " big" : "")} role="radiogroup" aria-label=${label}>${LEVELS.map(([t, d], k) => html`<button key=${k} type="button" role="radio" aria-checked=${v === k} className=${"sc " + LV_CLS[k]} title=${d} onClick=${() => onSet(v === k ? null : k)}><span className="n">${k + 1}</span><span className="t">${t}</span></button>`)}</div>`;
}
function SelfEval({ st, set, toast }) {
  const se = st.se; const lv = se.lv || {}; const cl = se.cl || {}; const ol = se.ol || {};
  const up = (patch) => set((o) => ({ ...o, se: { ...o.se, ...patch } }));
  const setLv = (id, v) => up({ lv: { ...lv, [id]: v } });
  const mail = buildMail(st);
  const subject = "Auto-évaluation formation EDI ATOLE" + (se.name ? " – " + se.name : "");
  const doCopy = async () => { toast((await copyText(mail)) ? "Message copié dans le presse-papiers" : "La copie a échoué : sélectionnez le texte à la main"); };
  const doMail = async () => { await copyText(mail); const url = "mailto:" + MAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(mail); if (url.length > 1900) { window.location.href = "mailto:" + MAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent("[Collez ici le message copié depuis l’application : Ctrl+V ou Cmd+V]"); toast("Message copié : collez-le dans le courriel qui s’ouvre"); } else { window.location.href = url; toast("Message copié et courriel ouvert"); } };
  const total = COMPETENCES.reduce((a, c) => a + c.o.length + 1, 0) + OBJ_OP.length;
  const done = COMPETENCES.reduce((a, c) => a + c.o.filter((_, j) => lv[c.id + "-" + j] != null).length + (cl[c.id] != null ? 1 : 0), 0) + OBJ_OP.filter((_, j) => ol[j] != null).length;
  return html`<div className="page">
    <${PageHead} kicker="Se situer" title="Auto-évaluation des compétences" sub="Pour chaque objectif, puis pour chaque compétence dans son ensemble, situez votre degré d’acquisition. Notez vos difficultés et vos questions, puis envoyez le tout aux formateurs." />
    <${Frame} title="L’échelle">
      <div className="legend4">${LEVELS.map(([t, d], k) => html`<div key=${k} className=${"lg " + LV_CLS[k]}><b>${k + 1} · ${t}</b><span>${d}</span></div>`)}</div>
      <p className="small muted">Il n’y a pas de position neutre. Cliquez à nouveau sur un niveau pour l’effacer.</p><//>
    <${Frame} title="Vue d’ensemble" hint=${done + " / " + total + " évaluations"}>
      <div className="themebars">${COMPETENCES.map((c, i) => { const a = avg(c.o.map((_, j) => lv[c.id + "-" + j])); const g = cl[c.id]; const n = c.o.filter((_, j) => lv[c.id + "-" + j] != null).length;
        return html`<div className="tb" key=${c.id}><button className="linkbtn" onClick=${() => { const el = document.getElementById("comp-" + c.id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }}>Compétence ${i + 1}</button>
          <${Meter} v=${a == null ? 0 : ((a - 1) / 3) * 100} good=${a != null && a >= 3} /><span className="v">${a == null ? "–" : fmt1(a) + "/4"}</span>
          <span className="tb-sub small muted">${n}/${c.o.length} objectifs · globale : ${g == null ? "–" : (g + 1) + "/4"}</span></div>`; })}</div><//>
    ${COMPETENCES.map((c, i) => { const a = avg(c.o.map((_, j) => lv[c.id + "-" + j])); const g = cl[c.id];
      const gap = a != null && g != null && Math.abs(g + 1 - a) >= 1;
      return html`<${Frame} key=${c.id} id=${"comp-" + c.id} title=${"Compétence " + (i + 1)} hint=${MATINEES[c.mat]}>
      <div className="comp"><h3>${c.t}</h3>
        <div className="objs">${c.o.map((o, j) => { const id = c.id + "-" + j; return html`<div key=${id} className="obj"><span className="obj-t">${o}</span><${Scale} v=${lv[id]} label=${o} onSet=${(v) => setLv(id, v)} /></div>`; })}</div>
        <div className="global"><div><span className="lbl">Évaluation globale de la compétence</span><span className="small muted">${a == null ? "Évaluez d’abord les objectifs ci-dessus." : "Moyenne de vos objectifs : " + fmt1(a) + "/4"}</span></div>
          <${Scale} big=${true} v=${g} label=${"Évaluation globale : " + c.t} onSet=${(v) => up({ cl: { ...cl, [c.id]: v } })} /></div>
        ${gap && html`<${Msg} kind="warn">Votre évaluation globale (${g + 1}/4) s’écarte de la moyenne de vos objectifs (${fmt1(a)}/4). Ce décalage est intéressant à signaler aux formateurs : dites en quelques mots ce qui l’explique.<//>`}
        <label className="small"><span className="lbl">Mes difficultés, mes questions (facultatif)</span><textarea className="ta" value=${se.notes[c.id] || ""} onInput=${(e) => up({ notes: { ...se.notes, [c.id]: e.target.value } })} placeholder="Ce qui reste flou, une situation clinique où j’hésite…"></textarea></label></div><//>`; })}
    <${Frame} title="Objectifs opérationnels de la formation" hint="Je me sens capable de…">
      <div className="objs">${OBJ_OP.map((o, j) => html`<div key=${j} className="obj"><span className="obj-t">${o}</span><${Scale} v=${ol[j]} label=${o} onSet=${(v) => up({ ol: { ...ol, [j]: v } })} /></div>`)}</div><//>
    <${Frame} title="Message aux formateurs">
      <label className="small"><span className="lbl">Retours, difficultés de mise en place, besoins (facultatif)</span><textarea className="ta" style=${{ minHeight: "110px" }} value=${se.general} onInput=${(e) => up({ general: e.target.value })} placeholder="Par exemple : la difficulté que je rencontre pour mettre en place RAPPEL avec un patient, une question à aborder lors d’une matinée…"></textarea></label>
      <div className="two"><label className="small"><span className="lbl">Nom et prénom (facultatif)</span><input className="inp" value=${se.name} onInput=${(e) => up({ name: e.target.value })} autocomplete="name" /></label>
        <label className="check" style=${{ alignSelf: "end" }}><input type="checkbox" checked=${se.attach} onChange=${(e) => up({ attach: e.target.checked })} /><span>Joindre la synthèse de mes résultats (questionnaire, quiz, modules, flashcards)</span></label></div><//>
    <${Frame} title="Envoyer à contact@apstraco.fr" hint="Rien n’est envoyé automatiquement">
      ${done < total && html`<${Msg}>Il reste ${total - done} évaluation${total - done > 1 ? "s" : ""} à faire. Vous pouvez tout de même envoyer le message : les éléments manquants y figureront comme « non évalué ».<//>`}
      <pre className="mail" aria-label="Aperçu du message">${mail}</pre>
      <div className="row"><button className="btn primary" onClick=${doMail}><${I} n="mail" />Ouvrir dans ma messagerie</button><button className="btn" onClick=${doCopy}><${I} n="copy" />Copier le message</button></div>
      <p className="small muted">Si votre messagerie ne s’ouvre pas, copiez le message et collez-le dans un courriel à <b>${MAIL}</b>, objet « ${subject} ».</p><//>
  </div>`;
}

/* ---------- Application ---------- */
function App() {
  const [st, setSt] = useState(load);
  const [open, setOpen] = useState(false); const [msg, setMsg] = useState(null); const [confirmReset, setConfirmReset] = useState(false);
  useEffect(() => { save(st); }, [st]);
  const hash = useHash();
  useEffect(() => { setOpen(false); if (!hash.startsWith("#/m/")) window.scrollTo(0, 0); }, [hash]);
  const toast = (t) => { setMsg(t); setTimeout(() => setMsg(null), 2600); };
  const [path, qs] = hash.slice(1).split("?"); const parts = path.split("/").filter(Boolean);
  let page, cur = parts[0] || "home";
  if (parts[0] === "m" && MOD[parts[1]]) { page = html`<${ModulePage} m=${MOD[parts[1]]} st=${st} set=${setSt} />`; cur = "m/" + parts[1]; }
  else if (parts[0] === "glossaire") page = html`<${Glossary} />`;
  else if (parts[0] === "flashcards") { const t = new URLSearchParams(qs || "").get("t"); page = html`<${Flashcards} key=${t || "all"} st=${st} set=${setSt} initTheme=${t && THEMES[t] ? t : null} />`; }
  else if (parts[0] === "quiz" && parts[1] && QUIZ[parts[1]]) { page = html`<${QuizRun} m=${MOD[parts[1]]} set=${setSt} />`; cur = "quiz"; }
  else if (parts[0] === "quiz") page = html`<${QuizList} st=${st} />`;
  else if (parts[0] === "questionnaire") page = html`<${Questionnaire} st=${st} set=${setSt} />`;
  else if (parts[0] === "autoeval") page = html`<${SelfEval} st=${st} set=${setSt} toast=${toast} />`;
  else { page = html`<${Home} st=${st} />`; cur = "home"; }
  const NB = ({ to, k, icon, label, extra, cls }) => html`<button className=${"nav-btn" + (cls ? " " + cls : "")} aria-current=${cur === k ? "page" : null} onClick=${() => go(to)}>${icon}${label}${extra}</button>`;
  const due = CARDS.filter((c) => { const s = st.fc.cards[c.id]; return s && s.due <= Date.now(); }).length;
  return html`<div className=${"app" + (open ? " open" : "")}>
    <div className="topbar"><button className="btn" onClick=${() => setOpen(true)} aria-label="Ouvrir le menu"><${I} n="menu" /></button>Réviser ATOLE</div>
    ${open && html`<div className="scrim" onClick=${() => setOpen(false)}></div>`}
    <nav className="side" aria-label="Navigation">
      <div className="side-head"><span className="side-kicker">Formation EDI</span><span className="side-title">Réviser ATOLE</span><span className="side-sub">Attention et fonctions exécutives</span></div>
      <div className="navgroup"><${NB} to="#/" k="home" icon=${html`<${I} n="home" />`} label="Accueil" /></div>
      <div className="navgroup"><span className="navlab">Apprendre</span>
        ${MODULES.map((m) => html`<${NB} key=${m.id} to=${"#/m/" + m.id} k=${"m/" + m.id} cls=${st.read[m.id] ? "done" : ""} icon=${html`<span className="nav-num">${st.read[m.id] ? html`<${I} n="check" s=${12} />` : m.n}</span>`} label=${m.noEval ? "Concevoir les supports" : m.title.replace(/ :.*$/, "").replace("Les personnages ATOLE et les personnages neurones", "Personnages ATOLE et neurones")} />`)}</div>
      <div className="navgroup"><span className="navlab">S’entraîner</span>
        <${NB} to="#/glossaire" k="glossaire" icon=${html`<${I} n="list" />`} label="Glossaire" />
        <${NB} to="#/flashcards" k="flashcards" icon=${html`<${I} n="cards" />`} label="Flashcards" extra=${due ? html`<span className="badge">${due} à revoir</span>` : null} />
        <${NB} to="#/quiz" k="quiz" icon=${html`<${I} n="quiz" />`} label="Quiz" /></div>
      <div className="navgroup"><span className="navlab">Se situer</span>
        <${NB} to="#/questionnaire" k="questionnaire" icon=${html`<${I} n="compass" />`} label="Questionnaire sur l’attention" extra=${st.aff.done ? html`<span className="tick"><${I} n="check" s=${14} /></span>` : null} />
        <${NB} to="#/autoeval" k="autoeval" icon=${html`<${I} n="clip" />`} label="Auto-évaluation" /></div>
      <div className="side-foot">
        <a href="index.html">← Accueil des applications</a>
        ${confirmReset ? html`<span>Effacer toute la progression ? <button className="linkbtn" onClick=${() => { setSt(DEFAULT); setConfirmReset(false); toast("Progression effacée"); }}>Oui, effacer</button> · <button className="linkbtn" onClick=${() => setConfirmReset(false)}>Annuler</button></span>`
          : html`<button className="linkbtn" style=${{ color: "var(--ink-3)" }} onClick=${() => setConfirmReset(true)}>Effacer ma progression</button>`}
        <span>D’après le programme <a href="https://project.crnl.fr/atole/" target="_blank" rel="noopener">ATOLE</a> (J.-P. Lachaux, Inserm). Personnages : inspiré par ATOLE © J.-P. Lachaux, Inserm.</span>
      </div>
    </nav>
    <main className="main" id="main">${page}</main>
    ${msg && html`<div className="toast" role="status">${msg}</div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

</script>
</body>
</html>
