r\xE9ciser \xE0 quoi se rapporte le nombre (ex. unit\xE9s de mesure)."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Math\xE9matiques",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"repondre-questionnaire-sur-un-texte",source:"Repondre_questionnaire_sur_un_texte.txt",title:"R\xE9pondre \xE0 un questionnaire sur un texte lu seul",authors:["R\xE9mi SAMIER & Sylvie JACQUES orthophonistes","Anne-Sophie WYFFELS Enseignante RASED"],level:"Primaire",objective:"R\xE9pondre \xE0 un questionnaire sur un texte lu tout seul.",maximoi:"Mon objectif est de r\xE9pondre \xE0 un questionnaire sur un texte lu tout seul.",notes:[],minimoi:[{title:"Je lis les questions.",i:"Je veux savoir \xE0 l\u2019avance ce qu\u2019on me demande de rechercher dans le texte.",p:"Je lis les mots et j\u2019active les images en lien avec les mots.",m:["Je garde en m\xE9moire ce que je dois chercher."],mem:"",notes:[],hasPim:!0},{title:"Je lis mon texte pour cr\xE9er mon petit film.",i:"Je veux construire un film.",p:"Je lis les mots et j\u2019active les images correspondantes.",m:["Je me construis un film dans ma t\xEAte et je le modifie au fur et \xE0 mesure de l\u2019histoire lue."],mem:"",notes:[],hasPim:!0},{title:"Je relis le texte en cherchant les informations qui correspondent aux questions.",i:"Je veux s\xE9lectionner dans le texte les informations qui permettent de r\xE9pondre aux questions.",p:"Je relis le texte en me rappelant des questions et de ce que je dois rechercher.",m:["Je souligne les informations dans le texte et je remplis le tableau d\u2019analyse de ce que je sais et de ce que je ne sais pas."],mem:"",notes:[],hasPim:!0},{title:"Je r\xE9ponds aux questions.",i:"Je veux \xE9crire la r\xE9ponse \xE0 la question pos\xE9e.",p:"Je relis les mots de la question.",m:["J\u2019utilise les mots de la question pour cr\xE9er une phrase qui pr\xE9sente l\u2019information trouv\xE9e dans le texte."],mem:"",notes:[],hasPim:!0},{title:"Je v\xE9rifie que mes r\xE9ponses correspondent bien \xE0 mon petit film.",i:"Je veux v\xE9rifier que la r\xE9ponse \xE0 la question pos\xE9e correspond bien \xE0 mon petit film.",p:"Je relis ma r\xE9ponse et je repense \xE0 mon petit film.",m:["Je compare ma r\xE9ponse \xE0 mon petit film."],mem:"",notes:[],hasPim:!0},{title:"Si \xE7a ne correspond pas, je relis le texte pour chercher d\u2019autres informations ou pour modifier mon petit film.",i:"Je veux relire le texte pour am\xE9liorer mes r\xE9ponses ou le \xAB petit film \xBB.",p:"Je lis le texte et j\u2019active les images correspondantes.",m:["J\u2019efface, j\u2019ajoute ou je change certaines images de mon premier film en fonction de ce que je d\xE9couvre \xE0 ma deuxi\xE8me lecture et je modifie mes r\xE9ponses si \xE7a ne correspond pas."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Lecture",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"relecture-dictee",source:"Relecture_dictee.txt",title:"Relis ta dict\xE9e",authors:["Marie BASTIE Enseignante sp\xE9cialis\xE9e"],level:"CE1",objective:"R\xE9duire le nombre d\u2019erreurs dans une dict\xE9e.",maximoi:"Mon objectif est de relire ma dict\xE9e.",notes:[],minimoi:[{title:"Regarde s\u2019il ne manque pas de mots.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Regarde la ponctuation.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"V\xE9rifie les mots appris.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Relis pour voir si tu as mis les bons costumes aux verbes.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"V\xE9rifie si ton \xE9criture est lisible.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1}],expert:[],domain:"\xC9criture & langue",publics:["\xC9l\xE9mentaire"],kind:"minimoi"},{id:"redaction-lettre",source:"Redaction_lettre.txt",title:"R\xE9diger une lettre",authors:["R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"6e",objective:"R\xE9diger une lettre.",maximoi:"Mon objectif est de r\xE9diger une lettre.",notes:["Consigne : suite \xE0 la lecture d\u2019une sc\xE8ne du Malade imaginaire, \xE9crire une lettre \xE0 un(e) ami(e) pour pr\xE9senter votre vision du mariage id\xE9al (conditions id\xE9ales, erreurs \xE0 \xE9viter)."],minimoi:[{title:"Imaginer les conditions pour un mariage id\xE9al.",i:"Je veux imaginer les conditions pour un mariage id\xE9al.",p:"Je me redis et je revois mentalement toutes les situations (dans la vie, au cin\xE9ma, dans les livres) qui correspondent \xE0 un mariage id\xE9al.",m:["\xC0 partir de ces situations, je note au brouillon les raisons pour lesquelles le mariage \xE9tait id\xE9al (ex. persistance des sentiments, complicit\xE9, projet commun, etc.)."],mem:"",notes:[],hasPim:!0},{title:"Imaginer les erreurs qui peuvent affecter un mariage.",i:"Je veux imaginer les erreurs qui peuvent d\xE9truire un mariage.",p:"Je me redis et je revois mentalement toutes les situations (dans la vie, au cin\xE9ma, dans les livres) qui correspondent \xE0 un mariage rat\xE9.",m:["\xC0 partir de ces situations, je note au brouillon les raisons pour lesquelles le mariage \xE9tait rat\xE9 (ex. perte des sentiments, tromperie, disputes \xE0 r\xE9p\xE9tition, violence, etc.)."],mem:"",notes:[],hasPim:!0},{title:"Imaginer \xE0 quel ami \xE9crire une lettre.",i:"Je veux savoir \xE0 quel ami (r\xE9el ou imaginaire) je vais \xE9crire une lettre.",p:"J\u2019imagine mentalement mon ami.",m:["Je m\u2019imagine en train de lui expliquer ma vision du mariage."],mem:"",notes:[],hasPim:!0},{title:"Organiser les id\xE9es pour pr\xE9senter la vision du mariage id\xE9al \xE0 cet ami.",i:"Je veux organiser mes id\xE9es sur le mariage pour les pr\xE9senter \xE0 mon ami.",p:"Je m\u2019imagine \xEAtre avec mon ami et je lui explique les conditions id\xE9ales et les erreurs \xE0 \xE9viter pour r\xE9ussir un mariage.",m:["Au brouillon, je note l\u2019ordre dans lequel je pr\xE9sente les id\xE9es \xE0 mon ami."],mem:"",notes:[],hasPim:!0},{title:"Se rappeler des r\xE8gles d\u2019\xE9criture d\u2019une lettre.",i:"Je veux me rappeler des r\xE8gles d\u2019\xE9criture d\u2019une lettre.",p:"Je me rappelle mentalement des exemples de lettres que j\u2019ai d\xE9j\xE0 vues. Si besoin je recherche des exemples de lettres.",m:["Je note au brouillon les caract\xE9ristiques d\u2019une lettre (salutation, demande de nouvelles, contenu de la lettre en s\u2019adressant \xE0 l\u2019ami, conclusion, signature)."],mem:"",notes:[],hasPim:!0},{title:"\xC9crire la lettre \xE0 cet ami en pr\xE9sentant la vision du mariage.",i:"Je veux \xE9crire la lettre \xE0 mon ami en pr\xE9sentant ma vision du mariage.",p:"Je regarde sur mon brouillon l\u2019organisation des id\xE9es et les r\xE8gles d\u2019\xE9criture d\u2019une lettre.",m:["Sur un nouveau brouillon, je commence l\u2019\xE9criture de la lettre \xE0 mon ami."],mem:"",notes:[],hasPim:!0},{title:"Corriger les erreurs d\u2019orthographe.",i:"Je veux corriger mes erreurs d\u2019orthographe.",p:"Je relis mon brouillon de lettre phrase par phrase.",m:["Je suis les \xE9tapes du code CHAMPIONS pour relire mes phrases et corriger les erreurs d\u2019orthographe."],mem:"",notes:[],hasPim:!0},{title:"Recopier la lettre au propre.",i:"Je veux recopier ma lettre au propre.",p:"Je regarde mon brouillon.",m:["Je recopie les phrases de mon brouillon sur une nouvelle feuille."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"\xC9criture & langue",publics:["Coll\xE8ge"],kind:"pim"},{id:"redaction-fin-histoire",source:"Redaction_fin_histoire.txt",title:"R\xE9diger la fin d\u2019une histoire",authors:["Clotilde HEUDE Professeur de CM1","R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"CM2",objective:"Imaginer et r\xE9diger la fin d\u2019une histoire.",maximoi:"Mon objectif est d\u2019imaginer et de r\xE9diger la fin d\u2019une histoire.",notes:["Consigne (Le Royaume de Kensuk\xE9) : relis les trois derniers paragraphes du chapitre 3, puis invente la suite de l\u2019histoire. Ton r\xE9cit devra commencer \xE0 l\u2019instant o\xF9 Michael sort la t\xEAte de l\u2019eau et se terminer au moment o\xF9 il sera sauv\xE9. Ton histoire devra rester plausible et coh\xE9rente (il est seul au milieu de l\u2019oc\xE9an Pacifique). Ton texte doit \xEAtre \xE9crit uniquement au pass\xE9 simple et \xE0 l\u2019imparfait."],minimoi:[{title:"Comprendre le texte qui sert de d\xE9but \xE0 ma r\xE9daction.",i:"Je veux comprendre le texte qui sert de d\xE9but \xE0 ma r\xE9daction.",p:"Je lis les mots \xE9crits.",m:["Je transforme les mots lus en images mentales et je me raconte avec la petite voix ce que j\u2019ai compris."],mem:"",notes:[],hasPim:!0},{title:"Noter les informations importantes \xE0 utiliser.",i:"Je veux noter les informations importantes de l\u2019histoire \xE0 utiliser.",p:"Je me raconte et je revois dans ma t\xEAte le film du d\xE9but de l\u2019histoire.",m:["Avec l\u2019aide du neurone m\xE9moire, je note les r\xE9ponses aux questions du 3QOCPP."],mem:"",notes:[],hasPim:!0},{title:"Imaginer le film de la suite de l\u2019histoire.",i:"Je veux imaginer la suite de l\u2019histoire \xE0 raconter.",p:"Je repense au d\xE9but du film, aux informations importantes que je sais, aux connaissances que j\u2019ai dans ma m\xE9moire et \xE0 l\u2019objectif de l\u2019histoire (sauvetage du h\xE9ros).",m:["Je transforme mes connaissances en images mentales pour imaginer la suite de l\u2019histoire et je me raconte avec la petite voix le film."],mem:"",notes:[],hasPim:!0},{title:"Noter les id\xE9es et les actions du film.",i:"Je veux noter les id\xE9es de l\u2019histoire que j\u2019ai imagin\xE9e.",p:"Je revois et je me raconte dans la t\xEAte le film que j\u2019ai imagin\xE9.",m:["Je note sur mon brouillon les id\xE9es et les actions du film que j\u2019ai imagin\xE9."],mem:"",notes:[],hasPim:!0},{title:"\xC9crire l\u2019histoire au brouillon.",i:"Je veux \xE9crire l\u2019histoire au brouillon.",p:"Je repense au film de mon histoire et je relis les notes sur mon brouillon.",m:["J\u2019\xE9cris mon histoire en respectant les consignes d\u2019\xE9criture."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier la coh\xE9rence du r\xE9cit.",i:"Je veux v\xE9rifier que mon r\xE9cit respecte bien les indications de la consigne et les informations importantes.",p:"Je relis la consigne et les informations importantes que j\u2019ai not\xE9es puis je relis mon r\xE9cit.",m:["Je v\xE9rifie qu\u2019il n\u2019y a pas d\u2019incoh\xE9rence, d\u2019erreurs au niveau du sens entre mon r\xE9cit, les informations importantes du d\xE9but de l\u2019histoire et la consigne."],mem:"",notes:[],hasPim:!0},{title:"Corriger les erreurs d\u2019orthographe avec le code CHAMPIONS.",i:"Je veux corriger mes erreurs d\u2019orthographe.",p:"Je relis mon brouillon.",m:["Je suis les \xE9tapes du code CHAMPIONS pour relire mes phrases et corriger les erreurs d\u2019orthographe."],mem:"",notes:[],hasPim:!0},{title:"Recopier le texte au propre.",i:"Je veux recopier le texte au propre.",p:"Je lis une par une les phrases de mon brouillon.",m:["Je les recopie une par une au propre."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"\xC9criture & langue",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"ranger-une-feuille",source:"Ranger_une_feuille.txt",title:"Ranger une feuille dans un lutin",authors:["Val\xE9rie LE ROUX Cheffe d\u2019\xE9tablissement"],level:"Primaire",objective:"Ranger la feuille d\u2019un texte de lecture dans un lutin",maximoi:"Mon objectif est de ranger la feuille du texte de lecture dans le lutin.",notes:["Avant de commencer : je suis en contact avec ce que va dire la ma\xEEtresse."],minimoi:[{title:"J\u2019\xE9coute la consigne.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Je cherche mon lutin.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Je range la feuille dans le lutin.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Je range mon lutin dans la case.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1}],expert:[],domain:"M\xE9thode & autonomie",publics:["\xC9l\xE9mentaire"],kind:"minimoi"},{id:"raconter-un-film",source:"Raconter_un_film.txt",title:"Raconter un film",authors:["R\xE9mi SAMIER & Sylvie JACQUES orthophonistes","Fr\xE9d\xE9rique LE HOUEZEC P\xE9dopsychiatre"],level:"Non pr\xE9cis\xE9",objective:"D\xE9tailler les \xE9tapes pour pouvoir raconter l\u2019histoire d\u2019un film.",maximoi:"Mon objectif est de m\xE9moriser les informations importantes pour pouvoir raconter l\u2019histoire d\u2019un film.",notes:["Deux temps : m\xE9morisation de l\u2019histoire pendant le film (minimoi 1 \xE0 8), puis restitution de l\u2019histoire (minimoi 9 \xE0 14)."],minimoi:[{title:"Identifier quand se d\xE9roule le film",i:"Je veux identifier quand se d\xE9roule l\u2019histoire.",p:"Pendant le film, je rep\xE8re les informations qui situent le film dans le temps.",m:["Je me dis mentalement \xE0 quelle p\xE9riode se d\xE9roule le film (cela peut \xEAtre un temps r\xE9el ou imaginaire)."],mem:"",notes:[],hasPim:!0},{title:"M\xE9moriser quand se d\xE9roule le film",i:"Je veux m\xE9moriser quand se d\xE9roule le film.",p:"Je repense mentalement avec des mots et des images \xE0 quelle p\xE9riode se situe le film.",m:["Je m\xE9morise le nom de cette p\xE9riode et les indices du film qui aident \xE0 s\u2019en rappeler."],mem:"",notes:[],hasPim:!0},{title:"Identifier o\xF9 se d\xE9roule l\u2019histoire du film",i:"Je veux identifier o\xF9 se d\xE9roule l\u2019histoire du film.",p:"Pendant le film, je rep\xE8re les lieux o\xF9 se passe le film.",m:["Je me dis mentalement dans quels lieux se d\xE9roule le film (cela peut \xEAtre un lieu r\xE9el ou imaginaire)."],mem:"",notes:[],hasPim:!0},{title:"M\xE9moriser o\xF9 se d\xE9roule l\u2019histoire du film",i:"Je veux m\xE9moriser o\xF9 se d\xE9roule l\u2019histoire du film.",p:"Je revois et je me redis mentalement dans quels lieux se situe le film.",m:["Je m\xE9morise le nom de ces lieux et les indices du film qui aident \xE0 s\u2019en rappeler."],mem:"",notes:[],hasPim:!0},{title:"Identifier les actions principales du film",i:"Je veux identifier les actions principales du film.",p:"Je repense mentalement avec des mots et des images \xE0 l\u2019histoire du film.",m:["Je fais le tri entre les actions qui ont un r\xF4le sur la suite de l\u2019histoire et celles qui n\u2019ont pas d\u2019importance pour la suite de l\u2019histoire. Pour aider \xE0 faire le tri, je peux me rappeler les \xE9tapes du sch\xE9ma narratif."],mem:"",notes:[],hasPim:!0},{title:"M\xE9moriser les actions principales du film",i:"Je veux m\xE9moriser les actions principales du film.",p:"Je repense mentalement avec des mots et des images aux actions principales (le sch\xE9ma narratif) du film.",m:["Je m\xE9morise les actions principales (le sch\xE9ma narratif du film)."],mem:"",notes:[],hasPim:!0},{title:"Identifier les personnages principaux du film",i:"Je veux identifier les personnages principaux du film.",p:"Je repense mentalement avec des mots et des images aux actions principales du film.",m:["Je me dis qui sont les personnages qui effectuent les actions principales."],mem:"",notes:[],hasPim:!0},{title:"M\xE9moriser les personnages principaux du film",i:"Je veux m\xE9moriser les personnages principaux du film.",p:"Je repense mentalement avec des mots et des images aux noms des personnages principaux.",m:["Je m\xE9morise les noms des personnages principaux en lien avec les actions principales du film (du sch\xE9ma narratif)."],mem:"",notes:[],hasPim:!0},{title:"Se rappeler quand se d\xE9roule l\u2019histoire du film.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Se rappeler o\xF9 se d\xE9roule l\u2019histoire du film.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Se rappeler les actions principales du film.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Se rappeler les personnages principaux du film.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Organiser les informations sous la forme d\u2019un sch\xE9ma narratif qui r\xE9sume l\u2019histoire.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Raconter le r\xE9sum\xE9 du film.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1}],expert:[{title:"Raconter un film vu",i:"Je veux raconter un film que j\u2019ai vu.",p:"Avec l\u2019aide du neurone m\xE9moire, je revois dans ma t\xEAte les images du film. J\u2019\xE9coute la petite voix qui raconte le film.",m:["Je raconte l\u2019histoire du film."],mem:"",notes:[],hasPim:!0}],domain:"Lecture",publics:["Sans niveau pr\xE9cis"],kind:"pim"},{id:"pose-addition-deux-chiffres",source:"Pose_addition_deux_chiffres.txt",title:"Poser une addition",authors:["Gw\xE9na\xEBlle BARATTE Professeur des \xE9coles","R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"CE1",objective:"Apprendre \xE0 poser une addition de deux nombres \xE0 deux chiffres",maximoi:"Mon objectif est de poser et de calculer une addition.",notes:["Outils : gabarit pour la pose de l\u2019addition du Cartable Fantastique. Si le calcul mental est difficile, je m\u2019appuie sur les tables d\u2019addition."],minimoi:[{title:"Poser l\u2019op\xE9ration en alignant les unit\xE9s.",i:"Je veux poser mon op\xE9ration en colonnes.",p:"Je rep\xE8re le chiffre des unit\xE9s de chaque nombre (celui \xE0 droite).",m:["J\u2019\xE9cris les deux nombres en pla\xE7ant les unit\xE9s dans la m\xEAme colonne. Si j\u2019en ai besoin, je peux utiliser le gabarit."],mem:"",notes:[],hasPim:!0},{title:"Additionner la colonne des unit\xE9s.",i:"Je veux additionner les unit\xE9s.",p:"Je regarde les deux chiffres dans la colonne des unit\xE9s.",m:["J\u2019additionne les deux chiffres des unit\xE9s. Je note l\u2019unit\xE9 du r\xE9sultat dans la case en bas de la colonne. Si mon r\xE9sultat est \xE9gal ou sup\xE9rieur \xE0 10, je note le chiffre des dizaines dans le rond des retenues en haut de la colonne des dizaines."],mem:"",notes:[],hasPim:!0},{title:"Additionner la colonne des dizaines.",i:"Je veux additionner les dizaines.",p:"Je regarde les deux ou trois chiffres dans la colonne des dizaines.",m:["J\u2019additionne les chiffres de la colonne des dizaines (sans oublier la retenue). J\u2019\xE9cris le r\xE9sultat dans la case des dizaines voire des centaines si mon r\xE9sultat est \xE9gal ou sup\xE9rieur \xE0 10."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier le r\xE9sultat.",i:"Je veux v\xE9rifier si mon r\xE9sultat est possible.",p:"Je regarde le nombre que j\u2019ai \xE9crit dans le r\xE9sultat.",m:["Je v\xE9rifie que mon r\xE9sultat est plus grand que les deux nombres de d\xE9part et que son ordre de grandeur est possible."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Math\xE9matiques",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"polygones-ou-non",source:"Polygones_ou_non.txt",title:"Polygones ou non ?",authors:["C\xE9lestine GEYER Professeur de CE1","R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"CE1 (g\xE9om\xE9trie)",objective:"D\xE9terminer si les formes g\xE9om\xE9triques sont des polygones ou non.",maximoi:"Mon objectif est de d\xE9terminer si les formes g\xE9om\xE9triques sont des polygones ou non.",notes:["Pr\xE9requis : conna\xEEtre et reconna\xEEtre ligne droite, ligne courbe, ligne bris\xE9e.","D\xE9finition cl\xE9 : un polygone est une figure g\xE9om\xE9trique qui est ferm\xE9e et dont le contour est une ligne bris\xE9e. Version simplifi\xE9e : Ferm\xE9e + Ligne bris\xE9e \u2192 Polygone ; Pas ferm\xE9e ou Pas ligne bris\xE9e \u2192 Non polygone."],minimoi:[{title:"Reconna\xEEtre les figures ferm\xE9es",i:"Je veux reconna\xEEtre les figures ferm\xE9es.",p:"Je regarde si le contour de la figure est bien ferm\xE9.",m:["Je dessine un point de couleur \xE0 l\u2019int\xE9rieur de la figure. Variante : coller une gommette d\u2019une couleur."],mem:"",notes:[],hasPim:!0},{title:"Reconna\xEEtre les figures avec une ligne bris\xE9e",i:"Je veux reconna\xEEtre les figures avec une ligne bris\xE9e.",p:"Je regarde si le contour de la figure est compos\xE9 uniquement d\u2019une ligne bris\xE9e (suite de lignes droites).",m:["Je repasse toutes les lignes droites de la figure. Variante : coller une gommette d\u2019une autre couleur."],mem:"",notes:[],hasPim:!0},{title:"Regrouper les figures qui ont les deux propri\xE9t\xE9s",i:"Je veux regrouper les figures qui ont les deux propri\xE9t\xE9s.",p:"Je regarde les figures qui ont un point jaune et un contour orange. Variante : qui ont les deux gommettes.",m:["Je place la carte des figures qui ont les deux propri\xE9t\xE9s dans la colonne \xAB Polygones \xBB. Les autres figures vont dans la colonne \xAB Non-polygones \xBB."],mem:"",notes:[],hasPim:!0},{title:"M\xE9moriser les deux propri\xE9t\xE9s des polygones",i:"Je veux m\xE9moriser les deux propri\xE9t\xE9s des polygones.",p:"Je regarde les figures qui sont ferm\xE9es et dont le contour est une ligne bris\xE9e.",m:["Je revois et je me redis dans ma t\xEAte les deux propri\xE9t\xE9s des polygones pour les m\xE9moriser avec le neurone m\xE9moire."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Math\xE9matiques",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"orthogonalite-droite-plan",source:"orthogonalite_droite_plan.txt",title:"Orthogonalit\xE9 d\u2019une droite et d\u2019un plan dans l\u2019espace",authors:["Guillaume FERR\xC9 Professeur de math\xE9matiques"],level:"Terminale (sp\xE9cialit\xE9 math\xE9matiques)",objective:"D\xE9montrer qu\u2019une droite et un plan sont orthogonaux dans un cube.",maximoi:"Mon objectif est de d\xE9montrer qu\u2019une droite et un plan sont orthogonaux dans un cube.",notes:["Exercice : on consid\xE8re un cube de c\xF4t\xE9 1 cm. D\xE9montrer que la droite (DF) est orthogonale au plan (ACH). On pourra utiliser un rep\xE8re orthonorm\xE9."],minimoi:[{title:"Observer la figure.",i:"Je veux observer la figure.",p:"Je revois mentalement les configurations classiques du cours.",m:["Je compare mentalement les figures du cours \xE0 la figure donn\xE9e."],mem:"",notes:[],hasPim:!0},{title:"D\xE9terminer la meilleure d\xE9marche \xE0 suivre.",i:"Je veux d\xE9terminer la meilleure d\xE9marche \xE0 suivre pour r\xE9pondre au probl\xE8me.",p:"Je visualise mentalement toutes les configurations possibl liste des valeurs connues par mati\xE8re, tout en gardant en m\xE9moire la masse volumique que j\u2019ai calcul\xE9e.",m:["Je recherche dans la liste des mati\xE8res la valeur la plus proche de celle calcul\xE9e."],mem:"",notes:[],hasPim:!0},{title:"Identifier et nommer la mati\xE8re.",i:"Je veux donner un nom \xE0 la mati\xE8re de l\u2019\xE9chantillon.",p:"Je regarde la ligne de la liste qui correspond \xE0 la valeur la plus proche.",m:["Je lis le nom de la mati\xE8re associ\xE9e \xE0 la valeur de la masse volumique correspondante."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Sciences",publics:["Coll\xE8ge"],kind:"pim"},{id:"lire-voix-haute",source:"Lire_voix_haute.txt",title:"Lire \xE0 voix haute",authors:["Maud LABORDE Enseignante sp\xE9cialis\xE9e","R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"Non pr\xE9cis\xE9",objective:"Lire \xE0 voix haute",maximoi:"Mon objectif est de lire un texte \xE0 voix haute.",notes:[],minimoi:[{title:"Prendre un curseur pour suivre la ligne.",i:"Je veux prendre un curseur pour suivre la ligne.",p:"Je regarde la ligne que je lis.",m:["Je place le curseur sous la ligne pour guider mes yeux."],mem:"",notes:[],hasPim:!0},{title:"Utiliser le curseur pour regarder chaque mot.",i:"Je veux regarder chaque mot avec pr\xE9cision.",p:"Je vois le curseur pointer chaque mot un par un.",m:["Je d\xE9place le curseur pour pointer chaque mot tout en lisant."],mem:"",notes:[],hasPim:!0},{title:"Faire une petite pause \xE0 la virgule.",i:"Je veux respecter la ponctuation.",p:"Je vois une virgule et je m\u2019arr\xEAte un court instant.",m:["Je fais une petite pause pour marquer la respiration indiqu\xE9e par la virgule."],mem:"",notes:[],hasPim:!0},{title:"Faire une grande pause au point pour respirer.",i:"Je veux m\u2019arr\xEAter au point pour respirer.",p:"Je vois un point et je m\u2019arr\xEAte compl\xE8tement.",m:["Je fais une grande pause pour respirer avant de commencer la phrase suivante."],mem:"",notes:[],hasPim:!0},{title:"Mettre l\u2019intonation en s\u2019appuyant sur mon film du texte et la ponctuation (! et ?).",i:"Je veux mettre l\u2019intonation appropri\xE9e.",p:"Je vois les points d\u2019exclamation et d\u2019interrogation, et je repense au sens du texte.",m:["J\u2019utilise ma voix pour exprimer l\u2019\xE9motion ou la question en fonction de la ponctuation et du film mental que je me suis construit."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Lecture",publics:["Sans niveau pr\xE9cis"],kind:"pim"},{id:"lire-pour-comprendre",source:"Lire_pour_comprendre.txt",title:"Lire pour comprendre",authors:["Maud LABORDE Enseignante sp\xE9cialis\xE9e","R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"Non pr\xE9cis\xE9",objective:"Lire pour comprendre",maximoi:"Mon objectif est de lire un texte pour le comprendre.",notes:[],minimoi:[{title:"Prendre un curseur pour suivre la ligne.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Utiliser le curseur pour regarder chaque mot.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Se faire une image pour chaque mot dans la t\xEAte.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1},{title:"Assembler toutes les images en un film dans la t\xEAte.",i:"",p:"",m:[],mem:"",notes:[],hasPim:!1}],expert:[],domain:"Lecture",publics:["Sans niveau pr\xE9cis"],kind:"minimoi"}];var Ve=Nt(qn());var wn={maximoi:"Le maximoi est un but de r\xE9ussite formul\xE9 par l\u2019apprenant (\xAB Mon objectif est de\u2026 \xBB), pas une activit\xE9 (\xAB jouer au jeu \xBB).",minimoi:"Les minimoi sont des \xE9tapes courtes, concr\xE8tes et ordonn\xE9es. On voit sans h\xE9siter comment r\xE9aliser chacune. Seules les \xE9tapes o\xF9 l\u2019apprenant risque d\u2019\xE9chouer ont besoin d\u2019un PIM.",I:"L\u2019Intention commence par \xAB Je veux \xBB suivi d\u2019un but pr\xE9cis.",P:"La Perception d\xE9signe la cible de l\u2019attention : je regarde, j\u2019\xE9coute, je sens, je revois dans ma t\xEAte, je r\xE9entends ma petite voix.",M:"Le Mode d\u2019action (ou Mani\xE8re d\u2019agir) est une seule action, physique ou mentale, que l\u2019apprenant peut d\xE9cider de faire avec la quasi-certitude d\u2019y arriver. Elle sert l\u2019intention.",langue:"Le PIM est \xE9crit avec \xAB je \xBB, dans les mots de l\u2019apprenant. Le vocabulaire th\xE9orique reste dans les objectifs destin\xE9s \xE0 l\u2019adulte."},ho=[{id:"T1",n:1,t:"D\xE9crire le jeu au lieu de d\xE9crire la t\xEAte",why:"Des minimoi d\xE9crivent l\u2019installation ou les r\xE8gles (distribuer, piocher, compter les points). Ces \xE9tapes demandent peu de concentration, alors que l\u2019\xE9tape o\xF9 l\u2019apprenant \xE9choue tient en un seul PIM.",ex:"Minimoi : \xAB Distribuer 5 cartes par joueur \xBB, \xAB Compter les points \xBB, \xAB D\xE9signer le vainqueur \xBB.",fix:"Regrouper l\u2019installation en une \xE9tape (\xAB Je pr\xE9pare la manche \xBB) et donner la place gagn\xE9e aux \xE9tapes d\xE9cisives : \xAB Je r\xE9capitule \xBB, \xAB Je v\xE9rifie avant que la bo\xEEte soit cach\xE9e \xBB.",test:"Si l\u2019apprenant rate cette \xE9tape, rate-t-il la t\xE2che ? Sinon, elle n\u2019a sans doute pas besoin d\u2019un PIM."},{id:"T2",n:2,t:"Un Mode d\u2019action qui contient plusieurs actions",why:"Le Mode d\u2019action encha\xEEne deux, trois ou quatre actions. L\u2019apprenant ne sait plus laquelle faire d\u2019abord et son attention se disperse : c\u2019est une double t\xE2che.",ex:"M : \xAB Je compte les sardines, je m\xE9morise leurs couleurs, j\u2019associe un mot-cl\xE9 \xE0 chacune et je r\xE9p\xE8te. \xBB",fix:"Trois PIM qui s\u2019encha\xEEnent : \xAB Je compte les sardines. \xBB / \xAB Je donne un mot-cl\xE9 \xE0 chaque sardine. \xBB / \xAB Je r\xE9p\xE8te ma liste jusqu\u2019\xE0 ce que la carte soit retourn\xE9e. \xBB",test:"Le Mode d\u2019action contient-il \xAB et \xBB, \xAB puis \xBB, plusieurs verbes ou plusieurs puces ? Si oui, il y a sans doute plusieurs PIM."},{id:"T3",n:3,t:"Une action plac\xE9e dans la Perception",why:"La Perception est une c
