<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliothèque PIM</title>
<meta name="description" content="Bibliothèque de tâches décomposées en Maximoi, minimoi et PIM (Intention, Perception, Manière d’agir) — d’après le programme ATOLE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: calme, outil de travail d’enseignant — sobre, lisible, sans décor.
IDEA: une fenêtre d’application KDE Plasma (Dolphin) : barre de titre, panneau « Emplacements », liste, vue détaillée.
PICTURE: la fiche elle-même — Maximoi en bandeau, minimoi numérotés, PIM codés I/P/M.
COLOUR and TYPE: Breeze (#eff0f1 fenêtre, #fcfcfc vues, bleu sélection #3daee9) ; Breeze Dark la nuit ; Noto Sans.
LAYOUT: 3 volets ≥ 1100px, 2 volets ≥ 760px, un volet à la fois sur téléphone.
*/
:root{color-scheme:light dark;
--win:light-dark(#eff0f1,#2a2e32);--view:light-dark(#fcfcfc,#1b1e20);--alt:light-dark(#f4f5f6,#232629);
--ink:light-dark(#232627,#eff0f1);--mute:light-dark(#6b7478,#a1a9b1);--line:light-dark(#d1d5d9,#3f4448);
--hi:#3daee9;--hi-ink:light-dark(#1d6fa0,#7fcef5);--hi-bg:light-dark(#dff2fc,#1c3a4d);--hi-sel:light-dark(#c5e8fa,#24526d);
--title:light-dark(#dee0e2,#31363b);
--ci:#3daee9;--cp:#27ae60;--cm:#f67400;--cme:#9b59b6;
--ci-bg:light-dark(#e3f4fc,#16303f);--cp-bg:light-dark(#e2f5ea,#16301f);--cm-bg:light-dark(#fdeee0,#3a2410);--cme-bg:light-dark(#f2e8f6,#2c1d33);
--mark:light-dark(#fdf0a8,#6b5b10);--r:4px;--sh:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body,#root{height:100%}
body{margin:0;background:var(--win);color:var(--ink);font:15px/1.5 "Noto Sans","Segoe UI",Ubuntu,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.ico{flex:none;vertical-align:-3px}
.muted{color:var(--mute)}.small{font-size:13px}
kbd{font:12px/1 "Noto Sans Mono",monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:2px 5px;background:var(--view)}

.win{display:flex;flex-direction:column;height:100%}
.titlebar{display:flex;align-items:center;gap:14px;padding:8px 12px;background:var(--title);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:15px}
.brand .sub{color:var(--mute)}
.logo{display:grid;grid-template-columns:repeat(3,6px);gap:2px;align-items:end}
.logo i{display:block;width:6px;border-radius:1px}.logo i:nth-child(1){height:9px;background:var(--ci)}.logo i:nth-child(2){height:14px;background:var(--cp)}.logo i:nth-child(3){height:19px;background:var(--cm)}
.searchbox{flex:1;max-width:680px;margin-inline:auto;display:flex;align-items:center;gap:6px;background:var(--view);border:1px solid var(--line);border-radius:var(--r);padding:0 4px 0 10px;height:36px}
.searchbox:focus-within{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi)}
.searchbox .ico{color:var(--mute)}
.searchbox input{flex:1;border:0;background:none;outline:none;height:100%;font-size:15px}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox select{border:0;border-left:1px solid var(--line);background:none;padding:0 6px;height:26px;color:var(--mute);font-size:13px;max-width:150px}
.clear{border:0;background:none;color:var(--mute);display:grid;place-items:center;width:24px;height:24px;border-radius:50%}
.clear:hover{background:var(--alt)}

.btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--view);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.btn:hover:not(:disabled){border-color:var(--hi)}
.btn.primary{background:var(--hi);border-color:var(--hi);color:#fff}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}.btn.ghost:hover:not(:disabled){background:var(--hi-bg);border-color:transparent}
.btn.icon{padding:0;width:34px;justify-content:center}
.btn.small{min-height:28px;font-size:13px}
.link{border:0;background:none;color:var(--hi-ink);padding:0;font-size:13px}.link:hover{text-decoration:underline}

.panes{flex:1;display:grid;grid-template-columns:230px 330px minmax(0,1fr);min-height:0}
.sidebar{background:var(--win);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 20px}
.sb-title{font-size:12px;color:var(--mute);padding:12px 8px 4px;font-weight:600}
.places{list-style:none;margin:0;padding:0}
.places button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:var(--r);min-height:34px;font-size:14px}
.places button:hover:not(:disabled){background:var(--hi-bg)}
.places button.on{background:var(--hi-sel)}
.places .pl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.places .cnt{font-size:12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px}
.chip{border:1px solid var(--line);background:var(--view);border-radius:14px;padding:3px 11px;font-size:13px;min-height:30px}
.chip:hover{border-color:var(--hi)}.chip.on{background:var(--hi);border-color:var(--hi);color:#fff}

.listpane{background:var(--view);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line);background:var(--alt)}
.tasks{list-style:none;margin:0;padding:4px;overflow:auto;flex:1}
.task{width:100%;display:flex;gap:10px;text-align:left;border:1px solid transparent;background:none;border-radius:var(--r);padding:9px 10px}
.task:hover{background:var(--hi-bg)}
.task.on{background:var(--hi-sel);border-color:var(--hi)}
.t-ico{color:var(--mute);padding-top:1px}.task.on .t-ico{color:var(--hi-ink)}
.t-main{display:flex;flex-direction:column;gap:2px;flex:1}
.t-title{font-weight:600;line-height:1.3}
.t-meta{font-size:12.5px;color:var(--mute)}
.snip{font-size:13px;line-height:1.4;margin-top:3px;display:block}
.ftag{display:inline-block;font-size:11px;font-weight:700;border-radius:3px;padding:0 5px;margin-right:6px;color:#fff;background:var(--mute)}
.ftag.f-i{background:var(--ci)}.ftag.f-p{background:var(--cp)}.ftag.f-m{background:var(--cm)}.ftag.f-mem{background:var(--cme)}
.more{font-size:12px;color:var(--mute)}
.empty{padding:28px 18px;text-align:center}

.detailpane{overflow:auto;background:var(--win);min-height:0}
.detail{max-width:860px;margin:0 auto;padding:18px clamp(16px,3vw,36px) 40px}
.detail-top{display:flex;align-items:center;gap:8px;min-height:34px}
.crumb{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;flex:1}
.actions{display:flex;gap:2px}
.back{display:none}
.detail h2{font-size:clamp(24px,2.6vw,32px);line-height:1.15;margin:8px 0 8px;font-weight:600;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--mute)}
.pill{background:var(--view);border:1px solid var(--line);border-radius:12px;padding:1px 10px;color:var(--ink)}

.maximoi{margin:18px 0 12px;background:var(--view);border:1px solid var(--line);border-left:4px solid var(--hi);border-radius:var(--r);padding:12px 16px;box-shadow:var(--sh)}
.maximoi-tag{font-size:12px;font-weight:700;color:var(--hi-ink)}
.maximoi p{margin:2px 0 0;font-size:18px;line-height:1.4}
.maximoi .obj{font-size:14px;color:var(--mute);margin-top:6px}.obj span{font-weight:600}

.notes{margin:10px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--alt)}
.notes summary{cursor:pointer;padding:7px 12px;display:flex;align-items:center;gap:8px;font-size:14px;list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes[open] summary{border-bottom:1px solid var(--line)}
.notes-body{padding:6px 14px 10px;font-size:14px}.notes-body p{margin:4px 0}

.viewbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--view)}
.seg button{border:0;background:none;padding:5px 16px;min-height:32px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--hi);color:#fff}

.minis{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mini{background:var(--view);border:1px solid var(--line);border-radius:var(--r)}
.mini.hit{border-color:var(--hi)}
.mini.expert{border-style:dashed}
.mini-head{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:9px 12px;min-height:44px}
.mini-head:disabled{opacity:1;cursor:default}
.mini-head:hover:not(:disabled){background:var(--hi-bg)}
.num{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--alt);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute)}
.mini.open .num{background:var(--hi);border-color:var(--hi);color:#fff}
.mini-title{flex:1;font-weight:500}
.kicker{color:var(--mute);font-weight:400}
.chev{color:var(--mute);transition:transform .15s}.mini.open .chev{transform:rotate(180deg)}
.mini-body{padding:2px 12px 12px 50px}

.pim{display:flex;flex-direction:column;gap:6px}
.pim-row{display:grid;grid-template-columns:150px minmax(0,1fr);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.pim-tag{display:flex;align-items:center;gap:7px;padding:7px 10px;font-size:13px;font-weight:700}
.pim-text{padding:7px 12px;background:var(--view)}
.pim-text ul{margin:0;padding-left:18px}
.f-i .pim-tag{background:var(--ci-bg);color:var(--hi-ink)}.f-i .pim-tag .ico{color:var(--ci)}
.f-p .pim-tag{background:var(--cp-bg);color:light-dark(#1c7a43,#6fd39a)}.f-p .pim-tag .ico{color:var(--cp)}
.f-m .pim-tag{background:var(--cm-bg);color:light-dark(#a54e00,#ffad66)}.f-m .pim-tag .ico{color:var(--cm)}
.f-mem .pim-tag{background:var(--cme-bg);color:light-dark(#71388a,#cf9ee3)}.f-mem .pim-tag .ico{color:var(--cme)}
.pim-row.f-i{border-left:3px solid var(--ci)}.pim-row.f-p{border-left:3px solid var(--cp)}.pim-row.f-m{border-left:3px solid var(--cm)}.pim-row.f-mem{border-left:3px solid var(--cme)}

.stepview{display:flex;flex-direction:column;gap:12px}
.progress{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--view);font-size:13px;font-weight:700;color:var(--mute)}
.dot.done{background:var(--hi-bg);color:var(--hi-ink);border-color:var(--hi-bg)}
.dot.on{background:var(--hi);border-color:var(--hi);color:#fff}
.stepcard{background:var(--view);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);animation:in .18s ease-out}
@keyframes in{from{opacity:.3;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.stepcard{animation:none}.chev{transition:none}}
.step-label{font-size:12px;font-weight:700;color:var(--mute)}
.stepcard h3{font-size:20px;line-height:1.3;margin:4px 0 14px;font-weight:600}
.stepnav{display:flex;justify-content:space-between;align-items:center;gap:8px}

.credits{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}

.overlay{position:fixed;inset:0;background:rgba(20,22,24,.45);display:grid;place-items:center;padding:16px;z-index:10}
.dialog{background:var(--view);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column}
.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;background:var(--title);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}
.dialog-head h2{font-size:16px;margin:0;font-weight:600}
.dialog-body{overflow:auto;padding:6px 20px 18px;font-size:14.5px}
.dialog-body h3{font-size:15px;margin:16px 0 6px}
.dialog-body ul{padding-left:18px;margin:0}.dialog-body li{margin:4px 0}
.dialog-body a{color:var(--hi-ink)}
.legend{display:flex;flex-direction:column;gap:6px}
.legend>div{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:var(--r)}
.legend .f-i{background:var(--ci-bg)}.legend .f-p{background:var(--cp-bg)}.legend .f-m{background:var(--cm-bg)}
.legend .f-i .ico{color:var(--ci)}.legend .f-p .ico{color:var(--cp)}.legend .f-m .ico{color:var(--cm)}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:#31363b;color:#eff0f1;padding:8px 16px;border-radius:var(--r);font-size:14px;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
 .panes{grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 .sidebar{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line);padding:4px 8px 8px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;overflow:visible}
 .sb-title{padding:4px 0}
 .places{display:flex;gap:4px;overflow-x:auto;width:100%;padding-bottom:2px}
 .places li{flex:none}.places button{width:auto;white-space:nowrap}
 .chips{padding:0}
}
@media (max-width:760px){
 body{font-size:16px}
 .brand .sub,.searchbox select{display:none}
 .titlebar{gap:8px;padding:6px 8px}
 .brand b{font-size:14px}
 .panes{grid-template-columns:minmax(0,1fr)}
 .sidebar .sb-title{display:none}
 .mv-detail .sidebar,.mv-detail .listpane{display:none}
 .mv-list .detailpane{display:none}
 .back{display:inline-flex}
 .actions .lbl{display:none}
 .pim-row{grid-template-columns:minmax(0,1fr)}
 .pim-tag{padding:5px 10px}
 .mini-body{padding-left:12px}
 .maximoi p{font-size:17px}
}
@media print{
 body{overflow:visible;background:#fff;color:#000}
 .titlebar,.sidebar,.listpane,.detail-top,.viewbar,.toast{display:none!important}
 .panes{display:block}.detailpane{overflow:visible}
 .mini-body{display:block}
}

/* ---------- Onglets de vue ---------- */
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--view);flex:none}
.tabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0 12px;height:34px;font-size:14px}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button:hover:not(.on){background:var(--hi-bg)}
.tabs button.on{background:var(--hi);color:#fff}
.tb-spacer{flex:1}

/* ---------- Trame vide ---------- */
.trameview{flex:1;overflow:auto;min-height:0;scroll-padding-top:12px}
.trame-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;max-width:1180px;margin:0 auto;align-items:start}
.trame-aside{position:sticky;top:0;padding:10px 8px 20px;display:flex;flex-direction:column;gap:8px}
.tsteps{list-style:none;margin:0;padding:0}
.tsteps button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:var(--r);min-height:36px;font-size:14px}
.tsteps button:hover{background:var(--hi-bg)}
.snum{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--view);font-size:12px;font-weight:700;color:var(--mute)}
.tsteps .ok .snum{background:var(--cp);border-color:var(--cp);color:#fff}
.aside-stat{padding:0 8px}
.trame-aside .btn{margin:0 8px;justify-content:center}
.trame{padding:16px clamp(16px,3vw,36px) 48px;display:flex;flex-direction:column;gap:14px}
.trame-intro h2{font-size:clamp(24px,2.6vw,30px);line-height:1.15;margin:4px 0 6px;font-weight:600}
.trame-intro p{margin:0;max-width:70ch}
.srcnote{margin-top:6px!important;color:var(--hi-ink)}
.frame{background:var(--view);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.frame-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--alt);border-radius:var(--r) var(--r) 0 0;flex-wrap:wrap}
.frame-head h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.fnum{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--hi);color:#fff;font-size:13px}
.frame-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field-lab{font-size:13px;font-weight:600;color:var(--mute)}
.field textarea,.inp{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--view);padding:7px 10px;font-size:15px;line-height:1.45;resize:vertical}
.field textarea:focus,.inp:focus{outline:none;border-color:var(--hi);box-shadow:0 0 0 1px var(--hi)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ideas{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.maxfield .field{border-left:4px solid var(--hi);padding-left:10px}
.editlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.editlist li{display:flex;align-items:center;gap:8px}
.editlist .inp{flex:1;min-height:38px}
.sw{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;cursor:pointer}
.sw input{width:16px;height:16px;accent-color:var(--hi)}
.ob{display:inline-flex;gap:2px}
.ibtn{display:grid;place-items:center;width:32px;height:32px;border:1px solid transparent;background:none;border-radius:var(--r);color:var(--mute)}
.ibtn:hover:not(:disabled){background:var(--hi-bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}
.pims{gap:12px}
.pimcard{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--alt)}
.pimcard-head{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:8px}
.pim.edit{gap:8px}
.pim.edit .field{border-left:3px solid var(--line);padding-left:10px}
.pim.edit .f-i{border-color:var(--ci)}.pim.edit .f-p{border-color:var(--cp)}.pim.edit .f-m{border-color:var(--cm)}
.pim.edit .f-i .field-lab{color:var(--hi-ink)}.pim.edit .f-p .field-lab{color:light-dark(#1c7a43,#6fd39a)}.pim.edit .f-m .field-lab{color:light-dark(#a54e00,#ffad66)}
.lint{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.lint li{display:flex;gap:8px;align-items:baseline}
.lchip{flex:none;font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;background:light-dark(#fdeee0,#3a2410);color:light-dark(#a54e00,#ffad66)}
.checklist{margin:0;padding-left:20px}.checklist li{margin:2px 0}
.copybox{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--alt);display:flex;flex-direction:column;gap:10px}
.copybox.ready{border-color:var(--hi);background:var(--hi-bg)}
.copy-head{display:flex;flex-direction:column;gap:10px}
.copy-head p{margin:4px 0 0;max-width:75ch}
.warnline{display:flex;gap:6px;align-items:center;color:light-dark(#a54e00,#ffad66)}
.msg{margin:0;padding:8px 12px;border-radius:var(--r);font-size:14px;display:flex;gap:8px;align-items:center}
.msg.good{background:var(--cp-bg);color:light-dark(#1c7a43,#6fd39a)}
.msg.warn{background:var(--cm-bg)}
.seedask{justify-content:space-between;flex-wrap:wrap}
.prompt{width:100%;min-height:260px;border:1px solid var(--line);border-radius:var(--r);background:var(--view);padding:10px;font:13px/1.45 "Noto Sans Mono",ui-monospace,monospace;resize:vertical}
.btn.danger{background:#da4453;border-color:#da4453;color:#fff}
.aide summary{font-weight:500}
.traps{margin:6px 0 0;padding-left:20px}.traps li{margin:4px 0}
@media (max-width:900px){
 .trame-wrap{grid-template-columns:minmax(0,1fr)}
 .trame-aside{position:sticky;top:0;z-index:2;background:var(--win);border-bottom:1px solid var(--line);flex-direction:row;align-items:center;padding:6px 8px;overflow-x:auto}
 .trame-aside .sb-title,.aside-stat{display:none}
 .tsteps{display:flex;gap:2px}.tsteps button{white-space:nowrap;font-size:13px}
 .trame-aside .btn{flex:none;margin:0}
 .grid3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
 .tabs span{display:none}.tabs button{padding:0 10px}
 .v-lib .brand>span:not(.logo){display:none}
 .editlist li{flex-wrap:wrap}.editlist .inp{flex-basis:calc(100% - 40px)}
 .editlist .sw{margin-left:36px}
}
@media print{.v-trame .trame-aside,.v-trame .copybox,.v-trame .row,.v-trame .aide{display:none!important}.trameview{overflow:visible}}
@media (max-width:900px){.tsteps li{flex:none}.trame-aside{justify-content:space-between}}
@media (max-width:760px){.tsteps .sl{display:none}.tsteps button{padding:6px 4px;min-height:40px}}
.trame-aside .short{display:none}
@media (max-width:760px){.trame-aside .short{display:inline}.trame-aside .long{display:none}.tsteps{gap:0}}

egarde le mat\xE9riel sur la table devant moi.",m:["Je prends le mat\xE9riel sur la table : le pot de p\xE2te \xE0 modeler, le tapis et l\u2019assiette."],mem:"",notes:[],hasPim:!0},{title:"Installer le tapis sur la table",i:"J\u2019installe le tapis sur la table.",p:"Je regarde le tapis et la table.",m:["Je pose le tapis sur la table devant moi."],mem:"",notes:[],hasPim:!0},{title:"Poser l\u2019assiette",i:"Je veux poser l\u2019assiette.",p:"Je regarde la table et l\u2019assiette.",m:["Je pose l\u2019assiette au bout de la table devant moi (comme \xE7a, je ne suis pas g\xEAn\xE9 pour faire rouler la p\xE2te)."],mem:"",notes:[],hasPim:!0},{title:"Sortir la p\xE2te du pot",i:"Je veux sortir la p\xE2te du pot.",p:"Je regarde le pot de p\xE2te \xE0 modeler et le couvercle.",m:["J\u2019enl\xE8ve le couvercle et je sors la p\xE2te du pot."],mem:"",notes:[],hasPim:!0},{title:"Prendre une petite boule de p\xE2te",i:"Je veux prendre une petite boule de p\xE2te.",p:"Je regarde le morceau de p\xE2te \xE0 modeler.",m:["Je prends une petite boule dans le morceau de p\xE2te \xE0 modeler."],mem:"",notes:[],hasPim:!0},{title:"Rouler la boule de p\xE2te pour faire un spaghetti",i:"Je veux rouler la boule de p\xE2te pour faire un spaghetti.",p:"Je regarde la petite boule de p\xE2te et je ressens la sensation de la boule sous ma main. Je ressens et je vois la boule qui s\u2019allonge pour prendre la forme d\u2019un spaghetti.",m:["Je pose la boule sur le tapis. Je pose ma main au-dessus. J\u2019avance et je recule la main en appuyant pour faire rouler la boule sous ma main."],mem:"",notes:[],hasPim:!0},{title:"Arr\xEAter de rouler la p\xE2te",i:"Je veux arr\xEAter de rouler la p\xE2te.",p:"Je sens et je vois que le spaghetti est suffisamment fin.",m:["J\u2019arr\xEAte de rouler la p\xE2te \xE0 modeler sous ma main."],mem:"",notes:[],hasPim:!0},{title:"Poser le spaghetti dans l\u2019assiette",i:"Je veux poser le spaghetti dans l\u2019assiette.",p:"Je regarde le spaghetti et l\u2019assiette.",m:["Je prends doucement le spaghetti pour le poser dans l\u2019assiette."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Motricit\xE9",publics:["Maternelle"],kind:"pim"},{id:"faire-achat-autonomie",source:"Faire_achat_autonomie.txt",title:"Faire un achat en autonomie",authors:["Johanna CHENE Psychologue"],level:"Adolescents et jeunes adultes avec un trouble du spectre de l\u2019autisme et une d\xE9ficience intellectuelle l\xE9g\xE8re",objective:"R\xE9aliser un achat en autonomie en utilisant un sc\xE9nario social. Renforcer les comp\xE9tences d\u2019autonomie dans la vie quotidienne et d\u2019habilet\xE9s sociales.",maximoi:"Mon objectif est de faire un achat en autonomie.",notes:[],minimoi:[{title:"Je mets mon manteau pour sortir.",i:"Mettre son manteau pour sortir.",p:"Balayer visuellement la pi\xE8ce pour trouver le manteau.",m:["Prendre le manteau, l\u2019enfiler."],mem:"Se souvenir o\xF9 est le manteau.",notes:[],hasPim:!0},{title:"Je vais \xE0 la boulangerie \xE0 pied.",i:"Aller \xE0 la boulangerie \xE0 pied.",p:"Visualiser mentalement le chemin ou se r\xE9p\xE9ter les \xE9tapes.",m:["Marcher jusqu\u2019\xE0 la boulangerie en suivant le chemin visualis\xE9."],mem:"Se souvenir du chemin.",notes:[],hasPim:!0},{title:"Je choisis une p\xE2tisserie.",i:"Choisir une p\xE2tisserie.",p:"Regarder les p\xE2tisseries disponibles dans la vitrine.",m:["Choisir celle qui fait envie, m\xE9moriser le choix."],mem:"",notes:[],hasPim:!0},{title:"Je fais ma demande \xE0 la boulang\xE8re.",i:"Demander la p\xE2tisserie \xE0 la boulang\xE8re.",p:"V\xE9rifier si c\u2019est son tour.",m:["Faire la demande en suivant les \xE9tapes du sc\xE9nario social."],mem:"Se souvenir du sc\xE9nario social pour faire une demande.",notes:[],hasPim:!0},{title:"Je paye ma p\xE2tisserie.",i:"Payer la p\xE2tisserie.",p:"\xC9couter le montant ou le visualiser sur l\u2019affichage, chercher dans le porte-monnaie.",m:["Donner l\u2019argent \xE0 la boulang\xE8re."],mem:"",notes:[],hasPim:!0},{title:"Je rentre \xE0 la maison \xE0 pied.",i:"Rentrer \xE0 la maison \xE0 pied.",p:"Visualiser mentalement le chemin \xE0 emprunter.",m:["Marcher jusqu\u2019\xE0 la maison en suivant le chemin visualis\xE9."],mem:"Se souvenir du chemin.",notes:[],hasPim:!0}],expert:[],domain:"Vie quotidienne",publics:["Ados & adultes"],kind:"pim"},{id:"dissertation-litterature",source:"dissertation_litterature.txt",title:"\xC9crire une dissertation litt\xE9raire",authors:["PIMentor (d\xE9composition g\xE9n\xE9r\xE9e par l\u2019assistant)"],level:"Lyc\xE9e",objective:"\xC9crire une dissertation litt\xE9raire structur\xE9e et argument\xE9e, r\xE9pondant \xE0 une probl\xE9matique.",maximoi:"Mon objectif est d\u2019\xE9crire une dissertation litt\xE9raire structur\xE9e et argument\xE9e, r\xE9pondant \xE0 une probl\xE9matique.",notes:[],minimoi:[{title:"PIM1 : Analyser le sujet",i:"Comprendre pr\xE9cis\xE9ment la question pos\xE9e.",p:"Observer les mots-cl\xE9s et les concepts du sujet.",m:["Souligner les mots-cl\xE9s, les reformuler dans mes propres mots, et identifier les axes implicites ou explicites du sujet."],mem:"",notes:[],hasPim:!0},{title:"PIM2 : Construire une probl\xE9matique",i:"Trouver une question centrale qui structure ma r\xE9flexion.",p:"Relire les mots-cl\xE9s du sujet et observer les tensions ou d\xE9bats qu\u2019ils sugg\xE8rent.",m:["Formuler une question ouverte qui r\xE9sume les enjeux principaux du sujet."],mem:"",notes:[],hasPim:!0},{title:"PIM3 : \xC9laborer un plan d\xE9taill\xE9",i:"Organiser mes id\xE9es de mani\xE8re coh\xE9rente et logique.",p:"Imaginer les trois grandes parties r\xE9pondant \xE0 ma probl\xE9matique.",m:["Lister des arguments pour chaque partie et les associer \xE0 des exemples concrets issus du texte ou du corpus \xE9tudi\xE9."],mem:"",notes:[],hasPim:!0},{title:"PIM4 : R\xE9diger une introduction",i:"Introduire clairement le sujet et poser la probl\xE9matique.",p:"Relire la question et le plan pour identifier les informations essentielles.",m:["\xC9crire un paragraphe en trois \xE9tapes : amorce, pr\xE9sentation du sujet, annonce du plan."],mem:"",notes:[],hasPim:!0},{title:"PIM5.1 : R\xE9diger les parties du d\xE9veloppement \u2013 r\xE9diger une sous-partie",i:"D\xE9velopper une id\xE9e principale de mani\xE8re structur\xE9e.",p:"Relire l\u2019argument principal de cette partie et ses exemples associ\xE9s.",m:["\xC9crire un paragraphe avec un argument, une explication et un exemple (citation ou r\xE9f\xE9rence textuelle)."],mem:"",notes:[],hasPim:!0},{title:"PIM5.2 : R\xE9diger les parties du d\xE9veloppement \u2013 connecter les sous-parties",i:"Assurer une transition fluide entre les id\xE9es.",p:"Observer les liens logiques entre les arguments.",m:["R\xE9diger une phrase de transition \xE0 la fin de chaque sous-partie."],mem:"",notes:[],hasPim:!0},{title:"PIM6 : R\xE9diger une conclusion",i:"R\xE9sumer les id\xE9es principales et r\xE9pondre \xE0 la probl\xE9matique.",p:"Relire la probl\xE9matique et les points-cl\xE9s de chaque partie.",m:["R\xE9diger une conclusion en trois \xE9tapes : synth\xE8se des id\xE9es, r\xE9ponse \xE0 la probl\xE9matique, ouverture (si n\xE9cessaire)."],mem:"",notes:[],hasPim:!0},{title:"PIM7 : Relire et corriger",i:"Am\xE9liorer la clart\xE9 et l\u2019exactitude du texte.",p:"Relire chaque phrase en cherchant les fautes ou les incoh\xE9rences.",m:["V\xE9rifier l\u2019orthographe, la syntaxe, et les accords ; ajuster les formulations pour plus de clart\xE9."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"\xC9criture & langue",publics:["Lyc\xE9e"],kind:"pim"},{id:"dictee-de-syllabes",source:"Dict\xE9e_de_syllabes.txt",title:"La dict\xE9e de syllabes",authors:["Luba MARTIN Professeur des \xE9coles","R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"CP",objective:"Transcrire des syllabes dict\xE9es",maximoi:"Mon objectif est d\u2019\xE9crire les syllabes dict\xE9es.",notes:[],minimoi:[{title:"Reconna\xEEtre les sons de la syllabe",i:"Je reconnais les sons de la syllabe.",p:"J\u2019\xE9coute la syllabe.",m:["Je r\xE9p\xE8te la syllabe lentement dans ma t\xEAte (avec la petite voix) pour reconna\xEEtre chaque son."],mem:"",notes:[],hasPim:!0},{title:"Associer les sons aux lettres",i:"J\u2019associe chaque son aux lettres.",p:"J\u2019\xE9coute \xE0 nouveau dans ma t\xEAte les sons de la syllabe.",m:["Pour chaque son, je trouve la ou les bonnes lettres."],mem:"",notes:[],hasPim:!0},{title:"Se rappeler le trac\xE9 des lettres de la syllabe",i:"Je me rappelle du trac\xE9 des lettres qui correspondent aux sons de la syllabe.",p:"J\u2019\xE9coute \xE0 nouveau les sons de la syllabe et je vois l\u2019image dans ma t\xEAte des lettres de la syllabe.",m:["Je me rappelle des gestes pour tracer les lettres de la syllabe."],mem:"",notes:[],hasPim:!0},{title:"\xC9crire les lettres de la syllabe",i:"J\u2019\xE9cris les lettres qui correspondent aux sons de la syllabe.",p:"J\u2019\xE9coute \xE0 nouveau les sons de la syllabe et je vois l\u2019image dans ma t\xEAte des lettres et de leur trac\xE9.",m:["J\u2019\xE9cris les lettres de la syllabe en suivant l\u2019ordre des sons."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier la syllabe \xE9crite",i:"Je veux v\xE9rifier que la syllabe \xE9crite correspond bien \xE0 la syllabe entendue.",p:"Je lis la syllabe que j\u2019ai \xE9crite en pronon\xE7ant chaque lettre.",m:["Je compare les sons de la syllabe \xE9crite avec les sons de la syllabe dict\xE9e par la ma\xEEtresse."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"\xC9criture & langue",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"dictee",source:"Dict\xE9e.txt",title:"La dict\xE9e",authors:["H\xE9l\xE8ne QUOIRIN Professeur de CM2","R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"CM2",objective:"Transcrire un message oral en un message \xE9crit. \xC9crire un texte qui est dict\xE9 en respectant les r\xE8gles d\u2019orthographe, de ponctuation et de conjugaison.",maximoi:"Mon objectif est d\u2019\xE9crire en respectant les r\xE8gles.",notes:[],minimoi:[{title:"Coupeur de mots",i:"Je veux s\xE9parer les mots.",p:"J\u2019\xE9coute la phrase. Avec le neurone m\xE9moire, je recherche les mots qui ont du sens.",m:["J\u2019\xE9cris les mots avec un espace entre eux."],mem:"",notes:[],hasPim:!0},{title:"Ponctuation Majuscules",i:"Je veux \xE9crire les signes de ponctuation et les majuscules.",p:"J\u2019entends le nom d\u2019un signe de ponctuation et je l\u2019associe \xE0 l\u2019image mentale correspondante. Je rep\xE8re les points. Quand j\u2019entends un nom, je demande au neurone m\xE9moire si c\u2019est un nom propre.",m:["J\u2019\xE9cris le signe de ponctuation correspondant. Apr\xE8s les points, je mets une majuscule. J\u2019\xE9cris en majuscules les initiales des noms propres."],mem:"",notes:[],hasPim:!0},{title:"Codage des sons en lettres",i:"J\u2019\xE9cris les lettres qui correspondent aux sons entendus.",p:"Je d\xE9compose le mot en diff\xE9rents sons. Si besoin, le neurone m\xE9moire m\u2019aide \xE0 retrouver la photographie du mot ou l\u2019homophone.",m:["Avec l\u2019aide du neurone m\xE9moire, j\u2019associe pour chaque son la ou les bonnes lettres. J\u2019\xE9cris les lettres du son ou de la photographie du mot."],mem:"",notes:[],hasPim:!0},{title:"Homophones (lexicaux ou grammaticaux)",i:"Je reconnais les homophones lexicaux ou grammaticaux pour pouvoir bien les \xE9crire.",p:"Quand je lis ou j\u2019entends un mot, je me demande s\u2019il existe un homophone lexical ou grammatical et je fais appel aux strat\xE9gies du neurone m\xE9moire pour trouver le bon homophone.",m:["Je recherche les diff\xE9rents mots qui peuvent avoir des homophones et j\u2019utilise les strat\xE9gies m\xE9moris\xE9es pour \xE9crire le bon homophone."],mem:"",notes:[],hasPim:!0},{title:"Photographie des mots/Orthographe",i:"Je respecte l\u2019orthographe lexicale des mots que j\u2019ai m\xE9moris\xE9s.",p:"J\u2019associe le mot entendu aux mots que j\u2019ai photographi\xE9s. Avec l\u2019aide du neurone m\xE9moire, je retrouve les lettres du mot.",m:["Je vais chercher l\u2019orthographe du mot dans ma m\xE9moire et j\u2019\xE9cris les lettres correspondantes."],mem:"",notes:[],hasPim:!0},{title:"Accord du groupe nominal",i:"Je respecte les r\xE8gles d\u2019accord dans le groupe nominal.",p:"Je recherche \xE0 l\u2019oral et \xE0 l\u2019\xE9crit le groupe de mots qui contient un nom.",m:["Je d\xE9termine le genre et le nombre du groupe nominal afin de marquer l\u2019accord en genre et en nombre du d\xE9terminant, du nom et des adjectifs."],mem:"",notes:[],hasPim:!0},{title:"Conjugaison (rechercher le verbe et son sujet)",i:"Je conjugue le verbe de la phrase avec son sujet.",p:"Je m\u2019appuie sur le sens de la phrase et sur mes connaissances pour rechercher un verbe d\u2019action ou un verbe d\u2019\xE9tat.",m:["Je recherche le sujet du verbe, son pronom et le temps. Avec le neurone m\xE9moire, je choisis la bonne terminaison."],mem:"",notes:[],hasPim:!0},{title:"Verbes en \xAB \xE9 \xBB ou \xAB er \xBB",i:"Je distingue participe pass\xE9 et infinitif.",p:"J\u2019entends un verbe qui se termine par le son [\xE9], je le remplace par prendre ou pris pour savoir s\u2019il s\u2019agit d\u2019un infinitif ou d\u2019un participe pass\xE9.",m:["Si je peux remplacer par prendre, j\u2019\xE9cris \xAB er \xBB. Si je peux remplacer par pris, j\u2019\xE9cris \xAB \xE9 \xBB et je cherche s\u2019il s\u2019accorde."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"\xC9criture & langue",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"decouper-sur-la-ligne",source:"Decouper_sur_la_ligne.txt",title:"D\xE9couper sur la ligne",authors:["Sandra SEUTIN Psychomotricienne"],level:"\xE0 partir de 6 ans",objective:"D\xE9couper sur la ligne",maximoi:"Mon objectif est de d\xE9couper sur la ligne.",notes:[],minimoi:[{title:"Placer les doigts dans les ciseaux.",i:"Je veux placer mes doigts correctement dans les ciseaux.",p:"Avec l\u2019aide du neurone m\xE9moire, je me souviens de la position montr\xE9e pour placer les doigts.",m:["J\u2019oriente les ciseaux dans un plan vertical. Je place le pouce dans la loupe du haut, le majeur dans la loupe du bas et l\u2019index sur la loupe du bas."],mem:"",notes:[],hasPim:!0},{title:"Tenir la feuille avec l\u2019autre main",i:"Je veux tenir la feuille avec l\u2019autre main.",p:"Avec l\u2018aide du neurone m\xE9moire, je me souviens comment placer la main de soutien (celle qui ne d\xE9coupe pas).",m:["Je place ma main sur le c\xF4t\xE9 de la feuille. Le pouce est sur la feuille, les autres doigts derri\xE8re. Ma main est dans l\u2019axe de l\u2019avant-bras."],mem:"",notes:[],hasPim:!0},{title:"Placer les ciseaux sur la ligne.",i:"Je veux placer les ciseaux sur la ligne \xE0 d\xE9couper.",p:"Je regarde la ligne sur laquelle je dois d\xE9couper.",m:["J\u2019ouvre les ciseaux et je place l\u2019int\xE9rieur des ciseaux sur le d\xE9but de la ligne."],mem:"",notes:[],hasPim:!0},{title:"D\xE9couper sur la ligne.",i:"Je veux d\xE9couper en suivant la ligne.",p:"Avec l\u2019aide du neurone m\xE9moire, je me souviens comment utiliser les ciseaux pour d\xE9couper.",m:["J\u2019ouvre et je ferme les ciseaux en avan\xE7ant la main et en suivant la ligne."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Motricit\xE9",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"conjuguer-au-futur",source:"Conjuguer_au_futur.txt",title:"Pouvoir conjuguer les verbes au futur",authors:["R\xE9mi SAMIER & Sylvie JACQUES orthophonistes","Contributeur anonyme"],level:"CE1",objective:"Pouvoir conjuguer les verbes au futur",maximoi:"Mon objectif est de me souvenir de la conjugaison du futur.",notes:['Je me souviens que le futur se construit avec l\u2019infinitif du verbe (ex : manger) donc avec le "r".','Apr\xE8s le "r", je rajoute les terminaisons : ai, as, a, ons, ez, ont.','Avec JE : "ai" ne prend jamais de "S".','Avec NOUS : "ons" et NOUS prennent toujours un "S".','Avec ILS et ELLES : j\u2019\xE9cris "ont".','Certains verbes doublent le "r". Pour les rep\xE9rer, je me redis la phrase "rr".',"Version adapt\xE9e aux difficult\xE9s sp\xE9cifiques d\u2019un enfant."],minimoi:[{title:"Se souvenir de la conjugaison du futur",i:"Je veux me souvenir de la conjugaison du futur.",p:"Avec l\u2019aide du neurone m\xE9moire, je me souviens que le futur se construit avec l\u2019infinitif du verbe.",m:['Je me redis que le futur fait toujours "r".'],mem:"",notes:[],hasPim:!0},{title:'\xC9crire la bonne terminaison apr\xE8s le "r"',i:'Je veux \xE9crire la bonne terminaison apr\xE8s le "r".',p:"Avec l\u2018aide du neurone m\xE9moire, je me redis la chanson du futur : ai, as, a, ons, ez, ont.",m:['J\u2019attrape dans la chanson la terminaison qui va avec le pronom et je l\u2019\xE9cris. Si besoin est, je me dis le pronom et le verbe dans une phrase qui commence par "demain".'],mem:"",notes:[],hasPim:!0},{title:'Rep\xE9rer les verbes qui doublent le "r"',i:'Je veux rep\xE9rer si le verbe que j\u2019\xE9cris doit doubler son "r".',p:'Avec l\u2019aide du neurone m\xE9moire, je me souviens de la phrase "rr".',m:['Si le verbe que je dois conjuguer est dans cette phrase, je double le "r".'],mem:"",notes:[],hasPim:!0}],expert:[],domain:"\xC9criture & langue",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"comprendre-un-graphique",source:"Comprendre_un_graphique.txt",title:"Comprendre un graphique",authors:["Catherine Bootz Professeur des \xE9coles en CM2","R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"CM2",objective:"Comprendre un graphique.",maximoi:"Mon objectif est de comprendre un graphique.",notes:["Ce qu\u2019il faut retenir de l\u2019analyse d\u2019un graphique : 1) Un graphique permet de faire un lien entre deux types d\u2019information. 2) Il permet de comprendre les informations fournies par un tableau. 3) La repr\xE9sentation graphique permet de voir rapidement l\u2019\xE9volution de la courbe."],minimoi:[{title:"Je rep\xE8re le titre du graphique.",i:"Je veux rep\xE9rer le titre du graphique.",p:"Je lis le texte au dessus et/ou en dessous du graphique.",m:["J\u2019identifie le titre du graphique pour comprendre ce qu\u2019il raconte."],mem:"",notes:[],hasPim:!0},{title:"J\u2019identifie les informations de l\u2019axe horizontal.",i:"J\u2019identifie les informations de l\u2019axe horizontal.",p:"J\u2019observe les informations de l\u2019axe horizontal.",m:["J\u2019identifie le type d\u2019informations repr\xE9sent\xE9 par l\u2019axe horizontal. Est-ce que ce sont des nombres ? Des mois ? Des ann\xE9es ? Des noms de personnes ?"],mem:"",notes:[],hasPim:!0},{title:"J\u2019identifie les informations de l\u2019axe vertical.",i:"J\u2019identifie les informations de l\u2019axe vertical.",p:"J\u2019observe les informations de l\u2019axe vertical.",m:["J\u2019identifie le type d\u2019informations repr\xE9sent\xE9 par l\u2019axe vertical. Ce sont des nombres de quoi ?"],mem:"",notes:[],hasPim:!0},{title:"Je comprends le lien entre les informations.",i:"Je comprends le lien entre les informations.",p:"J\u2019observe les diff\xE9rents points de la courbe.",m:["Pour chaque point, je me raconte le lien entre l\u2019information de l\u2019axe horizontal et l\u2019information de l\u2019axe vertical."],mem:"",notes:[],hasPim:!0},{title:"J\u2019analyse les \xE9volutions de la courbe.",i:"J\u2019analyse les \xE9volutions de la courbe.",p:"J\u2019observe si la courbe monte, descend ou reste horizontale.",m:["Je me dis une de ces trois phrases : Si la courbe monte, on parle d\u2019une augmentation. Si la courbe descend, on parle d\u2019une diminution. Si la courbe reste horizontale, on parle d\u2019une stagnation."],mem:"",notes:[],hasPim:!0},{title:"Je compare ce que raconte le graphique avec mes connaissances.",i:"Je compare ce que raconte le graphique avec mes connaissances.",p:"Avec le neurone m\xE9moire, je repense \xE0 mes connaissances sur le sujet du graphique.",m:["Je me demande si ce que raconte le graphique correspond \xE0 mes connaissances sur le sujet. S\u2019il y a une incoh\xE9rence : soit mes connaissances ne sont pas justes et je les mets \xE0 jour dans ma m\xE9moire, soit mon analyse du graphique est erron\xE9e et je recommence \xE0 la minimission n\xB01."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Math\xE9matiques",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"comprehension-texte-narratif",source:"Compr\xE9hension_texte_narratif.txt",title:"Comprendre un texte narratif",authors:["R\xE9mi SAMIER & Sylvie JACQUES orthophonistes","Anne-Sophie WYFFELS Enseignante RASED"],level:"Primaire",objective:"Comprendre un texte",maximoi:"Mon objectif est de comprendre un texte.",notes:[],minimoi:[{title:"Je lis le texte.",i:"Je veux lire ce qui est \xE9crit.",p:"Je lis les mots et j\u2019active les images en lien avec les mots.",m:["Je dis \xE0 voix haute ou \xE0 voix basse ce qui est \xE9crit."],mem:"",notes:[],hasPim:!0},{title:"Je fais un \xAB petit film \xBB.",i:"Je veux construire un film.",p:"Je lis les mots et j\u2019active les images correspondantes.",m:["Je me construis un film dans ma t\xEAte et je le modifie au fur et \xE0 mesure de l\u2019histoire lue."],mem:"",notes:[],hasPim:!0},{title:"Je raconte ce que j\u2019ai retenu.",i:"Je veux raconter l\u2019histoire le mieux possible.",p:"Je revois mentalement la situation de l\u2019histoire (le petit film).",m:["Je raconte \xE0 voix haute le \xAB petit film \xBB que je me suis construit."],mem:"",notes:["Outil : tableau d\u2019analyse de ce que je sais et de ce que je ne sais pas (3QOCPP)."],hasPim:!0},{title:"Si j\u2019ai oubli\xE9 des informations, je relis mon texte pour am\xE9liorer mon \xAB petit film \xBB.",i:"Je veux relire le texte pour am\xE9liorer le \xAB petit film \xBB.",p:"Je lis le texte et j\u2019active les images correspondantes.",m:["J\u2019efface, j\u2019ajoute ou je change certaines images de mon premier film en fonction de ce que je d\xE9couvre \xE0 ma deuxi\xE8me lecture."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Lecture",publics:["\xC9l\xE9mentaire"],kind:"pim"},{id:"commentaire-compose",source:"Commentaire_compose.txt",title:"Commentaire compos\xE9",authors:["R\xE9mi SAMIER & Sylvie JACQUES orthophonistes","Emmanuelle BOUTEILLER professeur de lettres"],level:"Lyc\xE9e",objective:"\xC9crire un commentaire compos\xE9 sur un texte litt\xE9raire.",maximoi:"Mon objectif est d\u2019\xE9crire un commentaire compos\xE9 sur un texte litt\xE9raire.",notes:["Utilisation en r\xE9\xE9ducation.","Minimissions \xAB pr\xE9alable \xBB (\xE0 faire au brouillon) : 1 \xE0 9. Minimissions \xAB r\xE9daction \xBB : 10 \xE0 13. Minimissions \xAB relecture et v\xE9rification \xBB : 14 \xE0 16."],minimoi:[{title:"Prendre les indices sur le texte litt\xE9raire pour conna\xEEtre le type d\u2019\u0153uvre, l\u2019\xE9poque, le contexte, l\u2019auteur",i:"Je recherche les informations importantes dans le paratexte (toutes les informations autour du texte).",p:"Je regarde et je s\xE9lectionne les informations importantes dans le paratexte : date, auteur, type de texte, etc.",m:["Je surligne les informations importantes pour les garder en t\xEAte avant de lire le texte."],mem:"",notes:[],hasPim:!0},{title:"Lire le texte pour le d\xE9couvrir et le comprendre",i:"Je veux lire le texte pour le comprendre.",p:"Je lis le texte.",m:["Je cr\xE9e des images dans ma t\xEAte (voir, entendre, sentir, ressentir ce qui est \xE9crit dans le texte)."],mem:"",notes:[],hasPim:!0},{title:"Rechercher les caract\xE9ristiques du texte",i:"Identifier les caract\xE9ristiques du texte.",p:"Je regarde les informations du texte et du paratexte qui permettent d\u2019identifier les caract\xE9ristiques du texte.",m:["Je r\xE9ponds aux questions AMGETRO sur mon brouillon."],mem:"",notes:["Liste des questions AMGETRO :","\u2610 Auteur ?","\u2610 Mouvement litt\xE9raire ?","\u2610 Genre ? Th\xE9\xE2tre, Po\xE9sie, Roman, Essai","\u2610 \xC9poque ?","\u2610 Th\xE8me ?","\u2610 Registre ? Comique, Pol\xE9mique, Path\xE9tique, Lyrique, Tragique, Dramatique, Fantastique","\u2610 \u0152uvre ? Titre, place de cette \u0153uvre dans l\u2019ensemble des \u0153uvres de l\u2019auteur"],hasPim:!0},{title:"Identifier les proc\xE9d\xE9s litt\xE9raires utilis\xE9s par l\u2019auteur",i:"Je veux d\xE9couvrir les techniques d\u2019\xE9criture (les proc\xE9d\xE9s litt\xE9raires) qu\u2019a utilis\xE9es l\u2019auteur.",p:"Je lis et je recherche tous les proc\xE9d\xE9s litt\xE9raires que je connais et que l\u2019auteur pourrait utiliser pour atteindre son objectif.",m:["Je surligne dans le texte et je note au brouillon dans le tableau \xAB proc\xE9d\xE9s litt\xE9raires \xBB tous les proc\xE9d\xE9s utilis\xE9s par l\u2019auteur et je cherche l\u2019effet provoqu\xE9 par ces proc\xE9d\xE9s."],mem:"",notes:["Liste des proc\xE9d\xE9s litt\xE9raires :","\u2022 Vocabulaire : registre de langage (familier, soutenu, etc.), champs lexicaux","\u2022 Figures de style : analogie, comparaison, m\xE9taphore, personnification, all\xE9gorie","\u2022 Substitution : m\xE9tonymie, synecdoque, p\xE9riphrase","\u2022 Insistance ou att\xE9nuation : hyperbole, accumulation, gradation, anaphore, parall\xE9lisme, litote, euph\xE9misme","\u2022 Opposition : antith\xE8se, oxymore, antiphrase, chiasme, paradoxe","\u2022 Rupture : anacoluthe, ellipse, zeugma","\u2022 Jeux de sons : assonance, allit\xE9ration, paronomase","\u2022 Versification : rythme, types de vers, strophes","Tableau des proc\xE9d\xE9s litt\xE9raires : en haut, l\u2019id\xE9e / intention de l\u2019auteur (pour un paragraphe) ; puis trois colonnes : Exemple (citation) | Nom du proc\xE9d\xE9 litt\xE9raire | Effet produit sur le lecteur. Exemple : \xAB Le soleil noir de ma vie \xBB | Oxymore | Sensation d\u2019une tristesse profonde."],hasPim:!0},{title:"Identifier les id\xE9es et les intentions de l\u2019auteur",i:"Je cherche \xE0 exprimer les id\xE9es et les intentions de l\u2019auteur.",p:"J\u2019analyse l\u2019ensemble des effets produits paragraphe par paragraphe.",m:["Je d\xE9duis l\u2019id\xE9e ou l\u2019intention de l\u2019auteur \xE0 partir des effets produits. Je note cette id\xE9e/intention dans la case en haut du tableau \xAB Proc\xE9d\xE9s litt\xE9raires \xBB."],mem:"",notes:[],hasPim:!0},{title:"Formuler une hypoth\xE8se g\xE9n\xE9rale sur l\u2019intention de l\u2019auteur, son objectif, ses motivations",i:"Je veux comprendre pourquoi l\u2019auteur a \xE9crit ce texte (j\u2019essaie de me mettre \xE0 sa place, comme un profiler).",p:"Je repense \xE0 l\u2019analyse des proc\xE9d\xE9s litt\xE9raires, aux images cr\xE9\xE9es par la lecture, aux \xE9motions que j\u2019ai ressenties en lisant le texte.",m:["Je m\u2019imagine \xE0 la place de l\u2019auteur et j\u2019essaie d\u2019imaginer pourquoi il a \xE9crit ce texte : \xAB quel \xE9tait son objectif final ? \xBB."],mem:"",notes:[],hasPim:!0},{title:"Rechercher les int\xE9r\xEAts du texte",i:"Je cherche tous les int\xE9r\xEAts que suscite le texte (du point de vue du lecteur et du point de vue de l\u2019auteur).",p:"Je repense \xE0 l\u2019analyse des proc\xE9d\xE9s litt\xE9raires, aux images cr\xE9\xE9es par la lecture, aux \xE9motions que j\u2019ai ressenties en lisant le texte.",m:["Je note au brouillon toutes les id\xE9es qui me viennent pour exprimer les int\xE9r\xEAts du texte. Parmi toutes ces id\xE9es, j\u2019essaie de trouver l\u2019int\xE9r\xEAt principal en lien avec l\u2019objectif final de l\u2019auteur."],mem:"",notes:[],hasPim:!0},{title:"Formuler une probl\xE9matique (une question) qui va structurer le commentaire compos\xE9",i:"Je cherche une question que l\u2019on va utiliser pour organiser les id\xE9es dans l\u2019\xE9criture du commentaire.",p:"Je regarde les id\xE9es et les intentions de l\u2019auteur, les int\xE9r\xEAts du texte pour chercher une question qui reprenne l\u2019ensemble de ces points.",m:["Je formule une question indirecte. Les r\xE9ponses \xE0 cette question correspondent aux grandes id\xE9es d\xE9velopp\xE9es dans les parties du commentaire."],mem:"",notes:[],hasPim:!0},{title:"Organiser le plan du commentaire",i:"Je veux \xE9laborer le plan de mon commentaire.",p:"Je relis ma probl\xE9matique, les int\xE9r\xEAts du texte et les id\xE9es/intentions de l\u2019auteur.",m:["J\u2019\xE9cris le titre de mes grandes parties pour r\xE9pondre \xE0 la probl\xE9matique. Les sous-id\xE9es de mes parties sont des arguments pour justifier l\u2019id\xE9e principale de la partie. Pour chaque sous-id\xE9e, je cite des exemples en m\u2019appuyant sur le tableau \xAB proc\xE9d\xE9s litt\xE9raires \xBB."],mem:"",notes:[],hasPim:!0},{title:"Se rappeler les r\xE8gles d\u2019\xE9criture du commentaire compos\xE9",i:"Je me rappelle les r\xE8gles d\u2019\xE9criture avant de me lancer dans la r\xE9daction.",p:"Je me redis ou je revois mentalement les diff\xE9rentes r\xE8gles d\u2019\xE9criture.",m:["Je commence la r\xE9daction en respectant les r\xE8gles d\u2019\xE9criture du commentaire compos\xE9. Je coche ces r\xE8gles au fur et \xE0 mesure que je les utilise."],mem:"",notes:["Les r\xE8gles d\u2019\xE9criture du commentaire compos\xE9 :","\u2022 Ne jamais donner son avis personnel en utilisant \xAB je \xBB / \xAB me \xBB.","\u2022 Ne pas faire appara\xEEtre les titres des parties.","\u2022 Laisser un espace pour l\u2019introduction (l\u2019\xE9crire en dernier de pr\xE9f\xE9rence).","\u2022 R\xE9diger les parties : titre de partie = \xE9l\xE9ment de r\xE9ponse de la probl\xE9matique ; sous-id\xE9e = argument qui justifie l\u2019id\xE9e principale ; exemples = citation et explicitation des proc\xE9d\xE9s litt\xE9raires dont les effets justifient l\u2019argument.","\u2022 Revenir \xE0 la ligne avec un alin\xE9a pour chaque sous-partie, mais sans sauter de ligne.","\u2022 \xC0 la fin de la premi\xE8re grande partie, rappeler ce que l\u2019on a d\xE9montr\xE9 et annoncer la deuxi\xE8me partie.","\u2022 Sauter une ligne entre deux grandes parties.","\u2022 Conclusion : r\xE9sumer les id\xE9es des titres de chaque partie qui r\xE9pondent \xE0 la probl\xE9matique (3 \xE0 6 lignes) ; ouvrir sur un autre sujet en lien avec la probl\xE9matique : question proche, lien avec un autre art, un autre texte (2 \xE0 4 lignes).","\u2022 Introduction (15 lignes) : situer le texte et son auteur ; montrer l\u2019int\xE9r\xEAt du texte et pr\xE9senter la probl\xE9matique ; annoncer le plan ; un seul paragraphe ; sauter une ligne apr\xE8s l\u2019introduction."],hasPim:!0},{title:"R\xE9diger les parties du commentaire compos\xE9",i:"Je veux \xE9crire les parties du commentaire compos\xE9 pour r\xE9pondre \xE0 la probl\xE9matique.",p:"Je m\u2019appuie sur la probl\xE9matique, le plan, le tableau des proc\xE9d\xE9s litt\xE9raires et le texte.",m:["Je pr\xE9sente l\u2019id\xE9e principale de chaque grande partie.","Pour chaque argument, je cite un ou plusieurs exemples en m\u2019appuyant sur le tableau des proc\xE9d\xE9s litt\xE9raires.","J\u2019utilise des connecteurs logiques pour expliquer les liens entre les id\xE9es (les phrases)."],mem:"",notes:[],hasPim:!0},{title:"R\xE9diger la conclusion",i:"Je veux \xE9crire la conclusion.",p:"Je relis la probl\xE9matique, les titres des parties, et j\u2019imagine une ouverture int\xE9ressante.",m:["Je r\xE9sume ma r\xE9ponse \xE0 la probl\xE9matique.","Je pr\xE9sente une ouverture qui permet de faire un lien avec une autre question, un autre domaine artistique, etc."],mem:"",notes:[],hasPim:!0},{title:"R\xE9diger l\u2019introduction",i:"Je veux \xE9crire l\u2019introduction.",p:"Je relis mes r\xE9ponses aux questions AMGETRO, les int\xE9r\xEAts du texte et la probl\xE9matique.",m:["Je pr\xE9sente le texte, l\u2019auteur, l\u2019int\xE9r\xEAt du texte, la probl\xE9matique et l\u2019annonce du plan.","J\u2019utilise des connecteurs logiques pour expliquer les liens entre les id\xE9es (les phrases)."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier la coh\xE9rence du commentaire compos\xE9",i:"Je veux v\xE9rifier la coh\xE9rence de mon commentaire.",p:"Je relis mon commentaire.",m:["Je v\xE9rifie que mon introduction pr\xE9sente bien le texte, l\u2019auteur et la probl\xE9matique.","Les parties doivent permettre de r\xE9pondre \xE0 la probl\xE9matique.","La conclusion doit r\xE9sumer mon argumentation et ouvrir sur un autre sujet."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier le respect des r\xE8gles d\u2019\xE9criture",i:"Je veux v\xE9rifier le respect des r\xE8gles d\u2019\xE9criture.",p:"Je relis mon commentaire.",m:["Je coche d\u2019une autre couleur les diff\xE9rents points de la liste des r\xE8gles d\u2019\xE9criture au fur et \xE0 mesure de ma lecture pour v\xE9rifier que j\u2019ai bien respect\xE9 l\u2019ensemble des r\xE8gles."],mem:"",notes:[],hasPim:!0},{title:"Corriger les erreurs d\u2019orthographe",i:"Je veux corriger mes erreurs d\u2019orthographe.",p:"Je relis mon commentaire phrase par phrase en commen\xE7ant par la fin (pour ne pas \xEAtre happ\xE9 par le sens g\xE9n\xE9ral du texte).",m:["Je suis les \xE9tapes du code CHAMPIONS pour relire mes phrases et corriger les erreurs d\u2019orthographe."],mem:"",notes:["Code CHAMPIONS pour l\u2019orthographe :","N comme N\xE9ant : v\xE9rifier les oublis de mots.","S comme Sons, sens et syntaxe : v\xE9rifier les sons, le sens et la syntaxe (ordre des mots) de la phrase.","A comme Accord du groupe nominal : v\xE9rifier les noms, les d\xE9terminants et les adjectifs (ex. Les actions gagnantes). Masculin ou f\xE9minin ? Singulier ou pluriel ?","H comme Homophone : a, \xE0 / et, est / on, ont / tous, tout / ce, se / ces, ses, c\u2019est / son, sont.","I comme Infinitif / Participe pass\xE9 / Imparfait : v\xE9rifier les verbes qui finissent en [\xE9]. Prendre \u2192 infinitif \u2192 -er ; Pris \u2192 participe pass\xE9 \u2192 \xE9(e)(s), qui est-ce qui est ? ; Prenais / Prenait / Prenaient \u2192 imparfait : v\xE9rifier la conjugaison (code C).","C comme Conjugaison : v\xE9rifier la conjugaison entre le verbe et son sujet.","P comme Ponctuation.","M comme Majuscule en d\xE9but de phrase et au nom propre.","O comme Orthographe des mots : v\xE9rifier la photographie du mot (ex. Pharmacie)."],hasPim:!0}],expert:[],domain:"\xC9criture & langue",publics:["Lyc\xE9e"],kind:"pim"},{id:"bdc-pim-03",source:"bdc_pim_03.txt",title:"D\xE9placer un verre d\u2019eau rempli \xE0 ras bord sans renverser",authors:["Banque de PIM"],level:"Tous",objective:"D\xE9placer un verre d\u2019eau rempli \xE0 ras bord sans renverser",maximoi:"Mon objectif est de d\xE9placer un verre d\u2019eau rempli \xE0 ras bord sans renverser.",notes:[],minimoi:[{title:"D\xE9placer le verre",i:"\xC9viter que l\u2019eau d\xE9borde du verre.",p:"Regarder l\u2019\xE9cart entre la ligne d\u2019eau et le haut du verre.",m:["Contr\xF4ler finement les mouvements des mains qui tiennent le verre."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Motricit\xE9",publics:["Sans niveau pr\xE9cis"],kind:"pim"},{id:"bdc-pim-02-1",source:"bdc_pim_02.txt",title:"\xC9crire une dissertation en fran\xE7ais",authors:["Banque de PIM"],level:"Lyc\xE9e",objective:"\xC9crire une dissertation en fran\xE7ais de mani\xE8re efficace.",maximoi:"Mon objectif est d\u2019\xE9crire une dissertation en fran\xE7ais de mani\xE8re efficace.",notes:[],minimoi:[{title:"PIM 1 : Comprendre le sujet et \xE9tablir une probl\xE9matique",i:"Identifier pr\xE9cis\xE9ment le sujet de la dissertation et formuler une probl\xE9matique claire.",p:"Se concentrer sur les mots cl\xE9s du sujet et leur sens pr\xE9cis.",m:["Souligner les mots-cl\xE9s du sujet et r\xE9diger une phrase interrogative qui synth\xE9tise le c\u0153ur du sujet."],mem:"",notes:[],hasPim:!0},{title:"PIM 2 : \xC9laborer un plan d\xE9taill\xE9",i:"Structurer les id\xE9es principales et secondaires.",p:"Visualiser les grandes parties (introduction, d\xE9veloppement en deux ou trois parties, conclusion).",m:["Sur une feuille brouillon, diviser en grandes parties avec des titres provisoires et noter sous chaque titre les id\xE9es cl\xE9s et les exemples."],mem:"",notes:[],hasPim:!0},{title:"PIM 3 : R\xE9diger l\u2019introduction",i:"Pr\xE9senter le sujet, la probl\xE9matique, et annoncer le plan.",p:"Relire la probl\xE9matique et v\xE9rifier sa pertinence.",m:["\xC9crire un paragraphe qui situe le sujet, formule la probl\xE9matique et pr\xE9sente les grandes parties du d\xE9veloppement."],mem:"",notes:[],hasPim:!0},{title:"PIM 4 : R\xE9diger les parties du d\xE9veloppement",i:"R\xE9diger chaque partie en r\xE9pondant \xE0 un aspect de la probl\xE9matique.",p:"Se concentrer sur le lien entre l\u2019id\xE9e principale et les exemples.",m:["Pour chaque partie, r\xE9diger un paragraphe avec une id\xE9e principale, deux ou trois arguments ou exemples, et une phrase de transition."],mem:"",notes:[],hasPim:!0},{title:"PIM 5 : R\xE9diger la conclusion",i:"R\xE9pondre \xE0 la probl\xE9matique de mani\xE8re synth\xE9tique et ouvrir sur une r\xE9flexion.",p:"Relire les arguments pour v\xE9rifier leur coh\xE9rence.",m:["\xC9crire deux paragraphes : le premier r\xE9sume les r\xE9ponses \xE0 la probl\xE9matique, le second propose une ouverture."],mem:"",notes:[],hasPim:!0},{title:"PIM 6 : Relire et corriger",i:"Am\xE9liorer la clart\xE9 et corriger les erreurs.",p:"Se concentrer sur une lecture lente pour rep\xE9rer les fautes.",m:["Lire chaque phrase \xE0 voix basse pour v\xE9rifier la syntaxe, l\u2019orthographe et les accords."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"\xC9criture & langue",publics:["Lyc\xE9e"],kind:"pim"},{id:"bdc-pim-02-2",source:"bdc_pim_02.txt",title:"R\xE9aliser une \xE9tude de documents en histoire-g\xE9ographie",authors:["Banque de PIM"],level:"Coll\xE8ge \u2013 Lyc\xE9e",objective:"R\xE9aliser une \xE9tude de documents en histoire-g\xE9ographie de mani\xE8re organis\xE9e et pr\xE9cise.",maximoi:"Mon objectif est de r\xE9aliser une \xE9tude de documents en histoire-g\xE9ographie de mani\xE8re organis\xE9e et pr\xE9cise.",notes:[],minimoi:[{title:"PIM 1 : Comprendre la consigne",i:"Identifier clairement ce que la consigne demande.",p:"Se concentrer sur les mots cl\xE9s de la consigne (verbes d\u2019action : analyser, comparer, expliquer, etc.).",m:["Lire la consigne deux fois, surligner les mots importants et reformuler la consigne dans ses propres mots."],mem:"",notes:[],hasPim:!0},{title:"PIM 2 : Identifier les documents et leurs caract\xE9ristiques",i:"Comprendre la nature et l\u2019objectif de chaque document.",p:"Observer les titres, l\xE9gendes, dates, et auteurs des documents.",m:["Lister sur un brouillon pour chaque document : type (texte, carte, tableau), contexte historique ou g\xE9ographique, et information principale."],mem:"",notes:[],hasPim:!0},{title:"PIM 3 : Lire et analyser chaque document",i:"Extraire les informations pertinentes des documents.",p:"Porter attention aux d\xE9tails comme les chiffres, les zones color\xE9es (sur les cartes), ou les termes cl\xE9s (dans les textes).",m:["Pour chaque document, r\xE9pondre \xE0 ces trois questions :","1. Que dit le document ?","2. Quels \xE9l\xE9ments factuels ressortent ?","3. Comment se relie-t-il au sujet ?"],mem:"",notes:[],hasPim:!0},{title:"PIM 4 : Croiser les informations des documents",i:"Trouver les points communs et les divergences entre les documents.",p:"Comparer les donn\xE9es, les points de vue ou les perspectives historiques ou g\xE9ographiques.",m:["Faire un tableau ou une liste avec deux colonnes : similitudes et diff\xE9rences."],mem:"",notes:[],hasPim:!0},{title:"PIM 5 : R\xE9diger la synth\xE8se",i:"Structurer les id\xE9es et r\xE9pondre \xE0 la probl\xE9matique.",p:"Visualiser les grandes parties de la r\xE9ponse en lien avec les documents.",m:["R\xE9diger une introduction qui pr\xE9sente le sujet et les documents, d\xE9velopper les id\xE9es principales en s\u2019appuyant sur les documents, et conclure en r\xE9pondant \xE0 la probl\xE9matique."],mem:"",notes:[],hasPim:!0},{title:"PIM 6 : Relire et v\xE9rifier",i:"S\u2019assurer que la r\xE9ponse est claire, pr\xE9cise, et sans erreur.",p:"Se concentrer sur les transitions entre les id\xE9es et les r\xE9f\xE9rences aux documents.",m:["Relire en v\xE9rifiant si chaque document a \xE9t\xE9 utilis\xE9 et si les phrases sont coh\xE9rentes avec la consigne."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Histoire-g\xE9ographie",publics:["Coll\xE8ge","Lyc\xE9e"],kind:"pim"},{id:"bdc-pim-02-3",source:"bdc_pim_02.txt",title:"Calculer un prix apr\xE8s une r\xE9duction en pourcentage",authors:["Banque de PIM"],level:"Cycle 4",objective:"Calculer le prix d\u2019un objet apr\xE8s une r\xE9duction en pourcentage de mani\xE8re pr\xE9cise et organis\xE9e.",maximoi:"Mon objectif est de calculer le prix d\u2019un objet apr\xE8s une r\xE9duction en pourcentage de mani\xE8re pr\xE9cise et organis\xE9e.",notes:[],minimoi:[{title:"PIM 1 : Comprendre l\u2019\xE9nonc\xE9",i:"Identifier les informations donn\xE9es et ce qui est demand\xE9.",p:"Se concentrer sur les donn\xE9es chiffr\xE9es (prix initial, pourcentage de r\xE9duction) et sur la question pos\xE9e.",m:["Lire attentivement l\u2019\xE9nonc\xE9, souligner les donn\xE9es importantes, et reformuler la question dans ses propres mots (par exemple : \xAB Quel est le prix final apr\xE8s r\xE9duction ? \xBB)."],mem:"",notes:[],hasPim:!0},{title:"PIM 2 : Identifier la formule \xE0 utiliser",i:"Savoir comment calculer la r\xE9duction et le prix final.",p:"Focaliser son attention sur la m\xE9thode de calcul (r\xE9duction = prix initial \xD7 pourcentage / 100).",m:["\xC9crire sur un brouillon la formule suivante : Prix final = Prix initial \u2212 (Prix initial \xD7 Pourcentage / 100)."],mem:"",notes:[],hasPim:!0},{title:"PIM 3 : Effectuer le calcul pas \xE0 pas",i:"R\xE9aliser les calculs \xE9tape par \xE9tape pour \xE9viter les erreurs.",p:"Porter attention aux unit\xE9s (euros, pourcentage) et aux op\xE9rations.",m:["1. Multiplier le prix initial par le pourcentage, puis diviser par 100 pour trouver le montant de la r\xE9duction.","2. Soustraire le montant de la r\xE9duction au prix initial pour obtenir le prix final."],mem:"",notes:[],hasPim:!0},{title:"PIM 4 : V\xE9rifier le r\xE9sultat",i:"S\u2019assurer que le calcul est correct.",p:"V\xE9rifier chaque \xE9tape en refaisant les op\xE9rations.",m:["Refaire rapidement les calculs \xE0 l\u2019envers (ajouter la r\xE9duction au prix final pour retrouver le prix initial)."],mem:"",notes:[],hasPim:!0},{title:"PIM 5 : Formuler la r\xE9ponse",i:"Pr\xE9senter la r\xE9ponse clairement et avec les bonnes unit\xE9s.",p:"Relire l\u2019\xE9nonc\xE9 pour v\xE9rifier que la r\xE9ponse correspond \xE0 la question pos\xE9e.",m:["\xC9crire la r\xE9ponse finale sous la forme d\u2019une phrase compl\xE8te (par exemple : \xAB Le prix apr\xE8s r\xE9duction est de 80 euros. \xBB)."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Math\xE9matiques",publics:["Coll\xE8ge"],kind:"pim"},{id:"bdc-pim-02-4",source:"bdc_pim_02.txt",title:"M\xE9moriser une carte en g\xE9ographie",authors:["Banque de PIM"],level:"Coll\xE8ge \u2013 Lyc\xE9e",objective:"M\xE9moriser une carte en g\xE9ographie.",maximoi:"Mon objectif est de m\xE9moriser une carte en g\xE9ographie.",notes:[],minimoi:[{title:"PIM 1 : Comprendre la carte",i:"Identifier les \xE9l\xE9ments cl\xE9s de la carte \xE0 m\xE9moriser (villes, pays, fleuves, montagnes, etc.).",p:"Se concentrer sur la l\xE9gende, les couleurs et les formes g\xE9ographiques.",m:["Lire la l\xE9gende et pointer sur la carte les \xE9l\xE9ments importants pour faire le lien entre les symboles et leur emplacement."],mem:"",notes:[],hasPim:!0},{title:"PIM 2 : D\xE9couper la carte en zones",i:"Diviser la carte en sections plus petites pour mieux les m\xE9moriser.",p:"Visualiser chaque zone s\xE9par\xE9ment (par exemple, nord, sud, est, ouest).",m:["Tracer mentalement ou physiquement des lignes pour d\xE9limiter les zones et travailler sur une seule \xE0 la fois."],mem:"",notes:[],hasPim:!0},{title:"PIM 3 : Utiliser des associations mentales",i:"Relier chaque \xE9l\xE9ment \xE0 un mot, une image ou une histoire pour mieux le retenir.",p:"Imaginer des sc\xE8nes ou des mots-cl\xE9s en lien avec les noms ou formes des lieux.",m:["Associer un lieu \xE0 une image ou une phrase (exemple : \xAB Paris est une \xE9toile au centre de la France \xBB)."],mem:"",notes:[],hasPim:!0},{title:"PIM 4 : V\xE9rifier en r\xE9p\xE9tant",i:"V\xE9rifier ce qui a \xE9t\xE9 m\xE9moris\xE9 et rep\xE9rer ce qui reste \xE0 apprendre.",p:"Fermer les yeux et tenter de visualiser la carte ou nommer les lieux.",m:["Tester ses connaissances en pointant des \xE9l\xE9ments au hasard sur la carte et en les nommant."],mem:"",notes:[],hasPim:!0},{title:"PIM 5 : Consolider avec des outils",i:"R\xE9viser r\xE9guli\xE8rement pour renforcer la m\xE9morisation.",p:"Utiliser des flashcards, des jeux ou des quiz en lien avec la carte.",m:["Cr\xE9er un quiz ou demander \xE0 quelqu\u2019un de poser des questions sur la carte."],mem:"",notes:[],hasPim:!0},{title:"PIM 6 : Se raconter la carte",i:"Transformer les informations visuelles de la carte en phrases ou histoires pour mieux les retenir.",p:"Se concentrer sur chaque \xE9l\xE9ment important de la carte (noms, formes, emplacements) et imaginer une explication ou une description verbale.",m:["D\xE9crire la carte \xE0 voix haute ou mentalement comme si l\u2019on racontait un r\xE9cit (par exemple : \xAB Le Rh\xF4ne commence dans les Alpes, traverse Lyon et se jette dans la M\xE9diterran\xE9e \xBB)."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"Histoire-g\xE9ographie",publics:["Coll\xE8ge","Lyc\xE9e"],kind:"pim"},{id:"autocorrection-production-ecrite",source:"Autocorrection_production_ecrite.txt",title:"Autocorrection d\u2019une production \xE9crite",authors:["R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"Fin primaire \u2013 Coll\xE8ge",objective:"R\xE9duire le nombre d\u2019erreurs dans une production \xE9crite.",maximoi:"Mon objectif est d\u2019autocorriger une production \xE9crite (dict\xE9e ou r\xE9daction).",notes:[],minimoi:[{title:"Rechercher les mots oubli\xE9s",i:"Je veux v\xE9rifier que je n\u2019ai pas oubli\xE9 de mots.",p:"Je relis mon \xE9crit lentement en \xE9coutant ma petite voix.",m:["Quand je me rends compte qu\u2019il manque un mot, je m\u2019arr\xEAte et je le rajoute."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier le sens des phrases",i:"Je veux v\xE9rifier que mes phrases ont du sens.",p:"Je relis mon \xE9crit lentement en \xE9coutant ma petite voix.",m:["Je v\xE9rifie que mes phrases permettent bien de construire un petit film avec des images et des mots."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier les majuscules et la ponctuation",i:"Je veux v\xE9rifier les majuscules et la ponctuation.",p:"Je relis mes phrases, je regarde leur longueur et je compte le nombre d\u2019id\xE9es par phrase.",m:["Si les phrases sont trop longues, je d\xE9coupe pour avoir une id\xE9e par phrase. Je pense \xE0 mettre mon point et ma majuscule."],mem:"",notes:[],hasPim:!0},{title:"Corriger les erreurs de sons",i:"Je veux corriger les erreurs de sons.",p:"Je relis lentement en pronon\xE7ant pr\xE9cis\xE9ment les sons \xE9crits.",m:["Si je d\xE9tecte une erreur entre le son prononc\xE9 et le son attendu, je la corrige."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier les accords des groupes nominaux",i:"Je veux v\xE9rifier les accords des groupes nominaux.",p:"Je rep\xE8re le nom, son d\xE9terminant et \xE9ventuellement son ou ses adjectifs m\xEAme s\u2019ils sont loin dans la phrase.",m:["Je me demande quel est le genre et quel est le nombre pour mettre les marques d\u2019accord qui correspondent."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier les homophones grammaticaux et lexicaux",i:"Je veux v\xE9rifier les homophones grammaticaux et lexicaux.",p:"Je cherche les homophones pour lesquels je sais que je fais des erreurs.",m:["Je retrouve en m\xE9moire les strat\xE9gies pour ne pas les confondre et je les corrige s\u2019il y a une erreur."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier les verbes en [\xE9]",i:"Je veux v\xE9rifier les verbes en [\xE9] pour les \xE9crire correctement : er, \xE9, ais, ait, aient, ai, ez.",p:"Je rep\xE8re les verbes qui se terminent en [\xE9].",m:["Je retrouve en m\xE9moire la strat\xE9gie pour \xE9crire la bonne terminaison."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier la conjugaison des verbes",i:"Je veux v\xE9rifier la conjugaison des verbes.",p:"Je rep\xE8re les verbes (les mots qui servent \xE0 dire une action ou un \xE9tat) et leur sujet.",m:["Je me demande \xE0 quel temps et \xE0 quelle personne il est conjugu\xE9 pour \xE9crire la bonne terminaison."],mem:"",notes:[],hasPim:!0},{title:"V\xE9rifier l\u2019orthographe des mots",i:"Je veux v\xE9rifier l\u2019orthographe des mots.",p:"Je recherche la sensation d\u2019erreur quand je lis un mot.",m:["Si j\u2019ai un doute, je cherche le f\xE9minin ou un mot de la m\xEAme famille. J\u2019\xE9cris le mot avec les diff\xE9rentes orthographes possibles et je choisis celle qui me semble la plus famili\xE8re."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"\xC9criture & langue",publics:["\xC9l\xE9mentaire","Coll\xE8ge"],kind:"pim"},{id:"atelier-ecriture-1",source:"Atelier_ecriture.txt",title:"Atelier d\u2019\xE9criture : d\xE9crire un monstre",authors:["Agn\xE8s GABARD Professeur de Lettres","R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"6e",objective:"\xC9crire une description de monstre sur le th\xE8me de la mythologie grecque.",maximoi:"Mon objectif est de d\xE9crire un monstre.",notes:[],minimoi:[{title:"Imaginer la forme du monstre",i:"Je veux d\xE9finir la forme, l\u2019apparence du monstre.",p:"Avec l\u2019aide du neurone m\xE9moire, je repense aux diff\xE9rents monstres de la mythologie que je connais.",m:["J\u2019imagine un monstre et les diff\xE9rentes parties de son corps. Je remplis le tableau \xAB Fiche d\u2019identit\xE9 du monstre \xBB."],mem:"",notes:["Neurone m\xE9moire : je repense aux principaux monstres de la mythologie grecque : Minotaure, Sphynge, Hydre, Centaure, P\xE9gase, Gorgone, Sir\xE8ne, G\xE9ant."],hasPim:!0},{title:"Caract\xE9riser le monstre",i:"Je veux d\xE9crire les caract\xE9ristiques du monstre.",p:"Dans ma t\xEAte, je repense au monstre que j\u2019ai imagin\xE9, \xE0 ses diff\xE9rentes parties.",m:["Avec l\u2019aide de la fiche d\u2019identit\xE9 du monstre, j\u2019\xE9cris des adjectifs pour pr\xE9ciser les diff\xE9rentes parties et les caract\xE9ristiques du monstre."],mem:"",notes:[],hasPim:!0},{title:"R\xE9diger au brouillon la description du monstre",i:"Je veux r\xE9diger la description du monstre.",p:"Je relis les informations de la fiche d\u2019identit\xE9 du monstre et les adjectifs que j\u2019ai trouv\xE9s.",m:["Au brouillon, j\u2019\xE9cris des phrases \xE0 l\u2019imparfait pour reprendre les informations de la fiche d\u2019identit\xE9 du monstre et les adjectifs caract\xE9risant le monstre."],mem:"",notes:[],hasPim:!0},{title:"Corriger le brouillon de la description",i:"Je veux corriger le brouillon de la description.",p:"Je relis les phrases de la description.",m:["Je v\xE9rifie que j\u2019ai bien conjugu\xE9 les verbes \xE0 l\u2019imparfait et que j\u2019ai bien accord\xE9 mes groupes nominaux (noms et adjectifs)."],mem:"",notes:[],hasPim:!0},{title:"Recopier la description au propre",i:"Je veux recopier la description au propre.",p:"Je lis une par une les phrases de mon brouillon.",m:["Je les recopie une par une au propre."],mem:"",notes:[],hasPim:!0}],expert:[],domain:"\xC9criture & langue",publics:["Coll\xE8ge"],kind:"pim"},{id:"atelier-ecriture-2",source:"Atelier_ecriture.txt",title:"Atelier d\u2019\xE9criture : raconter un combat",authors:["Agn\xE8s GABARD Professeur de Lettres","R\xE9mi SAMIER & Sylvie JACQUES orthophonistes"],level:"6e",objective:"\xC9crire un r\xE9cit de combat sur le th\xE8me de la mythologie grecque.",maximoi:"Mon objectif est de raconter le combat entre Jason et le monstre.",notes:[],minimoi:[{title:"Imaginer le \xAB film \xBB des actions du combat.",i:"Je veux imaginer les actions du combat.",p:"Avec l\u2019aide
